  const cj=jobs.filter(j=>j.custId===c.id).sort((a,b)=>dateFromStr(b.date)-dateFromStr(a.date));
  const done=cj.filter(j=>j.status==='afgerond');
  const rev=done.length*(c.price||0);
  return`
    <button class="back-btn" onclick="nav('customers')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Klanten</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">

          <div><div style="font-size:20px;font-weight:800">${esc(c.name)}</div>
          ${c.frequency&&c.frequency!=='none'?`<span class="freq-chip">${FREQS[c.frequency]}</span>`:''}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="nav('editcustomer','${c.id}')">✏️ Bewerk</button>
      </div>
      <div class="info-rows" style="margin-bottom:0">
        <div class="info-row">
          <span class="ir-lbl">Adres</span>
          <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
            <a class="ir-val" href="https://maps.google.com/?q=${encodeURIComponent(c.address)}" target="_blank" style="flex:1;min-width:0">${esc(c.address)} ↗</a>
            ${c.address?`<button onclick="openDakCalculator(null,${JSON.stringify(c.address)})" style="flex-shrink:0;padding:5px 10px;border-radius:8px;border:1.5px solid var(--primary);background:var(--primary-light,#e8f0fe);color:var(--primary);font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap">📐 Dak m²</button>`:''}
          </div>
        </div>
        ${c.phone?`<div class="info-row"><span class="ir-lbl">Telefoon</span><div style="display:flex;gap:8px;align-items:center"><a class="ir-val" href="tel:${esc(c.phone)}">${esc(c.phone)}</a><a href="https://wa.me/${fmtWaPhone(c.phone)}" target="_blank" style="background:#25d366;color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;text-decoration:none">WhatsApp</a></div></div>`:''}
        ${isOwner()?`<div class="info-row"><span class="ir-lbl">Prijs</span><span class="ir-val">${c.price?'€'+c.price+' per klus':'—'}</span></div>`:''}
        ${c.notes?`<div class="info-row"><span class="ir-lbl">Notities</span><span class="ir-val" style="color:var(--warning)">${esc(c.notes)}</span></div>`:''}
      </div>
    </div>
    ${(()=>{
      // Last-visit health ribbon
      const lastDone=done[0];
      if(!lastDone||!c.frequency||c.frequency==='none')return'';
      const freqDays=FREQ_DAYS[c.frequency]||0;
      const daysSince=Math.round((dateFromStr(today())-dateFromStr(lastDone.date))/86400000);
      const nextExp=addDays(lastDone.date,freqDays);
      const overdueD=Math.max(0,Math.round((dateFromStr(today())-dateFromStr(nextExp))/86400000));
      const hasFuture=jobs.some(j=>j.custId===c.id&&j.status!=='afgerond'&&j.date>=today());
      if(hasFuture){
        const fut=jobs.filter(j=>j.custId===c.id&&j.status!=='afgerond'&&j.date>=today()).sort((a,b)=>a.date.localeCompare(b.date))[0];
        return'<div class="cust-health cust-health-ok">✅ Gepland op '+fmtShort(fut.date)+'</div>';
      } else if(overdueD>0){
        return'<div class="cust-health cust-health-danger overd-badge">🔴 '+overdueD+' dagen te laat · verwacht was '+fmtShort(nextExp)+'</div>';
      } else {
        const daysLeft=Math.round((dateFromStr(nextExp)-dateFromStr(today()))/86400000);
        return'<div class="cust-health cust-health-warn">🕐 Volgende beurt over '+daysLeft+' dag'+(daysLeft===1?'':'en')+' ('+fmtShort(nextExp)+')</div>';
      }
    })()}
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${cj.length}</div><div class="stat-lbl">Totaal</div></div>

    ${!cj.length?emptyState('📋','Nog geen klussen',''):cj.map(jobCard).join('')}`;
}

function njGetCustAddr(){
  const custId=document.getElementById('nj-cust')?.value;
  return custId?getCust(custId)?.address||'':'';
}

function toggleMeasureRow(id){
  const row=document.getElementById('mrow-'+id);
  if(!row)return;
  const item=[...document.querySelectorAll('#nj-wt .check-item')].find(el=>el.dataset.id===id);
  if(item)row.style.display=item.classList.contains('on')?'block':'none';
}

function getWorkQtys(){
  // returns {workId: qty} for all measure-based work types currently selected
  const qtys={};
  WORK_TYPES.forEach(w=>{
    if(!w.perM2&&!w.perM)return;
    const el=document.getElementById('qty-'+w.id);
    if(el&&el.closest('#nj-wt')){
      const item=[...document.querySelectorAll('#nj-wt .check-item')].find(x=>x.dataset.id===w.id);
      if(item&&item.classList.contains('on')){
        const q=parseFloat(el.value);
        if(q>0)qtys[w.id]=q;
      }
    }
  });
  return qtys;
}

function updateAIPrice(){
  if(!isOwner()){const w=document.getElementById('ai-price-widget');if(w)w.innerHTML='';return;}
  const custId=document.getElementById('nj-cust')?.value;
  const date=document.getElementById('nj-date')?.value;
  const work=[...document.querySelectorAll('#nj-wt .check-item.on')].map(el=>el.dataset.id);
  const qtys=getWorkQtys();
  const widget=document.getElementById('ai-price-widget');
  if(!widget)return;
  if(!custId||!work.length){widget.innerHTML='';return;}
  const r=aiSuggestPrice(custId,work,date,qtys);
  if(!r){widget.innerHTML='';return;}
  const breakdown=r.qtySummary?`<div style="font-size:11px;color:var(--text-muted);margin-top:4px">${r.qtySummary}</div>`:'';
  const srcLabel=r.source==='klantprijs'?'✅ Vaste klantprijs':r.source==='vergelijkbaar'?'👥 Vergelijkbare klanten':r.source==='regio'?'📍 Buurtgemiddelde':'⏱️ Schatting op uurtarief';
  const rangeHtml=r.min===r.max?`<div class="ai-price-range">Vaste prijs — geen bandbreedte</div>`:`<div class="ai-price-range">Bandbreedte: €${r.min} – €${r.max}${r.dataPoints>0?' · '+r.dataPoints+' klussen geleerd':''}</div>`;
  widget.innerHTML=`<div class="ai-price-box">
    <div class="ai-price-box-top">
      <span class="ai-price-title">🧠 AI Prijsvoorstel</span>
      <span class="ai-price-conf">${r.confidence}% zekerheid</span>
    </div>
    <div class="ai-price-value">€${r.suggestion}</div>
    <div style="font-size:11px;font-weight:700;color:var(--primary);margin:2px 0 4px;opacity:.8">${srcLabel}</div>
    ${rangeHtml}
    ${breakdown}
    ${r.notes.map(n=>`<div style="font-size:11px;color:var(--primary);margin-top:3px">💡 ${esc(n)}</div>`).join('')}
  </div>`;
}

function leadOnPaste(e){
  const items=e.clipboardData?.items;
  if(!items)return;
  // Verwijder placeholder
  const ph=document.getElementById('lead-placeholder');if(ph)ph.remove();
  // Zoek afbeeldingen
  for(const item of items){
    if(item.type.startsWith('image/')){
      e.preventDefault();
      const blob=item.getAsFile();
      if(!blob)continue;
      const reader=new FileReader();
      reader.onload=ev=>{
        _leadImages.push({b64:ev.target.result,mime:item.type});
        // Update img preview zonder re-render (voorkomt verlies van tekst)
        const prev=document.getElementById('lead-img-preview');
        if(prev){
          const div=document.createElement('div');
          div.style.cssText='position:relative';
          const i=_leadImages.length-1;
          div.innerHTML=`<img src="${ev.target.result}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:2px solid var(--border)"><button onclick="leadRemoveImg(${i})" style="position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer">×</button>`;
          prev.insertBefore(div,prev.lastElementChild);
        }
        toast('🖼️ Foto geplakt!');
      };
      reader.readAsDataURL(blob);
      return;
    }
  }
}

function leadAddImages(input){
  const files=Array.from(input.files);
  let loaded=0;
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=e=>{
      _leadImages.push({b64:e.target.result,mime:f.type});
      loaded++;
      if(loaded===files.length)render();
    };
    reader.readAsDataURL(f);
  });

function leadRemoveImg(i){_leadImages.splice(i,1);render();}

async function analyseerLead(){
  const el=document.getElementById('lead-tekst');
  const tekst=(el?.innerText||el?.textContent||'').replace(/Tik hier en plak je bericht\.\.\./,'').trim();
  if(!tekst&&!_leadImages.length){toast('⚠️ Voer een bericht in');return;}
  const key=(settings.claudeApiKey||'').trim();
  if(!key){toast('⚠️ Geen Claude API-sleutel');return;}

  const statusEl=document.getElementById('lead-status');
  if(statusEl)statusEl.innerHTML='<span style="color:var(--primary)">⏳ AI analyseert het bericht...</span>';

  const prijsContext=Object.keys(aiModel.prices).length
    ?'Onze gemiddelde prijzen: '+Object.entries(aiModel.prices).map(([k,v])=>`${k}: €${Math.round(v.reduce((a,b)=>a+b,0)/v.length)}`).join(', ')+'.'
    :`Uurtarief: €${settings.hourlyRate}/uur.`;

  const sysPrompt=`Je bent een assistent voor een glazenwassbedrijf. Analyseer het klantbericht en extraheer alle relevante informatie. ${prijsContext} Geef altijd antwoord als geldig JSON object met deze velden: naam, adres, telefoon, werk (beschrijving gevraagd werk), prijsMin (getal, laagste schatting in €), prijsMax (getal, hoogste schatting in €), notities. Gebruik null voor onbekende velden.`;

  const content=[];
  if(tekst)content.push({type:'text',text:'Klantbericht:\n'+tekst});
  _leadImages.forEach(img=>{
    content.push({type:'image',source:{type:'base64',media_type:img.mime,data:img.b64.split(',')[1]}});
  });
  content.push({type:'text',text:'Geef je analyse als JSON.'});

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,system:sysPrompt,messages:[{role:'user',content}]})
    });
    if(!resp.ok){toast('⚠️ AI fout: '+resp.status);return;}
    const data=await resp.json();
    const raw=data.content?.[0]?.text||'';
    const match=raw.match(/\{[\s\S]*\}/);
    if(!match){toast('⚠️ AI gaf geen geldig antwoord');return;}
    _leadResult=JSON.parse(match[0]);
    render();
  }catch(e){toast('⚠️ Fout: '+e.message);}
}

function leadNaarKlant(){
  if(!_leadResult)return;
  // Pre-fill nieuwe klant
  S.preCustomer={
    name:_leadResult.naam||'',
    address:_leadResult.adres||'',
    phone:_leadResult.telefoon||'',
    price:_leadResult.prijsMin||'',
    notes:(_leadResult.werk?'Gevraagd: '+_leadResult.werk:'')+((_leadResult.werk&&_leadResult.notities)?'\n':'')+(_leadResult.notities||''),
  };
  _leadResult=null;
  _leadImages=[];
  nav('editcustomer',null);
  toast('✅ Klantgegevens ingevuld!');
}

function _firstJobDay(){
  // Eerste toekomstige dag (inclusief vandaag) met geplande klussen
  const td=today();
  const days=[...new Set(
    jobs.filter(j=>j.status!=='afgerond'&&j.date>=td).map(j=>j.date)
  )].sort();
  return days[0]||td;
}

function renderAIRoute(){
  // Standaard: eerste dag met klussen (niet per se vandaag)
  if(!S.aiRouteDate)S.aiRouteDate=_firstJobDay();
  const dateToUse=S.aiRouteDate;
  const result=aiOptimizeRoute(dateToUse);
  const routedJobs=result.route;

  // Bouw lijst van dagen met klussen voor snelle navigatie
  const td=today();
  const jobDays=[...new Set(
    jobs.filter(j=>j.status!=='afgerond'&&j.date>=td).map(j=>j.date)
  )].sort().slice(0,14);

  const dayChips=jobDays.map(d=>`<button onclick="setRouteDate('${d}')"
    style="padding:4px 10px;border-radius:20px;border:2px solid ${d===dateToUse?'var(--primary)':'var(--border)'};
    background:${d===dateToUse?'var(--primary)':'var(--card)'};color:${d===dateToUse?'#fff':'var(--text)'};
    font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;touch-action:manipulation">
    ${fmtShort(d)}${d===td?' (vandaag)':''} <span style="opacity:.7">${jobs.filter(j=>j.date===d&&j.status!=='afgerond').length}×</span>
  </button>`).join('');

  return`
    <button class="back-btn" onclick="nav('ai','hub')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>AI Assistent</button>

    ${jobDays.length?`<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch">${dayChips}</div>`:''}

    <div class="card" style="margin-bottom:14px;display:flex;align-items:center;gap:10px">
      <div style="flex:1"><label class="form-label" style="margin-bottom:4px">Andere dag kiezen</label>
        <input class="form-control" type="date" value="${dateToUse}" onchange="setRouteDate(this.value)" style="margin:0">
      </div>
    </div>

    ${!routedJobs.length?emptyState('🗺️','Geen klussen op deze dag','Kies een dag met ingeplande klussen'): `

      ?`<div class="route-savings">✅ Besparing t.o.v. willekeurige volgorde: ~${result.savings} min &middot; ${result.totalKm} km totaal</div>`
      :`<div class="route-savings" style="background:var(--primary-light);color:var(--primary)">📍 ${routedJobs.length} klus${routedJobs.length>1?'sen':''} &middot; ${result.totalKm} km &middot; ${result.totalMin} min rijden</div>`}

      ${routedJobs.map((r,i)=>{
        const c=getCust(r.job.custId);
        const wl=workLbl(r.job.work);
        return`<div class="route-step">

      </div>`;
    }).join('')}
    ${pending.length>totalCustomers?`<div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px">⚠️ ${pending.length-totalCustomers} klant${pending.length-totalCustomers>1?'en':''} kon${pending.length-totalCustomers>1?'den':''} niet ingepland worden. Controleer je beschikbaarheid.</div>`:''}`;
}

// ════════════════════════════════════════════════
//  RENDER: AI AVAILABILITY
// ════════════════════════════════════════════════
function renderAIAvailability(){
  const weeks=[0,1,2,3];
  const td=today();
  const DOW=['Zo','Ma','Di','Wo','Do','Vr','Za'];

  // Render detail rows for each day in a week for a specific worker
  function dayRows(wk, days){
    return days.map(ds=>{
      const d=dateFromStr(ds);
      const dow=d.getDay();
      const isPast=ds<td;
      const isToday=ds===td;
      const slot=getAvailSlot(wk,ds);
      const on=slot.on;
      const from=slot.from||'07:00';
      const to=slot.to||'17:00';
      const dayName=NL_DAYS_S[dow]+' '+d.getDate();
      return`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);${isPast?'opacity:.45;':''}">
        <div style="width:44px;font-size:12px;font-weight:700;color:${isToday?'var(--primary)':'var(--text-muted)'};flex-shrink:0">${dayName}</div>
        <button onclick="${isPast?'':`toggleAvail('${wk}','${ds}',${on})`}"
          style="width:36px;height:36px;border-radius:18px;border:2px solid;flex-shrink:0;font-size:14px;cursor:${isPast?'default':'pointer'};
          border-color:${on?'var(--success)':'var(--border)'};background:${on?'var(--success-light)':'var(--gray-light)'}">
          ${on?'✓':'✗'}
        </button>
        ${on?`
        <div style="display:flex;align-items:center;gap:4px;flex:1;min-width:0">
          <input type="time" value="${from}" style="flex:1;min-width:0;padding:6px 6px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--text)"
            onchange="setAvailTime('${wk}','${ds}','from',this.value)">
          <span style="font-size:12px;color:var(--text-muted)">–</span>
          <input type="time" value="${to}" style="flex:1;min-width:0;padding:6px 6px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;color:var(--text)"
            onchange="setAvailTime('${wk}','${ds}','to',this.value)">
        </div>`:`<span style="font-size:12px;color:var(--text-muted);flex:1">Niet beschikbaar</span>`}
      </div>`;
    }).join('');
  }

  return`
    <button class="back-btn" onclick="nav('ai','hub')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>AI Assistent</button>
    <div class="card" style="margin-bottom:16px">
      <div class="grid2">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Naam medewerker 1</label>
          <input class="form-control" id="av-w1name" type="text" value="${esc(availability.w1.name)}" placeholder="Naam" oninput="setWorkerName('w1',this.value)"></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">Naam medewerker 2</label>
          <input class="form-control" id="av-w2name" type="text" value="${esc(availability.w2.name)}" placeholder="Naam" oninput="setWorkerName('w2',this.value)"></div>
      </div>
    </div>

    ${weeks.map(wo=>{
      const days=weekDays(wo);
      const weekTitle=wo===0?'Deze week':wo===1?'Volgende week':'Week van '+fmtShort(days[0]);
      return`<div class="avail-section">
        <div class="avail-title">📅 ${weekTitle}</div>
        ${['w1','w2'].map(wk=>{
          const wBlocked=availability[wk].blocked||{};
          const weekBlocks=days.flatMap(ds=>(wBlocked[ds]||[]).map((b,i)=>({...b,date:ds,idx:i})));
          return`<div class="card" style="margin-bottom:10px;padding:12px 14px">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
              <div style="font-size:13px;font-weight:800;color:var(--primary)">👷 ${esc(availability[wk].name)}</div>
              <button class="btn btn-sm" style="background:var(--purple);color:#fff;gap:5px;padding:6px 10px;font-size:11px" onclick="openRoosterScan('${wk}',${wo})">
                📷 Scan rooster
              </button>
            </div>
            ${weekBlocks.length?`<div style="margin-bottom:10px;padding:10px;background:var(--purple-light);border-radius:10px;border:1.5px solid var(--purple)">
              <div style="font-size:11px;font-weight:800;color:var(--purple);margin-bottom:6px">📚 Gescande blokken (incl. 45 min reistijd)</div>
              ${weekBlocks.map(b=>`<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(124,58,237,.15);font-size:12px">
                <span style="font-size:14px">${b.type==='school'?'🎒':'💼'}</span>
                <span style="flex:1;font-weight:600">${NL_DAYS_S[dateFromStr(b.date).getDay()]} ${dateFromStr(b.date).getDate()} — ${b.from}–${b.to}</span>
                <span style="color:var(--text-muted);font-size:11px">${esc(b.label)}</span>
                <button onclick="removeRoosterBlock('${wk}','${b.date}',${b.idx})" style="border:none;background:none;cursor:pointer;font-size:14px;color:var(--danger);padding:0 2px">✕</button>
              </div>`).join('')}
            </div>`:''}
            ${dayRows(wk, days)}
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}

    <div class="card">
      <div style="font-size:13px;font-weight:700;margin-bottom:12px">⚙️ Standaard werktijden per dag</div>
      ${['w1','w2'].map(wk=>`
        <div style="margin-bottom:16px">
          <div style="font-size:12px;font-weight:800;color:var(--primary);margin-bottom:8px">👷 ${esc(availability[wk].name)}</div>
          ${[1,2,3,4,5,6,0].map(dow=>{
            const slot=availability[wk].days[dow];
            const isOn=typeof slot==='object'?slot.on:!!slot;
            const from=typeof slot==='object'?(slot.from||'07:00'):'07:00';
            const to=typeof slot==='object'?(slot.to||'17:00'):'17:00';
            return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)">
              <div style="width:28px;font-size:11px;font-weight:700;color:var(--text-muted)">${NL_DAYS_S[dow]}</div>
              <button onclick="toggleWeekday('${wk}',${dow})"
                style="width:34px;height:34px;border-radius:17px;border:2px solid;flex-shrink:0;font-size:13px;cursor:pointer;
                border-color:${isOn?'var(--success)':'var(--border)'};background:${isOn?'var(--success-light)':'var(--gray-light)'}">
                ${isOn?'✓':'✗'}
              </button>
              ${isOn?`
              <input type="time" value="${from}" style="flex:1;padding:5px 6px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-weight:600"
                onchange="setWeekdayTime('${wk}',${dow},'from',this.value)">
              <span style="font-size:11px;color:var(--text-muted)">–</span>
              <input type="time" value="${to}" style="flex:1;padding:5px 6px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-weight:600"
                onchange="setWeekdayTime('${wk}',${dow},'to',this.value)">`:`<span style="font-size:12px;color:var(--text-muted)">Niet beschikbaar</span>`}
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>
    <input type="file" id="rooster-file-input" accept="image/*" style="display:none" onchange="handleRoosterFile(this)">`;
}

// ════════════════════════════════════════════════
//  RENDER: AI INSIGHTS
// ════════════════════════════════════════════════
function renderAIInsights(){
  const ins=aiGetInsights();
  const maxMonthRev=Math.max(...ins.months.map(m=>m.rev),1);
  const maxWeekRev=Math.max(...ins.weeks.map(w=>w.rev),1);
  const growthColor=ins.growth===null?'var(--text-muted)':ins.growth>=0?'var(--success)':'var(--danger)';
  const growthLabel=ins.growth===null?'—':ins.growth>=0?('↑ '+ins.growth+'%'):('↓ '+Math.abs(ins.growth)+'%');
  return`
    <button class="back-btn" onclick="nav('ai','hub')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>AI Assistent</button>

    <div class="stats-grid" style="margin-bottom:14px">
      <div class="stat-box"><div class="stat-num" style="color:var(--success);font-size:20px">€${ins.thisM?.rev||0}</div><div class="stat-lbl">Deze maand</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--text-muted);font-size:20px">€${ins.lastM?.rev||0}</div><div class="stat-lbl">Vorige maand</div></div>
      <div class="stat-box"><div class="stat-num" style="color:${growthColor};font-size:20px">${growthLabel}</div><div class="stat-lbl">Groei</div></div>
    </div>

    <div class="card">
      <div class="sec-title" style="margin-bottom:14px">📅 Omzet per maand (6 mnd)</div>
      <div class="bar-chart-wrap">
        ${ins.months.map(m=>`<div class="bar-col">
          <div class="bar-val" style="font-size:10px">€${m.rev>0?m.rev:''}</div>
          <div class="bar-fill" style="height:${Math.round(m.rev/maxMonthRev*70)+10}px;background:${m.rev>=500?'var(--success)':m.rev>=200?'var(--primary)':'var(--border)'}"></div>
          <div class="bar-lbl">${m.lbl}</div>
        </div>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-top:4px">
        Totaal 6 mnd: €${ins.months.reduce((s,m)=>s+m.rev,0)} &middot; Gem. €${Math.round(ins.months.reduce((s,m)=>s+m.rev,0)/6)}/maand
      </div>
    </div>

    <div class="card">
      <div class="sec-title" style="margin-bottom:14px">📈 Omzet per week (8 wkn)</div>
      <div class="bar-chart-wrap">
        ${ins.weeks.map(w=>`<div class="bar-col">
          <div class="bar-val">€${w.rev>0?w.rev:''}</div>
          <div class="bar-fill" style="height:${Math.round(w.rev/maxWeekRev*70)+10}px;background:${w.rev>=200?'var(--success)':w.rev>=100?'var(--primary)':'var(--border)'}"></div>
          <div class="bar-lbl">${w.lbl}</div>
        </div>`).join('')}
      </div>
      <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-top:4px">
        Totaal: €${ins.weeks.reduce((s,w)=>s+w.rev,0)} &middot; Gem. €${Math.round(ins.weeks.reduce((s,w)=>s+w.rev,0)/8)}/week
      </div>
    </div>
    ${ins.bestDay?`<div class="card"><div class="sec-title" style="margin-bottom:8px">🏆 Beste werkdag</div>
      <div style="font-size:24px;font-weight:800;color:var(--primary)">${NL_DAYS[ins.bestDay[0]]}</div>
      <div style="font-size:14px;color:var(--text-muted)">Gem. €${Math.round(ins.bestDay[1].total/ins.bestDay[1].count)} per klus</div>
    </div>`:''}
    ${ins.wtStats.length?`<div class="card"><div class="sec-title" style="margin-bottom:12px">💼 Populairste diensten</div>
      ${ins.wtStats.slice(0,5).map((w,i)=>`<div class="insight-row">
        <div class="insight-rank">${i+1}</div>
        <div class="insight-label">${esc(w.wt.lbl)}</div>
        <div style="text-align:right"><div class="insight-val">€${w.avgP}</div><div style="font-size:11px;color:var(--text-muted)">${w.count}× gedaan</div></div>
      </div>`).join('')}
    </div>`:''}
    ${ins.custRevenue.length?`<div class="card"><div class="sec-title" style="margin-bottom:12px">⭐ Top klanten</div>
      ${ins.custRevenue.filter(x=>x.rev>0).slice(0,5).map((x,i)=>`<div class="insight-row">
        <div class="insight-rank" style="background:${i===0?'#f59e0b':i===1?'var(--gray)':'var(--primary)'}">${i+1}</div>
        <div class="insight-label">${esc(x.c.name)}</div>
        <div style="text-align:right"><div class="insight-val">€${x.rev}</div><div style="font-size:11px;color:var(--text-muted)">${x.count} klussen</div></div>
      </div>`).join('')}
    </div>`:''}
    <div class="card" style="background:linear-gradient(135deg,#1e1b4b,#1e3a5f);color:#fff">
      <div style="font-size:15px;font-weight:700;margin-bottom:8px">🧠 AI Kwaliteit</div>
      <div style="font-size:13px;opacity:.75;margin-bottom:12px">${aiModel.totalDone} klussen geanalyseerd</div>
      <div style="display:flex;gap:12px">
        <div style="flex:1;text-align:center"><div style="font-size:22px;font-weight:800">${aiIntelligence()}%</div><div style="font-size:10px;opacity:.65;text-transform:uppercase">Intelligentie</div></div>
        <div style="flex:1;text-align:center"><div style="font-size:22px;font-weight:800">${Object.values(aiModel.prices).reduce((s,a)=>s+a.length,0)}</div><div style="font-size:10px;opacity:.65;text-transform:uppercase">Prijspunten</div></div>
        <div style="flex:1;text-align:center"><div style="font-size:22px;font-weight:800">${aiModel.feedback.length>0?Math.round(aiModel.feedback.filter(f=>f.accepted).length/aiModel.feedback.length*100):0}%</div><div style="font-size:10px;opacity:.65;text-transform:uppercase">Geaccepteerd</div></div>
      </div>
    </div>`;
}

// Normalize address for duplicate comparison
function normAddr(a){return(a||'').toLowerCase().replace(/\s+/g,' ').trim();}

function checkDupAddr(val,editingId){
  const warn=document.getElementById('addr-dup-warn');if(!warn)return;
  const norm=normAddr(val);
  if(!norm||norm.length<6){warn.style.display='none';return;}
  const dup=customers.find(c=>c.id!==editingId&&normAddr(c.address)===norm);
  if(dup){
    warn.style.display='block';
    warn.innerHTML=`⚠️ Zelfde adres als <b>${esc(dup.name)}</b> — mogelijk duplicaat`;
    warn.onclick=()=>{ if(confirm('Naar bestaande klant gaan?'))nav('customer',dup.id); };
  } else {
    warn.style.display='none';
  }
}

  if(!fj.length){toast('Geen openstaande klussen');return;}

  if(!addrs.length)return;
  const hasHome=!!settings.homeAddress;
  const origin=hasHome?settings.homeAddress:addrs[0];
  const dest=addrs[addrs.length-1];
  const middle=hasHome?addrs.slice(0,addrs.length-1):addrs.slice(1,addrs.length-1);
  const waypoints=middle.length?middle.join('|'):'';
  let url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(origin)+'&destination='+encodeURIComponent(dest);
  if(waypoints)url+='&waypoints='+encodeURIComponent(waypoints)+'&travelmode=driving';
  window.open(url,'_blank');
}

function getOverdue(){
  const result=[],td=dateFromStr(today());
  const byC=_buildJobsByCust();
  customers.forEach(c=>{
    if(!c.frequency||c.frequency==='none')return;
    const days=FREQ_DAYS[c.frequency];if(!days)return;
    const cJobs=byC.get(c.id)||[];
    const done=cJobs.filter(j=>j.status==='afgerond').sort((a,b)=>dateFromStr(b.date)-dateFromStr(a.date));
    if(!done.length)return;
    const next=new Date(dateFromStr(done[0].date));next.setDate(next.getDate()+days);
    if(next<td){
      const hasPlanned=cJobs.some(j=>j.status!=='afgerond'&&dateFromStr(j.date)>=td);
      if(!hasPlanned){const overdueDays=Math.round((td-next)/86400000);result.push({cust:c,next,overdueDays});}
    }
  });
  return result.sort((a,b)=>b.overdueDays-a.overdueDays);
}

let _gCalToken=null,_gCalTokenExpiry=0,_gCalEvents=[],_gTokenClient=null,_gCalFetching=false;

function gCalConnected(){return _gCalToken&&Date.now()<_gCalTokenExpiry;}

function connectGoogleCalendar(){
  if(!settings.googleClientId){
    toast('⚠️ Geen Google Client ID — vul in bij Instellingen → Google Agenda');
    return;
  }
  if(location.protocol==='file:'){
    alert('Google Agenda werkt niet via file://\n\nOpen de app via een lokale server:\n1. Open Command Prompt in de map met glasplanner.html\n2. Typ: python -m http.server 8080\n3. Open: http://localhost:8080/glasplanner.html');
    return;
  }
  if(!window.google?.accounts?.oauth2){toast('Google script nog niet geladen, probeer opnieuw');return;}
  if(!_gTokenClient){
    _gTokenClient=google.accounts.oauth2.initTokenClient({
      client_id:settings.googleClientId,
      scope:'https://www.googleapis.com/auth/calendar.readonly',
      callback:(resp)=>{
        if(resp.error){toast('⚠️ Google verbinding mislukt: '+resp.error);return;}
        _gCalToken=resp.access_token;
        _gCalTokenExpiry=Date.now()+(resp.expires_in-60)*1000;
        toast('✅ Google Agenda verbonden!');
        loadGCalEvents().then(()=>render());
      }
    });
  }
  _gTokenClient.requestAccessToken();
}

function disconnectGoogleCalendar(){
  if(_gCalToken)google.accounts.oauth2.revoke(_gCalToken,()=>{});
  _gCalToken=null;_gCalTokenExpiry=0;_gCalEvents=[];_gTokenClient=null;
  toast('Google Agenda ontkoppeld');render();
}

async function loadGCalEvents(){
  if(!gCalConnected()||_gCalFetching)return;
  _gCalFetching=true;
  const from=today();
  const to=addDays(from,14);
  try{
    const url='https://www.googleapis.com/calendar/v3/calendars/primary/events?'+
      new URLSearchParams({timeMin:from+'T00:00:00Z',timeMax:to+'T23:59:59Z',singleEvents:'true',orderBy:'startTime',maxResults:'100'});
    const r=await fetch(url,{headers:{Authorization:'Bearer '+_gCalToken}});
    if(!r.ok){if(r.status===401){_gCalToken=null;_gCalTokenExpiry=0;}}
    else{const d=await r.json();_gCalEvents=(d.items||[]).filter(e=>e.status!=='cancelled');}
  }catch(e){console.warn('GCal fetch error',e);}
  finally{_gCalFetching=false;}
}

function getGCalForDate(dateStr){
  return _gCalEvents.filter(e=>{
    const start=(e.start?.dateTime||e.start?.date||'').slice(0,10);
    const end=(e.end?.dateTime||e.end?.date||'').slice(0,10);
    return start===dateStr||(start<dateStr&&end>dateStr);
  });
}

function getTravelWarnings(dayJobs){
  const warnings={};
  const sorted=[...dayJobs].filter(j=>j.time).sort((a,b)=>a.time.localeCompare(b.time));
  for(let i=1;i<sorted.length;i++){
    const prev=sorted[i-1];const curr=sorted[i];
    const pc=getCust(prev.custId);const cc=getCust(curr.custId);
    if(!pc||!cc)continue;
    const travel=travelMin(pc.address,cc.address);
    if(travel<5)continue;
    const[ph,pm]=prev.time.split(':').map(Number);
    const[ch,cm]=curr.time.split(':').map(Number);
    const gap=(ch*60+cm)-(ph*60+pm);
    if(gap>0&&gap<travel){
      warnings[curr.id]=`⚠️ ${travel}min rijden`;
    }
  }
  return warnings;
}

function renderCalendar(){
  const days=weekDays();const td=today();
  const dayJobs=jobs.filter(j=>j.date===S.calDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const warns=getTravelWarnings(dayJobs);
  const jobCountByDay=new Map();
  jobs.forEach(j=>{if(days.includes(j.date))jobCountByDay.set(j.date,(jobCountByDay.get(j.date)||0)+1);});
  const DAY_SHORT=['Ma','Di','Wo','Do','Vr','Za','Zo'];
  const dayPills=days.map((d,i)=>{
    const dj=jobCountByDay.get(d)||0;
    const isToday=d===td;const isSel=d===S.calDay;
    const dayN=new Date(d+'T12:00:00').getDate();
    return`<button onclick="setCalDay('${d}')" style="flex:1;padding:6px 2px 8px;border:none;border-radius:10px;cursor:pointer;background:${isSel?'var(--primary)':'transparent'};color:${isSel?'#fff':isToday?'var(--primary)':'var(--text-muted)'};font-weight:${isToday||isSel?'800':'500'};position:relative">
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:.5px">${DAY_SHORT[i]}</div>
      <div style="font-size:17px;font-weight:800;line-height:1.3">${dayN}</div>
      ${dj?`<div style="position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:${isSel?'rgba(255,255,255,.7)':'var(--primary)'}"></div>`:''}
    </button>`;
  }).join('');

  const START_H=7;const END_H=19;const PX_H=60;const TOTAL=( END_H-START_H)*PX_H;
  let hourLines='';
  for(let h=START_H;h<=END_H;h++){
    const y=(h-START_H)*PX_H;
    hourLines+=`<div style="position:absolute;left:0;right:0;top:${y}px;display:flex;align-items:flex-start;pointer-events:none">
      <span style="font-size:10px;color:var(--text-muted);width:36px;flex-shrink:0;font-weight:600;padding-top:1px">${String(h).padStart(2,'0')}:00</span>
      <div style="flex:1;height:1px;background:var(--border);margin-top:7px"></div>
    </div>`;
  }

  let timeLine='';
  if(S.calDay===td){
    const now=new Date();
    const nowY=(now.getHours()*60+now.getMinutes()-START_H*60)/60*PX_H;
    if(nowY>=0&&nowY<=TOTAL){
      timeLine=`<div style="position:absolute;left:36px;right:0;top:${nowY.toFixed(1)}px;height:2px;background:var(--danger);z-index:3;pointer-events:none">
        <div style="position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--danger)"></div>
      </div>`;
    }
  }

  // Work job blocks
  const blocks=dayJobs.filter(j=>j.time).map(job=>{
    const c=getCust(job.custId);if(!c)return'';
    const[h,m]=job.time.split(':').map(Number);
    const y=(h*60+m-START_H*60)/60*PX_H;
    const dur=job.duration||60;
    const bh=Math.max(dur/60*PX_H,30);
    const isWarn=!!warns[job.id];
    const bg=isWarn?'var(--warning-light)':job.status==='afgerond'?'var(--success-light)':job.status==='onderweg'?'#fff8e6':'var(--primary-light)';
    const col=isWarn?'var(--warning)':job.status==='afgerond'?'var(--success)':job.status==='onderweg'?'var(--warning)':'var(--primary)';
    const border=isWarn?'2px solid var(--warning)':'1.5px solid '+col;
    return`<div onclick="nav('job','${job.id}')" style="position:absolute;left:40px;right:2px;top:${y.toFixed(1)}px;height:${bh.toFixed(0)}px;background:${bg};border:${border};border-radius:8px;padding:4px 8px;cursor:pointer;overflow:hidden;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.08)">
      <div style="font-size:12px;font-weight:800;color:${col};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
      ${bh>38?`<div style="font-size:10px;color:${col};opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${job.time}${isWarn?' · ⚠️ reistijd':''}</div>`:''}
    </div>`;
  }).join('');

  // Google Calendar blocks (grey, behind work blocks)
  const gEvents=getGCalForDate(S.calDay);
  const allDayEvents=gEvents.filter(e=>!e.start?.dateTime);
  const gBlocks=gEvents.filter(e=>e.start?.dateTime).map(e=>{
    const st=new Date(e.start.dateTime);
    const en=new Date(e.end.dateTime);
    const y=((st.getHours()*60+st.getMinutes())-START_H*60)/60*PX_H;
    const durMin=(en-st)/60000;
    const bh=Math.max(durMin/60*PX_H,20);
    if(y+bh<0||y>TOTAL)return'';
    const title=esc(e.summary||'(geen titel)');
    const timeStr=st.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});
    return`<div style="position:absolute;left:40px;right:2px;top:${Math.max(0,y).toFixed(1)}px;height:${bh.toFixed(0)}px;background:rgba(107,114,128,.12);border:1.5px solid rgba(107,114,128,.3);border-radius:8px;padding:3px 7px;overflow:hidden;z-index:1">

      ${bh>32?`<div style="font-size:10px;color:var(--text-muted);opacity:.8">${timeStr}</div>`:''}
    </div>`;
  }).join('');

  const allDayRow=allDayEvents.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;padding:6px 8px;border-bottom:1px solid var(--border);margin-bottom:4px">
    ${allDayEvents.map(e=>`<span style="font-size:11px;background:rgba(107,114,128,.12);border:1px solid rgba(107,114,128,.25);border-radius:6px;padding:2px 8px;color:var(--text-muted);font-weight:600">📅 ${esc(e.summary||'Agenda-item')}</span>`).join('')}
  </div>`:'';

  // Google connect nudge if not connected
  const gCalBar=gCalConnected()
    ?`<div style="display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(66,133,244,.08);border-radius:8px;margin-bottom:8px;font-size:11px;color:#4285f4;font-weight:700">

        <button onclick="loadGCalEvents().then(()=>render())" style="margin-left:auto;background:none;border:none;color:#4285f4;font-size:10px;font-weight:800;cursor:pointer">↻ Ververs</button>
      </div>`
    :`<button onclick="nav('settings')" style="width:100%;padding:8px 10px;margin-bottom:8px;border:1.5px dashed rgba(66,133,244,.4);border-radius:8px;background:rgba(66,133,244,.05);color:#4285f4;font-size:12px;font-weight:700;cursor:pointer;text-align:left">
        📅 Verbind Google Agenda om persoonlijke afspraken te zien →
      </button>`;

  const unscheduled=dayJobs.filter(j=>!j.time);
  return`
  <div style="background:var(--card);border-radius:var(--radius);padding:10px;margin-bottom:10px;box-shadow:var(--shadow)">
    <div style="display:flex;gap:1px">${dayPills}</div>

    ${allDayRow}
    <div style="position:relative;height:${TOTAL}px">
      ${hourLines}
      ${timeLine}

    </div>
  </div>
  ${unscheduled.length?`<div class="card" style="margin-bottom:10px">
    <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">⏰ Nog geen tijdstip (${unscheduled.length})</div>
    ${unscheduled.map(job=>{const c=getCust(job.custId);return c?`<div onclick="nav('job','${job.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:9px 10px;cursor:pointer;border-radius:10px;background:var(--gray-light);margin-bottom:6px"><div><div style="font-size:13px;font-weight:700">${esc(c.name)}</div><div style="font-size:11px;color:var(--text-muted)">${esc(c.address)}</div></div><span class="badge b-${job.status}">${statusIcon(job.status)}</span></div>`:''}).join('')}
  </div>`:''}`;
}

function jobToGCalUrl(jobId){
  const job=getJob(jobId);if(!job||!job.date)return'#';
  const c=getCust(job.custId);if(!c)return'#';
  const wl=workLbl(job.work).join(', ')||'Glasbewassing';
  const title=wl+' – '+c.name;
  const d=job.date.replace(/-/g,'');
  let dates;
  if(job.time){
    const[h,m]=job.time.split(':').map(Number);
    const dur=job.duration||60;
    const endMins=h*60+m+dur;
    const eH=String(Math.floor(endMins/60)%24).padStart(2,'0');
    const eM=String(endMins%60).padStart(2,'0');
    dates=d+'T'+job.time.replace(':','')+'00/'+d+'T'+eH+eM+'00';
  }else{
    dates=d+'/'+addDays(job.date,1).replace(/-/g,'');
  }
  const details=[
    c.phone?'Tel: '+c.phone:'',
    wl?'Werk: '+wl:'',
    c.price?'Prijs: €'+c.price:'',
    job.notes?'Notitie: '+job.notes:'',
  ].filter(Boolean).join('\n');
  const p=new URLSearchParams({action:'TEMPLATE',text:title,dates,details,location:c.address||'',trp:'false'});
  return'https://calendar.google.com/calendar/render?'+p.toString();
}

function dakTypeSvg(type){
  const s='<svg width="52" height="36" viewBox="0 0 52 36" fill="none" xmlns="http://www.w3.org/2000/svg">';
  const walls='<rect x="3" y="26" width="46" height="7" fill="currentColor" opacity=".12" stroke="currentColor" stroke-width="1.5" rx="1"/>';
  switch(type){
    case 'plat':     return s+walls+'<line x1="3" y1="26" x2="49" y2="26" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
    case 'lessenaar':return s+walls+'<line x1="3" y1="10" x2="49" y2="26" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>';
    case 'zadel':    return s+walls+'<polyline points="3,26 26,7 49,26" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    case 'schild':   return s+walls+'<polyline points="3,26 26,7 49,26" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'
                       +'<line x1="14" y1="26" x2="26" y2="7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2"/>'
                       +'<line x1="38" y1="26" x2="26" y2="7" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3,2"/></svg>';
    default: return '';
  }
}

// Shoelace formula; coords = [[lon,lat],...] in EPSG:4326
function _polyAreaM2(coords, refLat){
  const R=111320, cosLat=Math.cos(refLat*Math.PI/180);
  const pts=coords.map(([lon,lat])=>[lon*cosLat*R, lat*R]);
  let a=0;
  for(let i=0;i<pts.length-1;i++) a+=pts[i][0]*pts[i+1][1]-pts[i+1][0]*pts[i][1];
  return Math.abs(a/2);
}
function _polyPerimM(coords, refLat){
  const R=111320, cosLat=Math.cos(refLat*Math.PI/180);
  let p=0;
  for(let i=0;i<coords.length-1;i++){
    const dx=(coords[i+1][0]-coords[i][0])*cosLat*R;
    const dy=(coords[i+1][1]-coords[i][1])*R;
    p+=Math.sqrt(dx*dx+dy*dy);
  }
  return p;
}

// Estimate type+pitch from construction year when 3D BAG is unavailable
function _dakFallback(bouwjaar){
  const yr=parseInt(bouwjaar)||0;
  if(yr>=2010)return{type:'zadel',angle:27};
  if(yr>=1995)return{type:'zadel',angle:31};
  if(yr>=1975)return{type:'zadel',angle:35};
  if(yr>=1960)return{type:'zadel',angle:38};
  if(yr>=1940)return{type:'zadel',angle:42};
  if(yr>0)    return{type:'zadel',angle:46};
  return            {type:'zadel',angle:35};
}
