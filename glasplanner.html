  document.addEventListener('paste', _globalRoosterPaste);
}

function _globalRoosterPaste(event){
  if(!document.getElementById('paste-zone'))return; // modal not open
  handleRoosterPaste(event);
}

function triggerRoosterFileDirect(){
  // On mobile: open file picker directly from paste zone tap
  triggerRoosterFile();
}

function handleRoosterPaste(event){
  const items=event.clipboardData?.items||[];
  for(const item of items){
    if(item.type.startsWith('image/')){
      event.preventDefault();
      const file=item.getAsFile();
      if(!file)continue;
      // Show preview in paste zone
      const url=URL.createObjectURL(file);
      const zone=document.getElementById('paste-zone');
      if(zone)zone.innerHTML=`<img src="${url}" style="max-width:100%;max-height:160px;border-radius:8px;object-fit:contain">`;
      const reader=new FileReader();
      reader.onload=e=>{
        const[meta,b64]=e.target.result.split(',');
        const mimeType=meta.match(/:(.*?);/)?.[1]||'image/png';
        closeModal();
        callClaudeVision(_roosterScanWorker,_roosterScanWeek,b64,mimeType);
      };
      reader.readAsDataURL(file);
      return;
    }
  }
}

function triggerRoosterFile(){
  closeModal();
  document.getElementById('rooster-file-input').value='';
  document.getElementById('rooster-file-input').click();
}

function handleRoosterFile(input){
  const file=input.files?.[0];
  if(!file||!_roosterScanWorker)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    const[meta,b64]=e.target.result.split(',');
    const mimeType=meta.match(/:(.*?);/)?.[1]||'image/jpeg';
    await callClaudeVision(_roosterScanWorker,_roosterScanWeek,b64,mimeType);
  };
  reader.readAsDataURL(file);
}

async function callClaudeVision(worker, weekOffset, base64, mimeType){
  const days=weekDays(weekOffset);
  const dayMap=days.map(ds=>{
    const d=dateFromStr(ds);
    const dow=['zo','ma','di','wo','do','vr','za'][d.getDay()];
    return dow+'='+ds;
  }).join(', ');

  const prompt=`Dit is een screenshot van een school- of werkrooster. Herken alle tijdsloten waarop iemand bezet is (school, werk, stage, bijbaan, etc.).

Weekdata: ${dayMap}

Geef je antwoord UITSLUITEND als een JSON array, geen markdown of uitleg:
[{"date":"YYYY-MM-DD","startTime":"HH:MM","endTime":"HH:MM","type":"school","label":"School"}]

Regels:
- Koppel dagnamen (ma/di/wo/do/vr/za/zo of Mon/Tue etc.) aan de datum uit weekdata
- 24-uursformaat voor tijden
- type: "school" of "werk"
- Pauzes en tussenuren weglaten`;

  toast('⏳ Rooster wordt gescand...');

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'x-api-key':settings.claudeApiKey,
        'anthropic-version':'2023-06-01',
        'content-type':'application/json',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:1024,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mimeType,data:base64}},
          {type:'text',text:prompt}
        ]}]
      })
    });

    if(!resp.ok){
      const err=await resp.json().catch(()=>({}));
      toast('⚠️ API fout: '+(err?.error?.message||resp.status));
      return;
    }

    const data=await resp.json();
    const text=data.content?.[0]?.text||'';
    const match=text.match(/\[[\s\S]*?\]/);
    if(!match){toast('⚠️ Geen tijdsloten herkend');return;}
    let blocks;
    try{blocks=JSON.parse(match[0]);}catch{toast('⚠️ Kon rooster niet verwerken');return;}
    if(!blocks.length){toast('⚠️ Geen tijdsloten gevonden');return;}

    // Store in temp var to avoid quoting issues in onclick
    _pendingBlocks={worker,blocks};

    const preview=blocks.map(b=>{
      const d=dateFromStr(b.date);
      return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:13px">
        <span>${b.type==='school'?'🎒':'💼'}</span>
        <span style="flex:1"><b>${NL_DAYS_S[d.getDay()]} ${d.getDate()}</b></span>
        <span style="color:var(--text-muted)">${b.startTime}–${b.endTime}</span>
        <span style="font-size:11px;color:var(--text-muted)">${esc(b.label)}</span>
      </div>`;
    }).join('');

    showModal(`
      <div class="modal-title">✅ Rooster herkend</div>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">
        Tijden worden opgeslagen <b>met 45 min reistijd</b> voor en na elk blok.
      </p>
      <div style="background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:14px;max-height:260px;overflow-y:auto">
        ${preview}
      </div>
      <button class="btn btn-primary btn-block" onclick="confirmRoosterBlocks()">✅ Toevoegen aan agenda</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal();_pendingBlocks=null" style="margin-top:8px">Annuleren</button>
    `);
  }catch(e){
    toast('⚠️ Scannen mislukt: '+e.message);
  }
}

function confirmRoosterBlocks(){
  if(!_pendingBlocks)return;
  applyRoosterBlocks(_pendingBlocks.worker,_pendingBlocks.blocks);
  _pendingBlocks=null;
  closeModal();
}

function addMinutesToTime(t, mins){
  const [h,m]=t.split(':').map(Number);
  const tot=Math.max(0,Math.min(23*60+59, h*60+m+mins));
  return String(Math.floor(tot/60)).padStart(2,'0')+':'+String(tot%60).padStart(2,'0');
}

function applyRoosterBlocks(worker, blocks){
  if(!availability[worker].blocked)availability[worker].blocked={};
  blocks.forEach(b=>{
    const ds=b.date;
    if(!availability[worker].blocked[ds])availability[worker].blocked[ds]=[];
    availability[worker].blocked[ds].push({
      from: addMinutesToTime(b.startTime,-45),
      to:   addMinutesToTime(b.endTime,45),
      label: b.label||'Bezet',
      type:  b.type||'school'
    });
  });
  saveAll();
  render();
  toast('✅ '+blocks.length+' blokken toegevoegd aan beschikbaarheid');
}

function removeRoosterBlock(worker, date, idx){
  if(!availability[worker].blocked?.[date])return;
  availability[worker].blocked[date].splice(idx,1);
  if(!availability[worker].blocked[date].length)delete availability[worker].blocked[date];
  saveRender();
}

// ════════════════════════════════════════════════
//  CLOUD SYNC — Firebase Firestore (live, realtime)
// ════════════════════════════════════════════════
let _fbUnsub=null; // onSnapshot unsubscribe handle
let _fbPushing=false;
let _fbIgnoreNext=false; // skip our own write bouncing back

function syncPayload(){
  const {ownerPin,workerPin,syncId,syncEnabled,lastSync,...rest}=settings;
  return{customers,jobs,availability,aiModel,settings:rest,geocodeCache,_ts:Date.now()};
}

function syncStatusEl(){return document.getElementById('sync-status');}
function setSyncStatus(txt,color='var(--text-muted)'){
  const el=syncStatusEl();if(el){el.textContent=txt;el.style.color=color;}
}

function _fbDoc(){
  if(!window._fb)return null;
  return window._fb.doc(window._fb.db,'workspace','main');
}

async function pushToCloud(){
  if(!settings.syncEnabled)return;
  if(!window._fb){setSyncStatus('⚠️ Firebase niet geladen','var(--warning)');return;}
  if(_fbPushing)return;
  _fbPushing=true;
  setSyncStatus('☁️ Synchroniseren...','var(--primary)');
  try{
    _fbIgnoreNext=true;
    await window._fb.setDoc(_fbDoc(),syncPayload());
    settings.lastSync=Date.now();
    saveLocalOnly();
    setSyncStatus('✅ Gesynchroniseerd '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),'var(--success)');
  }catch(e){setSyncStatus('⚠️ Sync mislukt: '+e.message,'var(--danger)');_fbIgnoreNext=false;}
  _fbPushing=false;
}

async function pullFromCloud(silent=false){
  if(!settings.syncEnabled||!window._fb)return false;
  if(!silent)setSyncStatus('☁️ Ophalen...','var(--primary)');
  try{
    const snap=await window._fb.getDoc(_fbDoc());
    if(!snap.exists()){if(!silent)setSyncStatus('⚠️ Nog geen data in cloud','var(--warning)');return false;}
    const d=snap.data();
    if(!d.customers||!d.jobs)return false;
    if(d._ts&&d._ts<=(settings.lastSync||0))return false;
    _applyCloudData(d);
    if(!silent){setSyncStatus('✅ Bijgewerkt '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),'var(--success)');render();}
    return true;
  }catch(e){if(!silent)setSyncStatus('⚠️ Geen verbinding','var(--warning)');return false;}
}

function _applyCloudData(d){
  if(!d)return;
  localStorage.setItem('gp_setup','1');
  customers=d.customers||customers;
  jobs=d.jobs||jobs;
  if(d.availability)availability=d.availability;
  if(d.aiModel)aiModel=d.aiModel;
  if(d.geocodeCache)geocodeCache=d.geocodeCache;
  if(d.settings){const {ownerPin,workerPin,...rest}=d.settings;settings={...settings,...rest};}
  settings.lastSync=d._ts||Date.now();
  saveLocalOnly();
}

function startFirestoreListener(){
  if(_fbUnsub){_fbUnsub();_fbUnsub=null;}
  if(!settings.syncEnabled||!window._fb)return;
  const ref=_fbDoc();
  if(!ref)return;
  _fbUnsub=window._fb.onSnapshot(ref,(snap)=>{
    if(!snap.exists())return;
    if(_fbIgnoreNext){_fbIgnoreNext=false;return;}
    const d=snap.data();
    if(!d.customers||!d.jobs)return;
    if(d._ts&&d._ts<=(settings.lastSync||0))return;
    _applyCloudData(d);
    setSyncStatus('🔄 Live update '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),'var(--teal)');
    render();
    toast('🔄 Data bijgewerkt door collega');
  },(err)=>{setSyncStatus('⚠️ Live sync fout','var(--danger)');});
}

async function createSyncRoom(){
  if(!window._fb){toast('⚠️ Firebase niet beschikbaar');return;}
  const btn=document.getElementById('sync-create-btn');
  if(btn){btn.disabled=true;btn.textContent='Verbinden...';}
  try{
    await window._fb.setDoc(_fbDoc(),syncPayload());
    settings.syncEnabled=true;settings.lastSync=Date.now();
    saveLocalOnly();
    startFirestoreListener();
    render();
    toast('🔥 Firebase sync actief! Collega kan nu dezelfde link openen.');
  }catch(e){toast('⚠️ Fout: '+e.message);}
  if(btn){btn.disabled=false;btn.textContent='Sync inschakelen';}
}

async function joinSyncRoom(){
  if(!window._fb){toast('⚠️ Firebase niet beschikbaar');return;}
  const btn=document.getElementById('sync-join-btn');
  if(btn){btn.disabled=true;btn.textContent='Verbinden...';}
  try{
    const snap=await window._fb.getDoc(_fbDoc());
    if(!snap.exists()){toast('⚠️ Geen data gevonden in Firebase');if(btn){btn.disabled=false;btn.textContent='Verbinden als collega';}return;}
    _applyCloudData(snap.data());
    settings.syncEnabled=true;
    saveLocalOnly();
    startFirestoreListener();
    render();
    toast('✅ Verbonden! '+customers.length+' klanten, '+jobs.length+' klussen geladen.');
  }catch(e){toast('⚠️ Verbinden mislukt: '+e.message);}
  if(btn){btn.disabled=false;btn.textContent='Verbinden als collega';}
}

function disableSync(){
  if(!confirm('Firebase sync uitschakelen?'))return;
  if(_fbUnsub){_fbUnsub();_fbUnsub=null;}
  settings.syncEnabled=false;settings.lastSync=null;
  saveLocalOnly();render();toast('Cloud sync uitgeschakeld');
}

function copySyncCode(){

document.addEventListener('visibilitychange',()=>{

function encodeSyncData(){
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(syncPayload()))));}catch(e){return null;}
}
function decodeSyncData(str){
  try{return JSON.parse(decodeURIComponent(escape(atob(str.trim()))));}catch(e){return null;}
}

function generateSyncCode(){
  const code=encodeSyncData();
  if(!code){toast('⚠️ Fout bij aanmaken sync-code');return;}
  settings.lastSync=Date.now();

function importSyncCode(){
  const code=(document.getElementById('sync-code-in')?.value||'').trim();
  if(!code){toast('⚠️ Geen code ingevuld');return;}
  const d=decodeSyncData(code);
  if(!d||!d.customers||!d.jobs){toast('⚠️ Ongeldige sync-code');return;}
  const ts=d._ts?new Date(d._ts).toLocaleString('nl-NL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'onbekend';
  if(!confirm(`Sync importeren?\n\n${d.customers.length} klanten, ${d.jobs.length} klussen\nDatum: ${ts}\n\nJouw huidige data wordt bijgewerkt.`))return;
  customers=d.customers;
  jobs=d.jobs;
  if(d.availability)availability=d.availability;
  if(d.aiModel)aiModel=d.aiModel;
  if(d.settings){const {ownerPin,workerPin,...rest}=d.settings;settings={...settings,...rest};}
  settings.lastSync=d._ts||Date.now();
  saveLocalOnly();
  closeModal();
  render();
  toast('✅ Gesynchroniseerd! '+customers.length+' klanten, '+jobs.length+' klussen');
}

  const icon=`data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='38' fill='%230066bb'/%3E%3Crect x='28' y='44' width='136' height='108' rx='10' stroke='white' stroke-width='7' fill='none'/%3E%3Cline x1='28' y1='74' x2='164' y2='74' stroke='white' stroke-width='7'/%3E%3Ccircle cx='62' cy='113' r='14' fill='%2322c55e'/%3E%3Cpath d='M54 113l6 7 11-12' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E`;
  try{
    const m={name:'CleanSoft Portal',short_name:'CleanSoft',start_url:'.',display:'standalone',background_color:'#0066bb',theme_color:'#0066bb',lang:'nl',icons:[{src:icon,sizes:'192x192',type:'image/svg+xml',purpose:'any maskable'}],share_target:{action:'.',method:'GET',params:{title:'title',text:'text',url:'url'}}};
    document.getElementById('pwa-manifest').href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));
  }catch(e){}
  if('serviceWorker' in navigator){
    try{navigator.serviceWorker.register(URL.createObjectURL(new Blob([`self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(clients.claim()));`],{type:'text/javascript'}))).catch(()=>{});}catch(e){}
  }
  // Android: capture install prompt
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();

//  MORGEN-ROUTE OVERZICHT & AVONDMELDING
// ════════════════════════════════════════════════
function buildMorgenRouteMsg(dateStr){
  const ds=dateStr||addDays(today(),1);
  const dayJobs=jobs.filter(j=>j.date===ds&&j.status!=='afgerond')
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(!dayJobs.length)return null;

  // Optimaliseer volgorde (route-algoritme)
  const result=aiOptimizeRoute(ds);
  const ordered=result.route.length?result.route.map(r=>r.job):dayJobs;

  const dateLbl=fmtLong(ds);
  const bedrijf=settings.w1Name||'CleanSoft';
  let msg=`📋 Route ${dateLbl}\n\n`;

  let curAddr=settings.homeAddress||'';
  let curTime=null;
  ordered.forEach((job,i)=>{
    const c=getCust(job.custId);if(!c)return;
    const reisMin=curAddr?travelMin(curAddr,c.address):0;
    const timeStr=job.time||'';
    // Bereken verwachte aankomsttijd als er tijden zijn
    if(timeStr){
      curTime=timeStr;
    } else if(curTime&&reisMin>0){
      const [hh,mm]=curTime.split(':').map(Number);
      const tot=hh*60+mm+45+reisMin; // 45 min per klus
      curTime=`${String(Math.floor(tot/60)).padStart(2,'0')}:${String(tot%60).padStart(2,'0')}`;
    }
    if(reisMin>0&&i>0)msg+=`  🚗 ~${reisMin} min\n`;
    msg+=`${curTime?curTime+' — ':''}${c.name}\n`;
    msg+=`  📍 ${c.address}\n`;
    curAddr=c.address;
  });

  const totRev=ordered.reduce((s,j)=>{const c=getCust(j.custId);return s+(c?.price||0);},0);
  msg+=`\n${ordered.length} klus${ordered.length!==1?'sen':''}`+(totRev>0?` · €${totRev}`:'')+
       (result.totalKm?` · ~${result.totalKm} km`:'')+
       `\n— ${bedrijf}`;
  return msg;
}

function stuurMorgenRoute(dateStr){
  const ds=dateStr||addDays(today(),1);
  const msg=buildMorgenRouteMsg(ds);
  if(!msg){toast('Geen klussen morgen gevonden');return;}

  // Gebruik Web Share API (native share sheet → WhatsApp, SMS, kopiëren, etc.)
  if(navigator.share){
    navigator.share({title:'Route '+(dateStr||'morgen'),text:msg}).catch(()=>{});
    return;
  }
  // Fallback: stuur via WhatsApp (nummer uit instellingen of open keuze)
  const phone=fmtWaPhone(settings.w1Phone||'');
  if(phone){
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  } else {
    // Geen nummer: kopieer naar klembord
    navigator.clipboard?.writeText(msg).then(()=>toast('📋 Route gekopieerd naar klembord!')).catch(()=>{});
    showModal(`<div class="modal-title">📋 Route morgen</div>
      <pre style="font-size:12px;white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin-bottom:16px;color:var(--text);line-height:1.6">${esc(msg)}</pre>
      <button class="btn btn-primary btn-block" onclick="navigator.clipboard?.writeText(${JSON.stringify(msg)}).then(()=>toast('Gekopieerd!'));closeModal()">📋 Kopiëren</button>
      ${settings.w2Phone?`<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="window.open('https://wa.me/${fmtWaPhone(settings.w2Phone)}?text='+encodeURIComponent(${JSON.stringify(msg)}),'_blank');closeModal()">💬 Stuur naar ${esc(settings.w2Name||'collega')}</button>`:''}
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">Sluiten</button>
    `);
  }
}

function stuurMorgenRouteNaarCollega(dateStr){
  const ds=dateStr||addDays(today(),1);
  const msg=buildMorgenRouteMsg(ds);
  if(!msg){toast('Geen klussen gevonden');return;}
  const phone=fmtWaPhone(settings.w2Phone||'');
  if(phone){
    window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');
  } else {
    toast('Voer eerst het WhatsApp-nummer van je collega in bij Instellingen');
  }
}

let _morgenNotifTimer=null;
function scheduleMorgenNotif(){
  clearTimeout(_morgenNotifTimer);
  if(!settings.morgenNotifTime)return;
  const [hStr,mStr]=settings.morgenNotifTime.split(':');
  const now=new Date();
  const fire=new Date();
  fire.setHours(parseInt(hStr)||20,parseInt(mStr)||0,0,0);
  if(fire<=now)return; // al voorbij vandaag
  const ms=fire-now;
  _morgenNotifTimer=setTimeout(()=>{
    _fireMorgenNotif();
  },ms);
}

function _fireMorgenNotif(){
  const tomorrow=addDays(today(),1);
  const morgenJobs=jobs.filter(j=>j.date===tomorrow&&j.status!=='afgerond');
  if(!morgenJobs.length)return;
  const msg=buildMorgenRouteMsg(tomorrow);
  if(!msg)return;

  // Browser-notificatie (als toestemming gegeven)
  if(typeof Notification!=='undefined'&&Notification.permission==='granted'){
    try{
      const n=new Notification('📋 Route morgen — '+morgenJobs.length+' klussen',{
        body:morgenJobs.slice(0,3).map(j=>{const c=getCust(j.custId);return(j.time?j.time+' ':'')+c?.name;}).join(' · '),
        icon:'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 192 192\'%3E%3Crect width=\'192\' height=\'192\' rx=\'38\' fill=\'%230066bb\'/%3E%3Ctext y=\'130\' x=\'96\' text-anchor=\'middle\' font-size=\'120\' fill=\'white\'%3E🪟%3C/text%3E%3C/svg%3E',
        tag:'morgen-route',
        renotify:true
      });
      n.onclick=()=>{window.focus();nav('dashboard');setTab('morgen');};
    }catch(e){}
  }

  // Stuur automatisch WhatsApp als nummers ingevuld zijn
  // (opent WhatsApp — gebruiker moet nog handmatig versturen)
  // We tonen een in-app banner zodat de gebruiker kan kiezen
  _pendingMorgenMsg=msg;
  _pendingMorgenDate=tomorrow;
  render(); // herrender zodat de banner verschijnt
}

// ════════════════════════════════════════════════
//  PUSH NOTIFICATIES
// ════════════════════════════════════════════════
async function requestNotificationPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default'){
    await Notification.requestPermission();
  }
}

function checkRemindersAndNotify(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const rems=getReminders();
  if(!rems.length)return;
  const lastNotified=parseInt(localStorage.getItem('gp_last_notify')||'0');
  const now=Date.now();
  // Only notify once per day
  if(now-lastNotified < 20*60*60*1000)return;
  localStorage.setItem('gp_last_notify',now);
  rems.slice(0,3).forEach(r=>{
    const days=r.daysUntil===0?'vandaag':r.daysUntil===1?'morgen':'over '+r.daysUntil+' dagen';
    try{new Notification('CleanSoft — Herinnering',{
      body:r.cust.name+' moet ingepland worden ('+days+')',
      icon:'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 192 192\'%3E%3Crect width=\'192\' height=\'192\' rx=\'38\' fill=\'%230066bb\'/%3E%3C/svg%3E',
      tag:'reminder-'+r.cust.id,
      renotify:false
    });}catch(e){}
  });
}

// Ask permission once after first interaction
let _notifAsked=false;
function maybeAskNotifications(){
  if(_notifAsked||!('Notification' in window)||Notification.permission!=='default')return;
  _notifAsked=true;
  setTimeout(async()=>{
    await requestNotificationPermission();
    checkRemindersAndNotify();
  },3000);
}
document.addEventListener('click',maybeAskNotifications,{once:true});

// Check on visibility restore
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){checkRemindersAndNotify();}
});
