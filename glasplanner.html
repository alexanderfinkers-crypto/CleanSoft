<title>CleanSoft Portal</title>
<style>
:root{
  --primary:#0066bb;--primary-dark:#004d8a;--primary-light:#deeeff;
  --success:#1a9e3f;--success-light:#e0f5e8;
  --warning:#d97706;--warning-light:#fff8e6;
  --danger:#dc2626;--danger-light:#fff0f0;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --teal:#0d9488;--teal-light:#ccfbf1;
  --gray:#6b7280;--gray-light:#f3f4f6;
  --border:#e5e7eb;--text:#1f2937;--text-muted:#6b7280;
  --bg:#eef2f7;--card:#fff;--radius:14px;
  --shadow:0 1px 6px rgba(0,0,0,.08),0 0 0 1px rgba(0,0,0,.04);
}
body.dark{
  --bg:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--text-muted:#94a3b8;
  --gray-light:#1e293b;--primary-light:#1e3a5f;--success-light:#14532d;
  --warning-light:#431407;--danger-light:#450a0a;--purple-light:#2e1065;
  --teal-light:#042f2e;--shadow:0 1px 6px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.04);
}
body.dark .bottom-nav{background:#1e293b;border-color:#334155}
body.dark .app-header{background:linear-gradient(135deg,#004d8a,#003366)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}

/* ── HEADER ── */
.app-header{background:linear-gradient(135deg,#0066bb,#0050a0);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,70,140,.3)}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{width:32px;height:32px}
.hdr-title{font-size:19px;font-weight:800;letter-spacing:-.4px}
.hdr-date{font-size:12px;opacity:.75;margin-top:2px;font-weight:500}
.hdr-btn{background:rgba(255,255,255,.18);border:none;border-radius:8px;color:#fff;padding:7px 10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100;box-shadow:0 -4px 16px rgba(0,0,0,.07)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px 8px;gap:3px;cursor:pointer;color:var(--text-muted);font-size:10px;font-weight:700;letter-spacing:.2px;border:none;background:none;transition:color .18s;min-height:58px;position:relative;text-transform:uppercase}
.nav-btn svg{width:22px;height:22px;transition:transform .18s}
.nav-btn.active{color:var(--primary)}
.nav-btn.active svg{transform:scale(1.1)}
.nav-dot{position:absolute;top:8px;right:calc(50% - 14px);width:8px;height:8px;background:var(--danger);border-radius:50%;border:2px solid #fff;display:none}

/* ── MAIN ── */
.main{padding:14px 14px calc(74px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}

/* ── TABS ── */
.tab-bar{display:flex;background:#fff;border-radius:var(--radius);padding:4px;margin-bottom:14px;gap:4px;box-shadow:var(--shadow)}
.tab{flex:1;padding:10px 6px;border:none;background:none;border-radius:10px;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .18s;min-height:42px}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,102,187,.35)}

/* ── CARDS ── */
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.job-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:11px;box-shadow:var(--shadow);cursor:pointer;transition:transform .14s;border-left:4px solid var(--border)}
.job-card:active{transform:scale(.985)}
.job-card.s-gepland{border-left-color:var(--primary)}
.job-card.s-onderweg{border-left-color:var(--warning)}
.job-card.s-afgerond{border-left-color:var(--success);opacity:.82}
.jc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.jc-name{font-size:16px;font-weight:700}
.jc-addr{font-size:12px;color:var(--text-muted);margin-top:2px;display:flex;align-items:center;gap:3px}
.jc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.jc-time{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:3px}
.work-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.work-chip{background:var(--gray-light);color:var(--gray);font-size:11px;padding:3px 8px;border-radius:6px;font-weight:500}
.jc-actions{display:flex;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:3px;padding:4px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.b-gepland{background:var(--primary-light);color:var(--primary)}
.b-onderweg{background:var(--warning-light);color:var(--warning)}
.b-afgerond{background:var(--success-light);color:var(--success)}
.b-concept{background:#fff8e6;color:#b45309;border:1.5px solid #fcd34d}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;transition:all .14s;min-height:44px;letter-spacing:.1px}
.btn:active{transform:scale(.95);opacity:.88}
.btn svg{width:17px;height:17px;flex-shrink:0}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(0,102,187,.3)}
.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-purple{background:var(--purple);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,.3)}
.btn-ghost{background:var(--gray-light);color:var(--text)}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-sm{padding:7px 12px;font-size:12px;min-height:36px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{padding:15px 20px;font-size:16px;min-height:52px;width:100%;border-radius:12px}
.btn-block{width:100%}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat-box{background:#fff;border-radius:11px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-lbl{font-size:10px;color:var(--text-muted);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.3px}

/* ── CUSTOMER CARD ── */
.cust-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:13px;transition:transform .14s}
.cust-card:active{transform:scale(.985)}
.cust-avatar{width:46px;height:46px;border-radius:23px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex-shrink:0}
.cust-info{flex:1;min-width:0}
.cust-name{font-size:15px;font-weight:700}
.cust-addr{font-size:12px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.freq-chip{display:inline-block;background:var(--primary-light);color:var(--primary);font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;margin-top:4px}

/* ── REMINDERS ── */
.reminder-card{background:linear-gradient(135deg,#ff6b00,#ff8c00);color:#fff;border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;display:flex;align-items:center;gap:11px;cursor:pointer;box-shadow:0 3px 12px rgba(255,107,0,.3)}
.reminder-card:active{transform:scale(.985)}
.reminder-text{flex:1}
.reminder-title{font-weight:700;font-size:14px}
.reminder-desc{font-size:12px;opacity:.88;margin-top:2px}

/* ── FORM ── */
.form-group{margin-bottom:15px}
.form-label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:10px;font-size:16px;color:var(--text);background:#fff;transition:border-color .18s;-webkit-appearance:none;min-height:50px;font-family:inherit}
.form-control:focus{outline:none;border-color:var(--primary)}
textarea.form-control{resize:vertical;min-height:80px}
select.form-control{background-image:url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 13px center;background-size:18px;padding-right:40px}

/* ── CHECKBOX GRID ── */
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:all .14s;min-height:46px;user-select:none}
.check-item.on{border-color:var(--primary);background:var(--primary-light)}
.check-item.on-mat{border-color:var(--success);background:var(--success-light)}
.check-box{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .14s}
.check-item.on .check-box{background:var(--primary);border-color:var(--primary)}
.check-item.on-mat .check-box{background:var(--success);border-color:var(--success)}
.check-box::after{content:'';display:none;width:11px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.check-item.on .check-box::after,.check-item.on-mat .check-box::after{display:block}
.check-label{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}

/* ── INFO ROWS ── */
.info-rows{border-radius:var(--radius);background:#fff;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.info-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.ir-lbl{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;min-width:72px}
.ir-val{flex:1;font-size:15px;font-weight:500;color:var(--text)}
a.ir-val{color:var(--primary);text-decoration:none}

/* ── STATUS SELECTOR ── */
.status-sel{display:flex;gap:8px;margin-bottom:16px}
.status-opt{flex:1;padding:12px 6px;border:2px solid var(--border);border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:all .15s;background:#fff;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px}
.status-opt.sel-gepland{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}
.status-opt.sel-onderweg{border-color:var(--warning);background:var(--warning-light);color:var(--warning)}
.status-opt.sel-afgerond{border-color:var(--success);background:var(--success-light);color:var(--success)}

/* ── DAY HEADER ── */
.day-hdr{font-size:14px;font-weight:700;color:var(--text-muted);padding:8px 4px 6px;border-bottom:2px solid var(--border);margin-bottom:10px;margin-top:18px;display:flex;align-items:center;gap:8px}
.day-hdr:first-child{margin-top:0}
.day-hdr.today{color:var(--primary);border-bottom-color:var(--primary)}
.day-count{background:var(--border);color:var(--text-muted);font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.today .day-count{background:var(--primary-light);color:var(--primary)}

/* ── SECTION ── */
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin:16px 0 10px}
.sec-title{font-size:16px;font-weight:700}
.section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;margin-top:14px;display:block}

/* ── SEARCH ── */
.search-wrap{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.search-wrap:focus-within{border-color:var(--primary)}
.search-wrap input{border:none;outline:none;font-size:16px;flex:1;color:var(--text);background:transparent}

/* ── EMPTY ── */
.empty{text-align:center;padding:44px 24px;color:var(--text-muted)}
.empty-icon{font-size:52px;margin-bottom:14px}
.empty h3{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:14px}

/* ── TOAST ── */
#toast{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:14px;right:14px;background:rgba(17,24,39,.93);color:#fff;padding:13px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:center;display:none;backdrop-filter:blur(8px)}
@keyframes toastIn{from{transform:translateY(-12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toastOut{to{transform:translateY(-10px);opacity:0}}

/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:16px 0}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--primary);font-size:14px;font-weight:600;padding:0;margin-bottom:14px;min-height:44px}
.back-btn svg{width:18px;height:18px}
.price-pill{background:var(--success-light);color:var(--success);font-size:14px;font-weight:700;padding:5px 12px;border-radius:20px;display:inline-flex;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ══════════════════════════════
   AI-SPECIFIC STYLES
══════════════════════════════ */

/* AI Hub cards */
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.ai-card{background:#fff;border-radius:var(--radius);padding:16px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border-top:3px solid transparent;display:flex;flex-direction:column;gap:5px;position:relative;overflow:hidden}
.ai-card:active{transform:scale(.96)}
.ai-card::after{content:'→';position:absolute;bottom:12px;right:14px;font-size:16px;color:var(--border)}
.ai-card-price{border-top-color:var(--success)}
.ai-card-route{border-top-color:var(--primary)}
.ai-card-plan{border-top-color:var(--purple)}
.ai-card-avail{border-top-color:var(--teal)}
.ai-card-insights{border-top-color:var(--warning)}
.ai-card-settings{border-top-color:var(--gray)}
.ai-card-icon{font-size:28px;margin-bottom:2px}
.ai-card-title{font-size:14px;font-weight:800;color:var(--text)}
.ai-card-desc{font-size:11px;color:var(--text-muted);line-height:1.4}

/* Brain/learning card */
.brain-card{background:linear-gradient(135deg,#1e1b4b,#312e81,#1e3a5f);color:#fff;border-radius:var(--radius);padding:18px 16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(30,27,75,.4)}
.brain-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.brain-icon{font-size:32px}
.brain-title{font-size:17px;font-weight:800}
.brain-sub{font-size:12px;opacity:.7;margin-top:2px}
.brain-bar-wrap{background:rgba(255,255,255,.15);border-radius:20px;height:10px;overflow:hidden;margin-bottom:8px}
.brain-bar{background:linear-gradient(90deg,#4ade80,#22d3ee);height:100%;border-radius:20px;transition:width .6s ease}
.brain-stats{display:flex;gap:0;margin-top:12px}
.brain-stat{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.15)}
.brain-stat:last-child{border-right:none}
.brain-stat-n{font-size:22px;font-weight:800}
.brain-stat-l{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.3px}

/* Price result */
.price-result{background:linear-gradient(135deg,var(--primary),#0050a0);color:#fff;border-radius:var(--radius);padding:20px 16px;text-align:center;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,102,187,.35)}
.price-big{font-size:48px;font-weight:900;line-height:1}
.price-range{font-size:13px;opacity:.8;margin-top:6px}
.conf-wrap{background:rgba(255,255,255,.2);border-radius:20px;height:8px;margin:12px 0 4px;overflow:hidden}
.conf-bar{background:#fff;height:100%;border-radius:20px;transition:width .5s}
.conf-label{font-size:12px;opacity:.8}

/* Breakdown rows */
.breakdown-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.breakdown-row:last-child{border-bottom:none;font-weight:700;padding-top:12px}
.breakdown-row .lbl{color:var(--text-muted);display:flex;align-items:center;gap:6px}
.breakdown-row .val{font-weight:600}

/* Route steps */
.route-wrap{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.route-step{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;position:relative}
.route-step:not(:last-child){border-bottom:1px solid var(--border)}
.route-num{width:36px;height:36px;border-radius:18px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.route-num.home{background:var(--gray)}
.route-num.done{background:var(--success)}
.route-info{flex:1;min-width:0}
.route-name{font-weight:700;font-size:15px}
.route-addr{font-size:12px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-travel{font-size:12px;color:var(--primary);display:flex;align-items:center;gap:3px;margin-top:4px;font-weight:600}
.route-chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.route-savings{background:var(--success-light);color:var(--success);border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}

/* Auto-plan cards */
.plan-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--purple)}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.plan-name{font-size:15px;font-weight:700}
.plan-eff{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.eff-high{background:var(--success-light);color:var(--success)}
.eff-med{background:var(--warning-light);color:var(--warning)}
.eff-low{background:var(--gray-light);color:var(--gray)}
.plan-date{font-size:13px;font-weight:700;color:var(--purple);margin-bottom:4px}
.plan-reason{font-size:12px;color:var(--text-muted);margin-bottom:10px}
.plan-actions{display:flex;gap:8px}

/* Availability grid */
.avail-section{margin-bottom:20px}
.avail-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.week-day-hdr{font-size:10px;font-weight:700;color:var(--text-muted);text-align:center;padding:4px 0;text-transform:uppercase}
.avail-cell{height:40px;border-radius:8px;border:none;cursor:pointer;font-size:11px;font-weight:700;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px}
.avail-cell.av-on{background:var(--success-light);color:var(--success)}
.avail-cell.av-off{background:var(--gray-light);color:var(--text-muted)}
.avail-cell.av-past{opacity:.4;pointer-events:none}
.avail-cell.av-today{outline:2px solid var(--primary);outline-offset:1px}
.avail-cell-day{font-size:12px;font-weight:800}
.avail-cell-lbl{font-size:9px;text-transform:uppercase}

/* Insights / charts */
.bar-chart-wrap{display:flex;align-items:flex-end;gap:5px;height:90px;margin-bottom:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.bar-fill{background:var(--primary);border-radius:4px 4px 0 0;width:100%;min-height:3px;transition:height .4s}
.bar-val{font-size:9px;font-weight:700;color:var(--text)}
.bar-lbl{font-size:9px;color:var(--text-muted);font-weight:600}
.insight-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.insight-row:last-child{border-bottom:none}
.insight-rank{width:24px;height:24px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.insight-label{flex:1;font-size:14px;font-weight:600}
.insight-val{font-size:14px;font-weight:700;color:var(--primary)}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px)}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sheetUp .28s cubic-bezier(.34,1.56,.64,1)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dakPulse{0%,100%{box-shadow:0 0 0 3px rgba(34,197,94,.5),0 2px 8px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.18),0 2px 8px rgba(0,0,0,.25)}}
@keyframes dakSnapPulse{0%,100%{box-shadow:0 0 0 3px rgba(239,68,68,.5),0 2px 8px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 9px rgba(239,68,68,.15),0 2px 8px rgba(0,0,0,.25)}}
@keyframes topoNodePulse{0%,100%{box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.7)}50%{box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 0 6px rgba(255,255,255,.35)}}
@keyframes topoSnapPulse{0%,100%{box-shadow:0 0 0 5px rgba(245,158,11,.5),0 2px 10px rgba(0,0,0,.55)}50%{box-shadow:0 0 0 10px rgba(245,158,11,.2),0 2px 10px rgba(0,0,0,.55)}}
.modal-title{font-size:19px;font-weight:800;margin-bottom:16px}

/* Duration chips */
.dur-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.dur-chip{padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;min-height:44px;background:#fff}
.dur-chip.sel{border-color:var(--primary);background:var(--primary-light);color:var(--primary)}

/* AI badge in job form */
.ai-price-box{background:linear-gradient(135deg,var(--primary-light),#f0f7ff);border:2px solid var(--primary);border-radius:12px;padding:14px;margin-bottom:14px}
.ai-price-box-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.ai-price-title{font-size:13px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:5px}
.ai-price-value{font-size:22px;font-weight:900;color:var(--primary)}
.ai-price-range{font-size:11px;color:var(--text-muted);margin-top:2px}
.ai-price-conf{font-size:11px;color:var(--primary);font-weight:600}

/* Settings */
.settings-section{margin-bottom:20px}
.settings-section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

/* ── PREMIUM UPGRADES ── */
/* Job card hover glow */
.job-card{transition:transform .14s,box-shadow .18s}
.job-card:hover{box-shadow:0 4px 18px rgba(0,102,187,.13),0 0 0 1.5px rgba(0,102,187,.18)}
.job-card.s-gepland:hover{box-shadow:0 4px 18px rgba(0,102,187,.16)}
.job-card.s-onderweg:hover{box-shadow:0 4px 18px rgba(217,119,6,.18)}
.job-card.s-afgerond{opacity:.75}
/* Revenue goal bar */
.rev-goal-bar{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.rev-goal-track{background:var(--gray-light);border-radius:20px;height:10px;overflow:hidden;margin:7px 0 5px}
.rev-goal-fill{border-radius:20px;height:100%;transition:width .7s cubic-bezier(.34,1.56,.64,1)}
/* Overdue pulse */
@keyframes overdPulse{0%,100%{opacity:1}50%{opacity:.55}}
.overd-badge{animation:overdPulse 2s ease-in-out infinite}
/* WhatsApp template cards */
.wa-tmpl{padding:14px;border-radius:12px;border:2px solid #b7eb8f;background:#f6ffed;text-align:left;cursor:pointer;width:100%;display:block;transition:transform .12s,border-color .12s;margin-bottom:10px}
.wa-tmpl:active{transform:scale(.97)}
.wa-tmpl:hover{border-color:#52c41a}
.wa-tmpl-title{font-size:12px;font-weight:800;color:#237804;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.wa-tmpl-body{font-size:12px;color:var(--text);line-height:1.45}
/* Customer health ribbon */
.cust-health{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-top:6px}
.cust-health-ok{background:var(--success-light);color:var(--success)}
.cust-health-warn{background:var(--warning-light);color:var(--warning)}
.cust-health-danger{background:var(--danger-light);color:var(--danger)}
/* Completion modal WhatsApp shortcut */
.compl-wa-btn{display:flex;align-items:center;gap:10px;padding:13px;border-radius:12px;border:2px solid #25d366;background:linear-gradient(135deg,#f0fff4,#dcfce7);text-align:left;cursor:pointer;width:100%;transition:transform .12s}
.compl-wa-btn:active{transform:scale(.97)}
</style>
</head>

function today(){return new Date().toISOString().slice(0,10)}
function tomorrow(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function dateFromStr(s){return new Date(s+'T00:00:00')}
function addDays(dateStr,n){const d=dateFromStr(dateStr);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function weekDays(offset=0){
  const days=[],d=new Date(),dow=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-(dow===0?6:dow-1)+offset*7);
  for(let i=0;i<7;i++){const x=new Date(mon);x.setDate(mon.getDate()+i);days.push(x.toISOString().slice(0,10));}
  return days;
}
function fmtShort(s){
  if(!s)return'';const d=dateFromStr(s);
  if(s===today())return'Vandaag';if(s===tomorrow())return'Morgen';
  return NL_DAYS_S[d.getDay()]+' '+d.getDate()+' '+NL_MONTHS_S[d.getMonth()];
}
function fmtLong(s){if(!s)return'';const d=dateFromStr(s);return NL_DAYS[d.getDay()]+' '+d.getDate()+' '+NL_MONTHS[d.getMonth()]+' '+d.getFullYear()}
function fmtDayHdr(s){
  const d=dateFromStr(s),cap=x=>x[0].toUpperCase()+x.slice(1);
  if(s===today())return'Vandaag — '+cap(NL_DAYS[d.getDay()])+' '+d.getDate()+' '+NL_MONTHS_S[d.getMonth()];
  if(s===tomorrow())return'Morgen — '+cap(NL_DAYS[d.getDay()])+' '+d.getDate()+' '+NL_MONTHS_S[d.getMonth()];
  return cap(NL_DAYS[d.getDay()])+' '+d.getDate()+' '+NL_MONTHS[d.getMonth()];
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function extractPostcode(addr){
  const m=(addr||'').match(/\b([1-9][0-9]{3})\s*[A-Za-z]{2}\b/);
  return m?parseInt(m[1],10):null;
}
function postcodeDistance(pc1,pc2){
  if(!pc1||!pc2)return 30;
  const d=Math.abs(pc1-pc2);
  if(d===0)return 3;if(d<20)return 8;if(d<80)return 16;if(d<300)return 28;return 45;
}
function travelMin(addr1,addr2){
  return Math.round(postcodeDistance(extractPostcode(addr1),extractPostcode(addr2))/40*60);
}
function sameRegion(addr1,addr2){
  const p1=extractPostcode(addr1),p2=extractPostcode(addr2);
  if(!p1||!p2)return false;
  return Math.abs(p1-p2)<200;
}

// ════════════════════════════════════════════════
//  AI: PRICE ENGINE
// ════════════════════════════════════════════════
function aiSuggestPrice(custId,workTypes,date,qtys={}){
  if(!workTypes||!workTypes.length)return null;
  const cust=getCust(custId);
  const notes=[];
  const minFee=Math.max(settings.hourlyRate||45,25);
  const key=[...workTypes].sort().join(',');
  const hist=aiModel.prices[key]||[];

  // ══ ROUTE 1: klant heeft een vaste prijs ══
  // Eigen prijs is het meest betrouwbare signaal — NIET bijsturen met toeslagen of historische data.
  if(cust?.price>0){
    const base=cust.price;
    notes.push(`Vaste klantprijs: €${base}`);

    // Controleer of collega's in de buurt dichtbij zitten qua prijs (sanity-check)
    const similar=customers.filter(c=>c.id!==custId&&c.price>0&&sameRegion(c.address,cust.address||''));
    if(similar.length){
      const avg=Math.round(similar.reduce((s,c)=>s+c.price,0)/similar.length);
      const pct=Math.round(Math.abs(base-avg)/avg*100);
      if(pct>40)notes.push(`Let op: buurtgemiddelde is €${avg} (${pct}% afwijking)`);
      else notes.push(`Buurtgemiddelde: €${avg} (${similar.length} klanten)`);
    }

    const suggestion=Math.max(minFee,Math.ceil(base/5)*5);
    return{
      suggestion,
      min:suggestion,       // eigen prijs = min én max → geen twijfel
      max:suggestion,
      confidence:90,
      dataPoints:hist.length,
      source:'klantprijs',
      notes,
    };
  }

  // ══ ROUTE 2: schatting (geen eigen prijs bekend) ══
  let base=0;
  let source='uurtarief';

  // ── Stap A: Vergelijkbare klanten in dezelfde regio (sterkste externe signaal)
  const sameFreqSameRegio=customers.filter(c=>c.id!==custId&&c.price>0
    &&c.frequency===(cust?.frequency||null)&&sameRegion(c.address,cust?.address||''));
  const sameRegio=customers.filter(c=>c.id!==custId&&c.price>0
    &&sameRegion(c.address,cust?.address||''));

  if(sameFreqSameRegio.length>=2){
    // Mediaan in plaats van gemiddelde → robuuster tegen uitschieters
    const sorted=[...sameFreqSameRegio].sort((a,b)=>a.price-b.price);
    const mid=Math.floor(sorted.length/2);
    base=sorted.length%2?sorted[mid].price:Math.round((sorted[mid-1].price+sorted[mid].price)/2);
    source='vergelijkbaar';
    notes.push(`Mediaan van ${sameFreqSameRegio.length} vergelijkbare klanten (zelfde wijk + frequentie): €${base}`);
  } else if(sameFreqSameRegio.length===1){
    base=sameFreqSameRegio[0].price;
    source='vergelijkbaar';
    notes.push(`Vergelijkbare klant in de buurt (${sameFreqSameRegio[0].name}): €${base}`);
  } else if(sameRegio.length>=2){
    // Zelfde regio, andere frequentie → gebruik als referentie maar minder gewicht
    const sorted=[...sameRegio].sort((a,b)=>a.price-b.price);
    const mid=Math.floor(sorted.length/2);
    const regionBase=sorted.length%2?sorted[mid].price:Math.round((sorted[mid-1].price+sorted[mid].price)/2);
    base=regionBase;
    source='regio';
    notes.push(`Buurtgemiddelde (${sameRegio.length} klanten, andere frequentie): €${base}`);
  } else {
    // ── Stap B: Uurtarief op basis van ingeschatte tijd
    const mins=workTypes.reduce((s,wid)=>{const t=WORK_TYPES.find(x=>x.id===wid);return s+(t?.baseMin||30);},0);
    base=Math.round(mins/60*settings.hourlyRate);
    source='uurtarief';
    notes.push(`Geen vergelijkbare klanten gevonden. Schatting: ${Math.round(mins)} min × €${settings.hourlyRate}/u = €${base}`);
  }

  // ── Stap C: Historische data (alleen als schatting, niet bij vergelijkbare klanten)
  if(source==='uurtarief'&&hist.length>=3){
    const recent=hist.slice(-6);
    const learned=Math.round(recent.reduce((s,p)=>s+p,0)/recent.length);
    const w=Math.min(0.45,hist.length*0.06); // max 45% gewicht van historische data
    const prev=base;
    base=Math.round(base*(1-w)+learned*w);
    notes.push(`Bijgesteld op basis van ${hist.length} eerdere klussen: €${prev} → €${base}`);
  }

  // ── Stap D: Minimumtarief
  if(base<minFee){base=minFee;notes.push(`Minimumtarief €${minFee} toegepast`);}

  // ── Stap E: Frequentietoeslag — alleen bij schatting, NIET bij eigen/vergelijkbare prijs
  if(source==='uurtarief'&&cust?.frequency){
    const days=FREQ_DAYS[cust.frequency]||0;
    if(days>=182){base=Math.round(base*1.15);notes.push('Eenmalig/jaarlijks → +15% (minder routine)');}
    else if(days>=84){base=Math.round(base*1.08);notes.push('Kwartaal → +8%');}
  }

  // ── Stap F: Reistoeslag (alleen als ver van thuisbasis)
  let travelExtra=0;
  if(settings.homePostcode&&cust?.address){
    const homePC=parseInt(settings.homePostcode,10)||0;
    const custPC=extractPostcode(cust.address)||homePC;
    const km=postcodeDistance(homePC,custPC);
    if(km>20){travelExtra=Math.min(15,Math.round((km-20)/10)*5);notes.push(`Reistoeslag €${travelExtra} (${Math.round(km)} km van thuisbasis)`);}
  }

  const suggestion=Math.max(minFee,Math.ceil((base+travelExtra)/5)*5);
  // Betrouwbaarheidsscore: hoger als er meer vergelijkbare klanten zijn
  const conf=Math.min(90,
    (source==='vergelijkbaar'?65:source==='regio'?55:40)+
    Math.min(sameRegio.length*5,20)+
    (hist.length>=5?10:hist.length*2));

  // Min/max: hoe minder zeker, hoe breder de bandbreedte
  const spread=source==='vergelijkbaar'?0.08:source==='regio'?0.12:0.18;
  return{
    suggestion,
    min:Math.max(minFee,Math.round(suggestion*(1-spread)/5)*5),
    max:Math.round(suggestion*(1+spread)/5)*5,
    confidence:conf,
    dataPoints:hist.length,
    source,
    notes,
  };
}

// ════════════════════════════════════════════════
//  AI: PRICE TOOL CALCULATOR (separate from AI suggest)
// ════════════════════════════════════════════════
function aiSuggestPricePT(custId,workTypes,date,qtys,levels){
  if(!workTypes||!workTypes.length)return null;
  const cust=getCust(custId);
  const lineItems=[];
  const notes=[];
  const minFee=Math.max(settings.hourlyRate||45,25);
  const key=[...workTypes].sort().join(',');
  const hist=aiModel.prices[key]||[];
  let calcBase=0; // puur berekend bedrag op basis van werk

  // ── Stap 1: Bereken prijs per werktype (objectief, onafhankelijk van klant)
  workTypes.forEach(wid=>{
    const wt=WORK_TYPES.find(x=>x.id===wid);if(!wt)return;
    if(wt.perM2||wt.perM){
      const qty=parseFloat(qtys[wid])||0;
      const lvl=levels[wid]||'mid';
      const ppM=lvl==='low'?wt.priceMin:lvl==='high'?wt.priceMax:(wt.priceMin+wt.priceMax)/2;
      const sub=qty>0?Math.round(qty*ppM):Math.round(wt.basePrice);
      const lvlLbl=lvl==='low'?'laag':lvl==='high'?'hoog':'midden';
      lineItems.push({icon:wt.icon||'🏠',lbl:qty>0?`${wt.lbl} — ${qty} ${wt.unit||'m²'} × €${ppM.toFixed(1)} (${lvlLbl})`:`${wt.lbl} (geen m² opgegeven — basisprijs)`,price:sub});
      calcBase+=sub;
    } else if(wt.perStuk){
      const qty=Math.max(1,parseFloat(qtys[wid])||1);
      const sub=Math.round(qty*wt.pricePerStuk);
      lineItems.push({icon:wt.icon||'🔧',lbl:`${wt.lbl} — ${qty}× €${wt.pricePerStuk}`,price:sub});
      calcBase+=sub;
    } else if(wt.glasswork){
      const mins=Math.max(5,parseFloat(qtys[wid+'_min'])||wt.baseMin);
      const sub=Math.round(mins/60*settings.hourlyRate);
      lineItems.push({icon:wt.icon||'🪟',lbl:`${wt.lbl} — ${mins} min × €${settings.hourlyRate}/u`,price:sub});
      calcBase+=sub;
    } else {
      const sub=wt.priceFrom||wt.basePrice;
      lineItems.push({icon:wt.icon||'🔧',lbl:wt.lbl,price:sub});
      calcBase+=sub;
    }
  });

  // ── Stap 2: Minimumtarief
  if(calcBase<minFee){calcBase=minFee;notes.push(`Minimumtarief €${minFee} toegepast`);}

  // ── Stap 3: Reistoeslag (objectief, op basis van afstand)
  let travelBonus=0;
  if(settings.homePostcode&&cust?.address){
    const homePC=parseInt(settings.homePostcode,10)||0;
    const custPC=extractPostcode(cust.address)||homePC;
    const km=postcodeDistance(homePC,custPC);
    if(km>20){travelBonus=Math.min(15,Math.round((km-20)/10)*5);
      if(travelBonus>0)notes.push(`Reistoeslag €${travelBonus} (${Math.round(km)} km)`);}
  }

  let finalBase=calcBase+travelBonus;

  // ── Stap 4: Eigen klantprijs — toon als informatief signaal, pas NIET de berekening aan
  // De prijs-tool berekent WAT het werk werkelijk kost; de klantprijs is wat ze gewend zijn.
  // Als er een grote kloof is, meldt de tool dit zodat de gebruiker bewust kan kiezen.
  const sameRegio=cust?customers.filter(c=>c.id!==cust.id&&c.price>0&&sameRegion(c.address,cust.address||'')):[];
  const avgSimilar=sameRegio.length?Math.round(sameRegio.reduce((s,c)=>s+c.price,0)/sameRegio.length):0;

  if(cust?.price>0){
    const diff=Math.round((calcBase-cust.price)/cust.price*100);
    if(Math.abs(diff)>25){
      notes.push(`⚠️ Berekend (€${calcBase}) wijkt ${diff>0?'+':''}${diff}% af van vaste klantprijs €${cust.price}`);
      notes.push('Tip: kloppen de m² / minuten? Of is de klantprijs toe aan herziening?');
    } else {
      notes.push(`✓ Berekend bedrag sluit aan bij klantprijs €${cust.price}`);
    }
  }
  if(avgSimilar>0){
    notes.push(`Buurtgemiddelde: €${avgSimilar} (${sameRegio.length} vergelijkbare klanten)`);
  }

  // ── Stap 5: Historische data als zachte correctie (max 25% gewicht, alleen bij schatting)
  if(!cust?.price&&hist.length>=4){
    const recent=hist.slice(-6);
    const learned=Math.round(recent.reduce((s,p)=>s+p,0)/recent.length);
    const w=Math.min(0.25,hist.length*0.04);
    finalBase=Math.round(finalBase*(1-w)+learned*w);
    if(Math.abs(finalBase-(calcBase+travelBonus))>3)
      notes.push(`Lichte bijstelling o.b.v. ${hist.length} eerdere klussen: €${calcBase+travelBonus} → €${finalBase}`);
  }

  // ── Stap 6: Frequentietoeslag — alleen als er geen vaste klantprijs is
  if(!cust?.price&&cust?.frequency){
    const days=FREQ_DAYS[cust.frequency]||0;
    if(days>=182){finalBase=Math.round(finalBase*1.12);notes.push('Eenmalig/jaarlijks → +12%');}
    else if(days>=84){finalBase=Math.round(finalBase*1.07);notes.push('Kwartaal → +7%');}
  }

  const total=Math.max(minFee,Math.ceil(finalBase/5)*5);
  const conf=Math.min(92,
    (cust?.price>0?72:avgSimilar>0?60:48)+
    lineItems.filter(l=>l.price>0).length*3+
    (hist.length>=4?8:0));

  return{
    suggestion:total,
    min:Math.max(minFee,Math.round(total*0.92/5)*5),
    max:Math.round(total*1.10/5)*5,
    confidence:conf,
    dataPoints:hist.length,
    breakdown:{labor:calcBase,material:0,travel:travelBonus,hist:0},
    lineItems,
    notes,
  };
}

function aiSuggestDates(custId){
  const cust=getCust(custId);
  const suggestions=[];
  for(let d=1;d<=MAX_PLAN_DAYS&&suggestions.length<3;d++){
    const ds=addDays(today(),d);
    const s1=getAvailSlot('w1',ds);
    const s2=getAvailSlot('w2',ds);
    if(!s1.on&&!s2.on)continue;
    const dayJobs=jobs.filter(j=>j.date===ds&&j.status!=='geannuleerd');
    if(dayJobs.length>=(settings.maxJobsPerDay||5))continue;
    let score=60;
    const reasons=[];
    const both=s1.on&&s2.on;
    if(both){score+=30;reasons.push('Beiden beschikbaar');}
    else if(s1.on){score+=10;reasons.push((settings.w1Name||'Ik')+' beschikbaar');}
    else{score+=10;reasons.push((settings.w2Name||'Collega')+' beschikbaar');}
    if(dayJobs.length===0){score+=20;reasons.push('Dag nog leeg');}
    else if(dayJobs.length<=2){score+=8;reasons.push(dayJobs.length+' klus al gepland');}
    if(cust&&dayJobs.length>0){
      const custPC=extractPostcode(cust.address)||0;
      const nearby=dayJobs.some(j=>{const jc=getCust(j.custId);const jp=extractPostcode(jc?.address||'')||0;return jp&&custPC&&Math.abs(jp-custPC)<300;});
      if(nearby){score+=15;reasons.push('Andere klanten in de buurt');}
    }
    // prefer earlier in the week
    const dow=dateFromStr(ds).getDay();
    if(dow>=1&&dow<=4)score+=5;
    suggestions.push({date:ds,score,reasons,w1:s1.on,w2:s2.on,w1time:s1.from+'–'+s1.to,w2time:s2.from+'–'+s2.to,jobCount:dayJobs.length});
  }
  suggestions.sort((a,b)=>b.score-a.score);
  return suggestions.slice(0,3);
}

// ════════════════════════════════════════════════
//  AI: ROUTE OPTIMIZER
// ════════════════════════════════════════════════
function aiOptimizeRoute(dateStr){
  const dayJobs=jobs.filter(j=>j.date===dateStr&&j.status!=='afgerond');
  if(dayJobs.length<=1)return{route:dayJobs,totalKm:0,totalMin:0,savings:0,ordered:dayJobs.length<=1};

  // Build cost matrix (travel minutes between each pair)
  const addrs=dayJobs.map(j=>{const c=getCust(j.custId);return c?c.address:'';});
  const homeAddr=settings.homeAddress||addrs[0];

  // Nearest-neighbor from home
  const remaining=[...Array(dayJobs.length).keys()];
  const route=[];
  let curAddr=homeAddr;

  while(remaining.length>0){
    let bestIdx=0,bestMin=Infinity;
    remaining.forEach((ri,i)=>{
      const m=travelMin(curAddr,addrs[ri]);
      if(m<bestMin){bestMin=m;bestIdx=i;}
    });
    route.push({job:dayJobs[remaining[bestIdx]],travelFromPrev:travelMin(curAddr,addrs[remaining[bestIdx]])});
    curAddr=addrs[remaining[bestIdx]];
    remaining.splice(bestIdx,1);
  }

  // Stats
  const totalMin=route.reduce((s,r)=>s+r.travelFromPrev,0);
  const totalKm=Math.round(totalMin/60*40*10)/10;

  // Original order travel time (for comparison)
  let origMin=0,prev=homeAddr;
  dayJobs.forEach(j=>{const c=getCust(j.custId);const a=c?c.address:'';origMin+=travelMin(prev,a);prev=a;});
  const savings=Math.max(0,origMin-totalMin);

  return{route,totalMin,totalKm,savings,origMin};
}

//  AI: AUTO PLANNER
// ════════════════════════════════════════════════
function aiGetPendingCustomers(){
  const td=dateFromStr(today());
  const result=[];
  customers.forEach(c=>{
    if(!c.frequency||c.frequency==='none')return;
    const days=FREQ_DAYS[c.frequency];if(!days)return;
    // Already has a future planned job?
    const hasPlanned=jobs.some(j=>j.custId===c.id&&j.status!=='afgerond'&&dateFromStr(j.date)>=td);
    if(hasPlanned)return;
    // Last done
    const done=jobs.filter(j=>j.custId===c.id&&j.status==='afgerond').sort((a,b)=>dateFromStr(b.date)-dateFromStr(a.date));
    let dueDate;
    if(done.length>0){dueDate=new Date(dateFromStr(done[0].date));dueDate.setDate(dueDate.getDate()+days);}
    else{dueDate=new Date(td);dueDate.setDate(td.getDate()+3);}
    const urgency=Math.round((dueDate-td)/(86400000));
    result.push({cust:c,dueDate,urgency,overdue:urgency<0});
  });
  return result.sort((a,b)=>a.urgency-b.urgency);
}

function getAvailSlot(worker,dateStr){
  // returns {on:bool,from:'HH:MM',to:'HH:MM'} for worker on dateStr
  const dow=dateFromStr(dateStr).getDay();
  const exc=availability[worker].exceptions[dateStr];
  if(exc!==undefined)return exc;
  const d=availability[worker].days[dow];
  if(typeof d==='object')return d;
  // legacy bool support
  return{on:!!d,from:'07:00',to:'17:00'};
}
function aiIsAvailable(dateStr){
  return getAvailSlot('w1',dateStr).on||getAvailSlot('w2',dateStr).on;
}

function aiFindBestDate(custId,fromDate,maxDays=30){
  const cust=getCust(custId);
  const myRegion=cust?custRegionCode(cust):'????';
  let best=null,bestScore=-999;
  for(let i=0;i<maxDays;i++){
    const ds=addDays(fromDate,i);
    if(!aiIsAvailable(ds))continue;
    const dayJobs=jobs.filter(j=>j.date===ds&&j.status!=='afgerond');
    if(dayJobs.length>=settings.maxJobsPerDay)continue;
    let score=30-i;
    let reason='Beschikbare dag';
    let nearbyNames=[];
    if(cust){
      const regionCounts={};
      dayJobs.forEach(j=>{
        const jc=getCust(j.custId);if(!jc)return;
        const r=custRegionCode(jc);
        regionCounts[r]=(regionCounts[r]||0)+1;
        if(r===myRegion){score+=40;nearbyNames.push(jc.name);}
        else if(sameRegion(cust.address,jc.address)){score+=15;nearbyNames.push(jc.name);}
      });
      if(nearbyNames.length)reason=`Zelfde wijk als ${nearbyNames.slice(0,2).map(n=>n.split(' ')[0]).join(', ')}`;
      // Penalise days dominated by other regions
      const dominantRegion=Object.entries(regionCounts).sort((a,b)=>b[1]-a[1])[0];
      if(dominantRegion&&dominantRegion[0]!==myRegion&&dominantRegion[1]>=2)score-=20;
    }
    score-=dayJobs.length*3;
    if(score>bestScore){
      bestScore=score;
      const eff=Math.min(99,Math.max(30,40+score));
      best={date:ds,reason,effScore:eff,nearbyNames};
    }
  }
  return best;
}

// Wijk-gebaseerde groepsplanning
function aiPlanByWijk(){
  const pending=aiGetPendingCustomers();
  // Groepeer per regio
  const byRegion={};
  pending.forEach(p=>{
    const r=custRegionCode(p.cust);
    if(!byRegion[r])byRegion[r]=[];
    byRegion[r].push(p);
  });
  // Sorteer regio's op urgentie (meest dringend eerst)
  const regions=Object.entries(byRegion).sort((a,b)=>{
    const ua=Math.min(...a[1].map(p=>p.urgency));
    const ub=Math.min(...b[1].map(p=>p.urgency));
    return ua-ub;
  });
  // Plan per regio: verdeel over dagen
  const plan=[]; // [{date, region, label, customers:[]}]
  regions.forEach(([region,pending])=>{
    // Sorteer klanten: verlopen eerst, dan op urgentie
    const sorted=[...pending].sort((a,b)=>a.urgency-b.urgency);
    let remaining=[...sorted];
    let attempt=0;
    while(remaining.length>0&&attempt<5){
      attempt++;
      const fromDate=remaining[0].urgency<0?today():remaining[0].dueDate.toISOString().slice(0,10);
      const best=_findWijkDay(region,fromDate,remaining.length);
      if(!best){break;}
      const chunk=remaining.slice(0,best.slots);
      // Voeg toe aan plan of bestaande dag
      const existing=plan.find(p=>p.date===best.date&&p.region===region);
      if(existing){existing.customers.push(...chunk);}
      else{plan.push({date:best.date,region,label:custRegionLabel(region),customers:chunk,color:REGION_COLORS[Object.keys(byRegion).indexOf(region)%REGION_COLORS.length]});}
      remaining=remaining.slice(best.slots);
    }
  });
  // Sorteer plan op datum
  return plan.sort((a,b)=>a.date.localeCompare(b.date));
}

function _findWijkDay(region,fromDate,needed){
  for(let i=0;i<MAX_PLAN_DAYS;i++){
    const ds=addDays(fromDate,i);
    if(!aiIsAvailable(ds))continue;
    const dayJobs=jobs.filter(j=>j.date===ds&&j.status!=='afgerond');
    const slots=settings.maxJobsPerDay-dayJobs.length;
    if(slots<=0)continue;
    // Check of deze dag al door een andere regio gedomineerd wordt
    const dayRegions=dayJobs.map(j=>{const c=getCust(j.custId);return c?custRegionCode(c):'?';});
    const regionCount=dayRegions.filter(r=>r===region).length;
    const otherCount=dayRegions.filter(r=>r!==region).length;
    // Geef voorkeur aan dag waar dezelfde regio al is, of lege dag
    if(otherCount<=1||regionCount>0){
      return{date:ds,slots:Math.min(slots,needed)};
    }
  }
  // Fallback: eerste beschikbare dag
  for(let i=0;i<MAX_PLAN_DAYS;i++){
    const ds=addDays(fromDate,i);
    if(!aiIsAvailable(ds))continue;
    const slots=settings.maxJobsPerDay-jobs.filter(j=>j.date===ds&&j.status!=='afgerond').length;
    if(slots>0)return{date:ds,slots:Math.min(slots,needed)};
  }
  return null;
}

function aiLearnFromJob(jobId,actualMinutes,priceAccepted){
  const j=getJob(jobId);
  const c=j?getCust(j.custId):null;
  if(!j||!c)return;
  const key=(j.work||[]).sort().join(',');
  if(!aiModel.prices[key])aiModel.prices[key]=[];
  if(!aiModel.durations[key])aiModel.durations[key]=[];
  if(c.price){
    aiModel.prices[key].push(c.price);
    if(aiModel.prices[key].length>20)aiModel.prices[key]=aiModel.prices[key].slice(-20);
  }
  if(actualMinutes){
    aiModel.durations[key].push(actualMinutes);
    if(aiModel.durations[key].length>20)aiModel.durations[key]=aiModel.durations[key].slice(-20);
  }
  aiModel.totalDone++;
  if(priceAccepted!==undefined)aiModel.feedback.push({date:today(),accepted:priceAccepted});
  saveAll();
}

function aiIntelligence(){
  const pts=Object.values(aiModel.prices).reduce((s,a)=>s+a.length,0);
  return Math.min(97,Math.round(25+pts*4.5+aiModel.totalDone*1.5));
}

function aiGetInsights(){
  // Monthly revenue last 6 months
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);
    const y=d.getFullYear(),m=d.getMonth();
    const start=`${y}-${String(m+1).padStart(2,'0')}-01`;
    const end=`${y}-${String(m+1).padStart(2,'0')}-${new Date(y,m+1,0).getDate()}`;
    const mj=jobs.filter(j=>j.date>=start&&j.date<=end&&j.status==='afgerond');
    const rev=mj.reduce((s,j)=>{const c=getCust(j.custId);return s+(c?.price||0);},0);
    months.push({lbl:d.toLocaleDateString('nl-NL',{month:'short'}),rev,jobs:mj.length,y,m});
  }
  // Weekly revenue last 8 weeks
  const weeks=[];
  for(let i=7;i>=0;i--){
    const start=weekDays(-i)[0],end=weekDays(-i)[6];
    const wj=jobs.filter(j=>j.date>=start&&j.date<=end&&j.status==='afgerond');
    const rev=wj.reduce((s,j)=>{const c=getCust(j.custId);return s+(c?.price||0);},0);
    const lbl=dateFromStr(start).toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
    weeks.push({lbl,rev,jobs:wj.length});
  }
  // Top customers
  const custRevenue=customers.map(c=>{
    const done=jobs.filter(j=>j.custId===c.id&&j.status==='afgerond');
    return{c,rev:done.length*(c.price||0),count:done.length};
  }).sort((a,b)=>b.rev-a.rev).slice(0,5);
  // Per worktype avg
  const wtStats=WORK_TYPES.map(wt=>{
    const relevant=jobs.filter(j=>j.status==='afgerond'&&(j.work||[]).includes(wt.id));
    const prices=relevant.map(j=>{const c=getCust(j.custId);return c?.price||0;}).filter(p=>p>0);
    const avgP=prices.length?Math.round(prices.reduce((s,p)=>s+p,0)/prices.length):0;
    return{wt,count:relevant.length,avgP};
  }).filter(x=>x.count>0).sort((a,b)=>b.avgP-a.avgP);
  // Best day
  const dayRev={};
  jobs.filter(j=>j.status==='afgerond').forEach(j=>{
    const dow=dateFromStr(j.date).getDay();
    const c=getCust(j.custId);
    if(!dayRev[dow])dayRev[dow]={total:0,count:0};
    dayRev[dow].total+=(c?.price||0);dayRev[dow].count++;
  });
  const bestDay=Object.entries(dayRev).sort((a,b)=>(b[1].total/b[1].count)-(a[1].total/a[1].count))[0];
  // This month vs last month
  const now=new Date();
  const thisM=months[months.length-1];
  const lastM=months[months.length-2];
  const growth=lastM?.rev>0?Math.round((thisM.rev-lastM.rev)/lastM.rev*100):null;
  return{weeks,months,custRevenue,wtStats,bestDay,thisM,lastM,growth};
}

const getCust=id=>customers.find(c=>c.id===id);
const getJob=id=>jobs.find(j=>j.id===id);
const workLbl=ids=>(ids||[]).map(i=>{const f=WORK_TYPES.find(w=>w.id===i);return f?f.lbl:i;});
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function statusIcon(s){return s==='afgerond'?'✅':s==='onderweg'?'🚗':s==='concept'?'⏳':'📋'}
function _buildJobsByCust(){
  const m=new Map();
  jobs.forEach(j=>{if(!m.has(j.custId))m.set(j.custId,[]);m.get(j.custId).push(j);});
  return m;
}

function getReminders(){
  const result=[],td=dateFromStr(today());
  const twoW=new Date(td);twoW.setDate(twoW.getDate()+14);
  const byC=_buildJobsByCust();
  customers.forEach(c=>{
    if(!c.frequency||c.frequency==='none')return;
    const days=FREQ_DAYS[c.frequency];if(!days)return;
    const cJobs=byC.get(c.id)||[];
    const done=cJobs.filter(j=>j.status==='afgerond').sort((a,b)=>dateFromStr(b.date)-dateFromStr(a.date));
    if(!done.length)return;
    const next=new Date(dateFromStr(done[0].date));next.setDate(next.getDate()+days);
    if(next>=td&&next<=twoW){
      const hasPlanned=cJobs.some(j=>j.status!=='afgerond'&&dateFromStr(j.date)>=td);
      if(!hasPlanned){const du=Math.round((next-td)/86400000);result.push({cust:c,next,daysUntil:du});}
    }
  });
  return result.sort((a,b)=>a.daysUntil-b.daysUntil);
}

              <button onclick="event.stopPropagation();approveJob('${job.id}','w2')" style="padding:6px 10px;border-radius:8px;border:2px solid ${app.w2?'var(--success)':'var(--border)'};background:${app.w2?'var(--success-light)':'#fff'};font-size:11px;font-weight:800;cursor:pointer;color:${app.w2?'var(--success)':'var(--text-muted)'}">${app.w2?'✅':'⬜'} ${w2n}</button>
            </div>
          </div>
          ${aiSug?`<div onclick="event.stopPropagation()" style="background:var(--primary-light);border:1.5px solid var(--primary);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <div>
              <div style="font-size:11px;font-weight:800;color:var(--primary)">🧠 AI stelt voor: ${fmtShort(aiSug.date)}</div>
              <div style="font-size:10px;color:var(--primary);opacity:.75;margin-top:1px">${aiSug.reason}</div>
            </div>
            <button onclick="event.stopPropagation();setJobDate('${job.id}','${aiSug.date}')" style="padding:5px 10px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap">Accepteren</button>
          </div>`:''}
        </div>`;
      }).join('')}
    </div>`;
  }

  // ── Avond-routemelding banner (automatisch of na klik)
  if(S.tab==='vandaag'||S.tab==='morgen'){
    const morgenDs=addDays(today(),1);
    const morgenJobs=jobs.filter(j=>j.date===morgenDs&&j.status!=='afgerond');
    const nowH=new Date().getHours();
    const toonBanner=morgenJobs.length>0&&!S._morgenDismissed&&(nowH>=15||_pendingMorgenMsg);
    if(toonBanner){
      const isAvond=nowH>=18;
      const w2has=!!(settings.w2Phone);
      h+=`<div style="background:${isAvond?'linear-gradient(135deg,#0f172a,#1e3a5f)':'var(--primary-light)'};border:2px solid var(--primary);border-radius:14px;padding:14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div>
            <div style="font-size:13px;font-weight:800;color:${isAvond?'#fff':'var(--primary)'}">📋 Route morgen — ${morgenJobs.length} klus${morgenJobs.length!==1?'sen':''}</div>
            <div style="font-size:11px;color:${isAvond?'rgba(255,255,255,.65)':'var(--text-muted)'};margin-top:2px">${fmtLong(morgenDs)}</div>
          </div>
          <button onclick="S._morgenDismissed=true;render()" style="background:none;border:none;font-size:18px;cursor:pointer;opacity:.5;padding:4px">×</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm" onclick="stuurMorgenRoute()" style="background:var(--primary);color:#fff;border:none;flex:1;min-width:120px">
            📲 ${navigator.share?'Delen':'Stuur naar mij'}
          </button>
          ${w2has?`<button class="btn btn-sm" onclick="stuurMorgenRouteNaarCollega()" style="background:#25d366;color:#fff;border:none;flex:1;min-width:120px">
            💬 Naar ${esc(settings.w2Name||'collega')}
          </button>`:''}
          <button class="btn btn-sm btn-ghost" onclick="S.aiRouteDate='${morgenDs}';nav('ai','route')" style="flex:1;min-width:100px">
            🗺️ Route bekijken
          </button>
        </div>
      </div>`;
    }
  }

  if(S.tab==='vandaag'&&rems.length){
    h+=rems.map(r=>`<div class="reminder-card" onclick="nav('customer','${r.cust.id}')">
      <div style="font-size:24px">🔔</div>
      <div class="reminder-text"><div class="reminder-title">${esc(r.cust.name)}</div>
      <div class="reminder-desc">${r.daysUntil===0?'Vandaag':r.daysUntil===1?'Morgen':'Over '+r.daysUntil+' dagen'} verwacht &middot; ${FREQS[r.cust.frequency]}</div></div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
    </div>`).join('');
  }
  if(S.tab==='kalender'){
    const _calDays=weekDays();if(!S.calDay||!_calDays.includes(S.calDay))S.calDay=today();
    h+=renderCalendar();
  } else if(S.tab==='week'){
    const days=weekDays();const td=today();
    const wj=jobs.filter(j=>days.includes(j.date));
    const rev=wj.reduce((s,j)=>{const c=getCust(j.custId);return s+(c?.price||0);},0);
    h+=`<div class="stats-grid">
      <div class="stat-box"><div class="stat-num">${wj.length}</div><div class="stat-lbl">Klussen</div></div>
      <div class="stat-box"><div class="stat-num" style="color:var(--success)">${wj.filter(j=>j.status==='afgerond').length}</div><div class="stat-lbl">Afgerond</div></div>
      ${isOwner()?`<div class="stat-box"><div class="stat-num" style="color:var(--success);font-size:20px">€${rev}</div><div class="stat-lbl">Omzet</div></div>`:''}
    </div>
    <button class="btn btn-ghost btn-block" style="margin-bottom:10px;border:1.5px solid var(--border)" onclick="openWeekCalModal()">📅 Week toevoegen aan Google Agenda</button>`;
    days.forEach(day=>{
      const dj=jobs.filter(j=>j.date===day).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
      if(dj.length||day===td){
        const isTd=day===td;
        const warns=getTravelWarnings(dj);
        const hasWarn=Object.keys(warns).length>0;
        h+=`<div class="day-hdr${isTd?' today':''}" data-rain-hdr="${day}"><span>${fmtDayHdr(day)}</span><span style="display:flex;align-items:center;gap:6px">${hasWarn?`<span style="font-size:10px;background:var(--warning-light);color:var(--warning);border-radius:6px;padding:2px 6px;font-weight:800">⚠️ Reistijd</span>`:''} ${dj.length?`<span class="day-count">${dj.length}</span>`:''}<span data-weather-date="${day}" style="font-size:12px;opacity:.85"></span></span></div>`;
        h+=dj.length?dj.map(j=>jobCard(j,warns[j.id]||'')).join(''):`<p style="color:var(--text-muted);font-size:13px;padding:4px 4px 8px">Geen klussen</p>`;
      }
    });
  } else {
    const ds=S.tab==='vandaag'?today():tomorrow();
    const fj=jobs.filter(j=>j.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const warns=getTravelWarnings(fj);
    const rev=fj.reduce((s,j)=>{const c=getCust(j.custId);return s+(c?.price||0);},0);
    // Google Calendar events for this day
    const gEventsDay=getGCalForDate(ds);
    if(gCalConnected()&&gEventsDay.length){
      h+=`<div style="background:rgba(66,133,244,.07);border:1.5px solid rgba(66,133,244,.2);border-radius:12px;padding:10px 12px;margin-bottom:10px">
        <div style="font-size:11px;font-weight:800;color:#4285f4;margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px">📅 Google Agenda</div>
        ${gEventsDay.map(e=>{
          const t=gCalTime(e,'start');const te=gCalTime(e,'end');
          return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(66,133,244,.1)">
            <span style="font-size:11px;color:#4285f4;font-weight:700;white-space:nowrap;min-width:40px">${t?t:'Hele dag'}</span>
            <span style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.summary||'(geen titel)')}</span>
            ${t&&te?`<span style="font-size:10px;color:var(--text-muted);flex-shrink:0;margin-left:auto">t/m ${te}</span>`:''}
          </div>`;
        }).join('')}
      </div>`;
    }
    if(fj.length){
      const doel=isOwner()?+(settings.dagDoel||250):0;
      const doneCnt=fj.filter(j=>j.status==='afgerond').length;
      const pct=doel?Math.min(100,Math.round(rev/doel*100)):0;
      const remaining=doel-rev;
      const barCol=pct>=100?'linear-gradient(90deg,var(--success),#22c55e)':pct>=75?'linear-gradient(90deg,var(--warning),#fb923c)':'linear-gradient(90deg,var(--primary),#3b82f6)';
      h+=`<div id="rain-banner-${ds}"></div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-num">${fj.length}</div><div class="stat-lbl">Klussen</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--success)">${doneCnt}</div><div class="stat-lbl">Afgerond</div></div>
        ${isOwner()?`<div class="stat-box" onclick="promptDagDoel()" style="cursor:pointer" title="Klik om doel te wijzigen"><div class="stat-num" style="color:var(--success);font-size:20px">€${rev}</div><div class="stat-lbl">Omzet ${doel?pct+'%':''}</div></div>`:''}
      </div>
      ${isOwner()&&doel?`<div class="rev-goal-bar">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px">🎯 Omzetdoel vandaag</span>
          <span style="font-size:13px;font-weight:800;color:${pct>=100?'var(--success)':pct>=75?'var(--warning)':'var(--text)'}">${pct>=100?'🏆 GEHAALD!':('€'+rev+' / €'+doel)}</span>
        </div>
        <div class="rev-goal-track"><div class="rev-goal-fill" style="background:${barCol};width:${pct}%"></div></div>
        <div style="font-size:11px;color:var(--text-muted)">${pct>=100?'Geweldig werk! 🎉':'Nog €'+remaining+' te gaan · '+fj.filter(j=>j.status!=='afgerond').length+' klus'+(fj.filter(j=>j.status!=='afgerond').length===1?'':'sen')+' open'}</div>
      </div>`:''}
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="btn btn-outline" style="flex:1;border-color:var(--primary);color:var(--primary)" onclick="startRoute('${ds}')">🗺️ Start route</button>
        ${S.tab==='morgen'?`<button class="btn" style="flex:1;background:#25d366;color:#fff" onclick="openBulkWhatsApp('${ds}')">💬 Herinner iedereen</button>`:''}
      </div>`;
      h+=fj.map(j=>jobCard(j,warns[j.id]||'')).join('');
    } else {
      h+=emptyState('🧹',S.tab==='vandaag'?'Geen klussen vandaag':'Geen klussen morgen','Tik op + om in te plannen');
    }
    // Overdue card (vandaag tab only)
    if(S.tab==='vandaag'){
      const overdue=getOverdue();
      if(overdue.length){
        h+=`<div class="card" style="border:2px solid var(--danger);background:var(--danger-light);margin-top:10px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:13px;font-weight:800;color:var(--danger)">🔴 Verlopen klanten (${overdue.length})</div>
            <div style="font-size:11px;color:var(--text-muted)">Al te lang geleden</div>
          </div>
          ${overdue.slice(0,5).map(o=>`
            <div onclick="nav('customer','${o.cust.id}')" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--card);border-radius:10px;margin-bottom:6px;cursor:pointer">
              <div>
                <div style="font-size:13px;font-weight:700">${esc(o.cust.name)}</div>
                <div style="font-size:11px;color:var(--text-muted)">${FREQS[o.cust.frequency]} · ${esc(o.cust.address)}</div>
              </div>
              <span style="font-size:11px;font-weight:800;color:var(--danger);background:var(--danger-light);border:1px solid var(--danger);border-radius:8px;padding:3px 8px;white-space:nowrap">${o.overdueDays}d te laat</span>
            </div>`).join('')}
          ${overdue.length>5?`<div style="text-align:center;font-size:12px;color:var(--text-muted);padding-top:4px">+ ${overdue.length-5} meer</div>`:''}
        </div>`;
      }
    }
  }
  return h;
}

function jobCard(job,warn=''){
  const c=getCust(job.custId);if(!c)return'';
  const wl=workLbl(job.work);
  // "Nu bezig" — job is scheduled for this hour on today
  const nowH=new Date().getHours();
  const isNow=job.date===today()&&job.time&&parseInt(job.time.split(':')[0])===nowH&&job.status==='gepland';
  const borderCol=warn?'var(--warning)':isNow?'#16a34a':'';
  const glow=isNow?'box-shadow:0 0 0 2px #16a34a55,0 4px 14px rgba(22,163,74,.18);':'';
  return`<div class="job-card s-${job.status}" onclick="nav('job','${job.id}')" style="border-left-color:${borderCol};border-left-width:${borderCol?'4px':''};${glow}">
    ${isNow?`<div style="font-size:10px;font-weight:800;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:6px;padding:2px 8px;display:inline-flex;align-items:center;gap:4px;margin-bottom:7px"><span style="width:7px;height:7px;border-radius:50%;background:#16a34a;display:inline-block;animation:dakPulse 1.5s ease-in-out infinite"></span>NU BEZIG</div>`:''}
    <div class="jc-top">
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="jc-name" style="flex:1">${esc(c.name)}</div>
          ${c.price&&isOwner()?`<span class="price-pill" style="font-size:13px;padding:4px 10px;flex-shrink:0">€${c.price}</span>`:''}
        </div>
        <div class="jc-addr"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${esc(c.address)}</div>
      </div>
      <span class="badge b-${job.status}" style="flex-shrink:0;margin-left:8px">${statusIcon(job.status)} ${job.status[0].toUpperCase()+job.status.slice(1)}</span>
    </div>
    <div class="jc-meta">
      ${job.time?`<span class="jc-time" style="${isNow?'color:#16a34a;font-weight:800':''}">${isNow?'🟢 ':''}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${job.time}</span>`:''}
      ${warn?`<span style="font-size:11px;background:var(--warning-light);color:var(--warning);border-radius:6px;padding:2px 7px;font-weight:700">${warn}</span>`:''}
    </div>
    ${wl.length?`<div class="work-chips">${wl.map(l=>`<span class="work-chip">${esc(l)}</span>`).join('')}</div>`:''}
    <div class="jc-actions" onclick="event.stopPropagation()">
      ${job.status!=='onderweg'?`<button class="btn btn-warning btn-sm" onclick="quickStat('${job.id}','onderweg')">🚗 Onderweg</button>`:''}
      ${job.status!=='afgerond'?`<button class="btn btn-success btn-sm" onclick="quickStat('${job.id}','afgerond')">✅ Afgerond</button>`:''}
      ${job.status!=='gepland'?`<button class="btn btn-ghost btn-sm" onclick="quickStat('${job.id}','gepland')">↩ Reset</button>`:''}
      ${c.phone&&job.status!=='afgerond'?`<button class="btn btn-ghost btn-sm" style="background:#f0fff4;border-color:#86efac;color:#15803d" onclick="openWhatsApp('${job.id}')">💬</button>`:''}
    </div>
  </div>`;
}

// ════════════════════════════════════════════════
//  RENDER: JOB DETAIL
// ════════════════════════════════════════════════
function renderJobDetail(){
  const job=getJob(S.jobId);if(!job)return'<p>Niet gevonden.</p>';
  const c=getCust(job.custId);if(!c)return'<p>Klant niet gevonden.</p>';
  const w1n=settings.w1Name||'Ik';
  const w2n=settings.w2Name||'Collega';
  const app=job.approvals||{w1:false,w2:false};
  const isConcept=job.status==='concept';

  const approvalBlock=isConcept?`
    <div style="background:var(--warning-light);border:2px solid var(--warning);border-radius:14px;padding:14px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:800;color:var(--warning);margin-bottom:10px">⏳ Wacht op goedkeuring van beiden</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <button onclick="${app.w1?`revokeApproval('${job.id}','w1')`:`approveJob('${job.id}','w1')`}"
          style="padding:14px 10px;border-radius:12px;border:2px solid ${app.w1?'var(--success)':'var(--border)'};background:${app.w1?'var(--success-light)':'#fff'};cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:24px">${app.w1?'✅':'⬜'}</span>
          <span style="font-size:13px;font-weight:800;color:${app.w1?'var(--success)':'var(--text-muted)'}">${w1n}</span>
          <span style="font-size:10px;color:${app.w1?'var(--success)':'var(--text-muted)'};">${app.w1?'Akkoord':'Tik om goed te keuren'}</span>
        </button>
        <button onclick="${app.w2?`revokeApproval('${job.id}','w2')`:`approveJob('${job.id}','w2')`}"
          style="padding:14px 10px;border-radius:12px;border:2px solid ${app.w2?'var(--success)':'var(--border)'};background:${app.w2?'var(--success-light)':'#fff'};cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px">
          <span style="font-size:24px">${app.w2?'✅':'⬜'}</span>
          <span style="font-size:13px;font-weight:800;color:${app.w2?'var(--success)':'var(--text-muted)'}">${w2n}</span>
          <span style="font-size:10px;color:${app.w2?'var(--success)':'var(--text-muted)'};">${app.w2?'Akkoord':'Tik om goed te keuren'}</span>
        </button>
      </div>
    </div>`:'';

  return`
    <button class="back-btn" onclick="nav('dashboard')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>Terug</button>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div><div style="font-size:20px;font-weight:800">${esc(c.name)}</div>
        <div style="font-size:13px;color:${job.date?'var(--text-muted)':'var(--warning)'};margin-top:3px;font-weight:${job.date?'400':'700'}">${job.date?fmtLong(job.date):'📅 Datum nog in te plannen'}</div></div>
        <span class="badge b-${job.status}">${statusIcon(job.status)} ${job.status[0].toUpperCase()+job.status.slice(1)}</span>
      </div>
      <div class="info-rows" style="margin-bottom:0">
        <div class="info-row"><span class="ir-lbl">Adres</span><a class="ir-val" href="https://maps.google.com/?q=${encodeURIComponent(c.address)}" target="_blank">${esc(c.address)} ↗</a></div>
        ${c.phone?`<div class="info-row"><span class="ir-lbl">Telefoon</span><div style="display:flex;gap:8px;align-items:center"><a class="ir-val" href="tel:${esc(c.phone)}">${esc(c.phone)}</a><a href="https://wa.me/${fmtWaPhone(c.phone)}" target="_blank" style="background:#25d366;color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;text-decoration:none">WhatsApp</a></div></div>`:''}
        <div class="info-row"><span class="ir-lbl">Datum</span><span class="ir-val" style="display:flex;align-items:center;gap:8px">${job.date?`<span>${fmtLong(job.date)}</span>`:`<span style="color:var(--warning);font-weight:700;font-size:12px">In te plannen</span>`}<input type="date" value="${job.date||''}" onchange="setJobDate('${job.id}',this.value)" style="padding:4px 8px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;color:var(--text);background:var(--bg);cursor:pointer;max-width:130px"></span></div>
        <div class="info-row"><span class="ir-lbl">Tijd</span><span class="ir-val">${job.time||'—'}</span></div>
        ${c.price&&isOwner()?`<div class="info-row"><span class="ir-lbl">Prijs</span><span class="ir-val"><span class="price-pill">€${c.price}</span></span></div>`:''}
        ${job.timerStart&&!job.timerEnd?`<div class="info-row"><span class="ir-lbl">Klok</span><span class="ir-val" style="color:var(--success);font-weight:700" id="live-timer">⏱️ loopt...</span></div>`:''}
        ${job.timerEnd?`<div class="info-row"><span class="ir-lbl">Tijd ter plaatse</span><span class="ir-val" style="font-weight:700">⏱️ ${Math.round((job.timerEnd-job.timerStart)/60000)} min</span></div>`:''}
      </div>
    </div>
    ${c.notes?`<div class="card" style="background:var(--warning-light);border:1px solid var(--warning)"><b style="color:var(--warning)">⚠️ Let op:</b> ${esc(c.notes)}</div>`:''}
    ${approvalBlock}
    <span class="section-label">Status</span>
    <div class="status-sel">
      ${isConcept?`<button class="status-opt sel-concept" style="border-color:var(--warning);color:var(--warning)">⏳<span>Concept</span></button>`:''}
      <button class="status-opt ${job.status==='gepland'?'sel-gepland':''}" onclick="setStatus('gepland')">📋<span>Gepland</span></button>
      <button class="status-opt ${job.status==='onderweg'?'sel-onderweg':''}" onclick="setStatus('onderweg')">🚗<span>Onderweg</span></button>
      <button class="status-opt ${job.status==='afgerond'?'sel-afgerond':''}" onclick="setStatus('afgerond')">✅<span>Afgerond</span></button>

function filterCustomers(){
  return customers.filter(c=>{
    if(S.custSearch){const q=S.custSearch.toLowerCase();if(!c.name.toLowerCase().includes(q)&&!c.address.toLowerCase().includes(q))return false;}
    if(S.custRegion&&custRegionCode(c)!==S.custRegion)return false;
    return true;
  });
}
function custRegionCode(c){
  const pc=extractPostcode(c.address);
  return pc?String(Math.floor(pc/100)*100).padStart(4,'0'):'????';
}
function custRegionLabel(code){
  if(code==='????')return'Onbekend';
  return code+'–'+(parseInt(code,10)+99);
}

function renderCustomers(rems){

  // Build region list from all customers
  const allRegions=[...new Set(customers.map(custRegionCode))].sort();

  let filtered=filterCustomers();

  // Sort
  if(S.custSort==='regio'){
    filtered.sort((a,b)=>{const ra=custRegionCode(a),rb=custRegionCode(b);return ra!==rb?ra.localeCompare(rb):a.name.localeCompare(b.name);});
  } else if(S.custSort==='omzet'){
    const doneCount=new Map();
    jobs.forEach(j=>{if(j.status==='afgerond')doneCount.set(j.custId,(doneCount.get(j.custId)||0)+1);});
    filtered.sort((a,b)=>(doneCount.get(b.id)||0)*(b.price||0)-(doneCount.get(a.id)||0)*(a.price||0));
  } else {
    filtered.sort((a,b)=>a.name.localeCompare(b.name));
  }

  // View toggle + search bar
  let h=`
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <div class="search-wrap" style="flex:1;margin-bottom:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Klant zoeken..." value="${esc(S.custSearch)}" oninput="custSearch(this.value)"></div>
    <button onclick="setCustView('list')" title="Lijstweergave" style="padding:8px 12px;border-radius:10px;border:2px solid ${S.custView==='list'?'var(--primary)':'var(--border)'};background:${S.custView==='list'?'var(--primary)':'#fff'};color:${S.custView==='list'?'#fff':'var(--text-muted)'};font-size:16px;cursor:pointer;flex-shrink:0;touch-action:manipulation">☰</button>
    <button onclick="setCustView('map')" title="Kaartweergave" style="padding:8px 12px;border-radius:10px;border:2px solid ${S.custView==='map'?'var(--primary)':'var(--border)'};background:${S.custView==='map'?'var(--primary)':'#fff'};color:${S.custView==='map'?'#fff':'var(--text-muted)'};font-size:16px;cursor:pointer;flex-shrink:0;touch-action:manipulation">🗺️</button>
  </div>`;

  // Map view
  if(S.custView==='map'){
    const legend=allRegions.map((r,i)=>{
      const col=REGION_COLORS[i%REGION_COLORS.length];
      return`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:${col};background:#fff;border:1.5px solid ${col};border-radius:20px;padding:3px 8px;cursor:pointer;${S.custRegion===r?'box-shadow:0 0 0 2px '+col:''};" onclick="setCustRegion(S.custRegion===\`${r}\`?\`\`:\`${r}\`)">${custRegionLabel(r)} <span style="background:${col};color:#fff;border-radius:10px;padding:1px 5px">${customers.filter(c=>custRegionCode(c)===r).length}</span></span>`;
    }).join('');
    h+=`
    <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <button onclick="setCustRegion('')" style="padding:3px 10px;border-radius:20px;border:2px solid ${!S.custRegion?'var(--primary)':'var(--border)'};background:${!S.custRegion?'var(--primary)':'#fff'};color:${!S.custRegion?'#fff':'var(--text-muted)'};font-size:11px;font-weight:700;cursor:pointer">Alle</button>
      ${legend}
    </div>
    <div id="cust-map" style="height:calc(100dvh - 220px);min-height:320px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px"></div>
    <button class="btn btn-primary btn-block" onclick="nav('editcustomer',null)">+ Nieuwe klant toevoegen</button>`;
    return h;
  }

  // List view filters
  h+=`
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <span style="font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0">REGIO:</span>
    <button onclick="setCustRegion('')" style="padding:4px 10px;border-radius:20px;border:2px solid ${!S.custRegion?'var(--primary)':'var(--border)'};background:${!S.custRegion?'var(--primary)':'#fff'};color:${!S.custRegion?'#fff':'var(--text-muted)'};font-size:11px;font-weight:700;cursor:pointer">Alle</button>
    ${allRegions.map(r=>`<button onclick="setCustRegion('${r}')" style="padding:4px 10px;border-radius:20px;border:2px solid ${S.custRegion===r?'var(--primary)':'var(--border)'};background:${S.custRegion===r?'var(--primary)':'#fff'};color:${S.custRegion===r?'#fff':'var(--text-muted)'};font-size:11px;font-weight:700;cursor:pointer">${custRegionLabel(r)}</button>`).join('')}
  </div>

  <div style="display:flex;gap:6px;align-items:center;margin-bottom:12px">
    <span style="font-size:11px;font-weight:700;color:var(--text-muted);flex-shrink:0">SORTEREN:</span>
    ${(isOwner()?[['name','Naam A–Z'],['regio','Regio'],['omzet','Omzet']]:[['name','Naam A–Z'],['regio','Regio']]).map(([k,lbl])=>`<button onclick="setCustSort('${k}')" style="padding:4px 10px;border-radius:20px;border:2px solid ${S.custSort===k?'var(--teal)':'var(--border)'};background:${S.custSort===k?'var(--teal)':'#fff'};color:${S.custSort===k?'#fff':'var(--text-muted)'};font-size:11px;font-weight:700;cursor:pointer">${lbl}</button>`).join('')}
  </div>

  <div style="display:flex;gap:8px;margin-bottom:14px">
    <button class="btn btn-primary" style="flex:1" onclick="nav('editcustomer',null)">+ Nieuwe klant</button>
    <button class="btn btn-ghost" onclick="exportCustomersCSV()" style="flex-shrink:0">⬇️ CSV</button>
  </div>`;

  if(!filtered.length)return h+emptyState('👥','Geen klanten','Geen klanten gevonden voor deze filter');

  // Build last-job Map once (avoid O(n²) sort per card)
  const lastJobMap=new Map();
  jobs.forEach(j=>{const ex=lastJobMap.get(j.custId);if(!ex||j.date>ex.date)lastJobMap.set(j.custId,j);});
  const remSet=new Set(rems.map(r=>r.cust.id));

  // Group by region when sorted by regio
  if(S.custSort==='regio'){
    const groups={};
    filtered.forEach(c=>{const r=custRegionCode(c);(groups[r]=groups[r]||[]).push(c);});
    h+=Object.keys(groups).sort().map(r=>`
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 0 4px;border-bottom:1px solid var(--border);margin-bottom:6px">📍 ${custRegionLabel(r)} <span style="font-weight:500">(${groups[r].length})</span></div>
      ${groups[r].map(c=>custCardHtml(c,remSet,lastJobMap)).join('')}`).join('');
  } else {
    h+=filtered.map(c=>custCardHtml(c,remSet,lastJobMap)).join('');
  }
  return h;
}

function custCardHtml(c,remSet,lastJobMap){
  const hasRem=remSet.has(c.id);
  const lastJob=lastJobMap.get(c.id);
  const region=custRegionLabel(custRegionCode(c));
  // Overdue detection for card
  let overdueTag='';
  if(c.frequency&&c.frequency!=='none'&&lastJob){
    const freqDays=FREQ_DAYS[c.frequency]||0;
    const nextExp=addDays(lastJob.date,freqDays);
    const td=today();
    const hasFuture=jobs.some(j=>j.custId===c.id&&j.status!=='afgerond'&&j.date>=td);
    if(!hasFuture&&nextExp<td){
      const overdD=Math.round((dateFromStr(td)-dateFromStr(nextExp))/86400000);
      overdueTag=`<span class="overd-badge" style="font-size:10px;font-weight:800;color:var(--danger);background:var(--danger-light);border:1px solid var(--danger);border-radius:8px;padding:1px 6px;flex-shrink:0">${overdD}d te laat</span>`;
    } else if(!hasFuture){
      const daysLeft=Math.round((dateFromStr(nextExp)-dateFromStr(td))/86400000);
      if(daysLeft<=7){
        overdueTag=`<span style="font-size:10px;font-weight:700;color:var(--warning);background:var(--warning-light);border-radius:8px;padding:1px 6px;flex-shrink:0">over ${daysLeft}d</span>`;
      }
    }
  }
  return`<div class="cust-card" onclick="nav('customer','${c.id}')">
    <div class="cust-avatar" style="${overdueTag.includes('te laat')?'background:var(--danger)':''}">${c.name[0].toUpperCase()}</div>
    <div class="cust-info">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="cust-name">${esc(c.name)}${hasRem?' 🔔':''}</div>
        ${overdueTag}
      </div>
      <div class="cust-addr">${esc(c.address)}</div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px">
        ${c.frequency&&c.frequency!=='none'?`<span class="freq-chip">${FREQS[c.frequency]}</span>`:''}
        <span style="font-size:10px;color:var(--text-muted);background:var(--gray-light);padding:1px 6px;border-radius:8px">${region}</span>
        ${lastJob?`<span style="font-size:11px;color:var(--text-muted)">Laatste: ${fmtShort(lastJob.date)}</span>`:''}
      </div>
    </div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>`;
}

function renderCustDetail(){
