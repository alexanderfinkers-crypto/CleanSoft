async function lookupDakAddress(){
  const addr=(document.getElementById('dak-addr')?.value||'').trim();
  if(!addr)return;
  const btn=document.getElementById('dak-lookup-btn');
  const setStatus=(html,col='var(--primary)')=>{
    const el=document.getElementById('dak-status');
    if(el)el.innerHTML=`<span style="color:${col}">${html}</span>`;
  };
  if(btn){btn.disabled=true;btn.textContent='⏳';}
  document.getElementById('dak-results').style.display='none';

  // Reset state before new lookup
  _dak3DRoofData=null;_dak3Dm2Override=null;_dak3DCanvasRender=null;
  _dak3DFaces=[];_dak3DFaceAreas=[];_dak3DSelected=new Set();
  if(_dak3DFrameId){cancelAnimationFrame(_dak3DFrameId);_dak3DFrameId=null;}
  const _c3el=document.getElementById('dak-3d-container');
  if(_c3el){_c3el.innerHTML='';_c3el.style.display='none';}
  const _h3el=document.getElementById('dak-3d-hint');
  if(_h3el)_h3el.style.display='none';
  // Reset Leaflet drawing state
  if(window._dakMap){window._dakMap.remove();window._dakMap=null;}
  _dakPolygons=[];_dakCurPts=[];_dakCurLine=null;_dakCurMarkers=[];_dakDrawMode=false;

  try{
    // ── 1. Geocode via Nominatim ──────────────────────────────────────────────
    setStatus('⏳ Adres zoeken…');
    const nmr=await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&q='+encodeURIComponent(addr),
      {headers:{'Accept-Language':'nl'}}   // User-Agent is forbidden header in browser fetch
    );
    const nmd=await nmr.json();
    if(!nmd||!nmd[0]){setStatus('❌ Adres niet gevonden. Probeer: Straat 12, Stad','var(--danger)');return;}
    const lat=parseFloat(nmd[0].lat), lon=parseFloat(nmd[0].lon);
    const fullAddr=nmd[0].display_name.split(',').slice(0,3).join(', ');

    // ── 2. Interactive Leaflet satellite map (PDOK HR + drawing tool) ────────
    await _initDakLeafletMap(lat,lon,fullAddr);

    // Show results immediately so photo is visible while building data loads
    const _bph=document.getElementById('btn-dak-photo'),_b3h=document.getElementById('btn-dak-3d');
    if(_bph){_bph.style.background='var(--primary)';_bph.style.borderColor='var(--primary)';_bph.style.color='#fff';}
    if(_b3h){_b3h.style.background='#fff';_b3h.style.borderColor='var(--border)';_b3h.style.color='var(--text-muted)';}
    document.getElementById('dak-map').style.display='block';
    document.getElementById('dak-results').style.display='block';
    setStatus('⏳ Gebouwdata laden…','var(--primary)');

    // ── 3. PDOK BAG WFS — footprint + bouwjaar + pand ID ─────────────────────
    let wfsFeatures=[];
    try{
      const dB=0.0005;
      const wfsResp=await fetch(
        `https://service.pdok.nl/lv/bag/wfs/v2_0?service=WFS&version=2.0.0&request=GetFeature`+
        `&typeName=bag:pand&outputFormat=application/json&srsName=EPSG:4326&count=20`+
        `&bbox=${lon-dB},${lat-dB},${lon+dB},${lat+dB},urn:ogc:def:crs:OGC::CRS84`
      );
      const wfsData=await wfsResp.json();
      wfsFeatures=wfsData?.features||[];
    }catch(e){wfsFeatures=[];}

    let best=null,bestDist=Infinity;
    wfsFeatures.forEach(f=>{
      const geo=f.geometry;if(!geo)return;
      const ring=geo.type==='Polygon'?geo.coordinates[0]:geo.coordinates?.[0]?.[0];
      if(!ring?.length)return;
      let cx=0,cy=0;
      ring.forEach(([x,y])=>{cx+=x;cy+=y;});
      cx/=ring.length;cy/=ring.length;
      const dist=Math.hypot(cx-lon,cy-lat);
      if(dist<bestDist){
        bestDist=dist;
        const p=f.properties||{};
        best={ring,id:p.identificatiecode||p.identificatie||'',jaar:parseInt(p.bouwjaar||p.oorspronkelijkBouwjaar)||0};
      }
    });

    if(!best){
      // Photo already visible; just warn about missing building data
      setStatus('✅ '+fullAddr+' · geen BAG-data, handmatig invullen','#b45309');
      document.getElementById('dak-auto').innerHTML=`<div style="padding:10px 12px;background:#fef3c7;border-radius:10px;font-size:12px;color:#92400e;margin-bottom:8px">⚠️ Gebouwomtrek niet gevonden in BAG. Open <b>🔧 Aanpassen</b> om grondvlak en daktype handmatig in te voeren.</div>`;
      return;
    }

    const footprintM2=_polyAreaM2(best.ring,lat);
    _dakPerimeterM=_polyPerimM(best.ring,lat);
    const RC=111320,cosL=Math.cos(lat*Math.PI/180);
    const xs=best.ring.map(c=>c[0]),ys=best.ring.map(c=>c[1]);
    const bW=(Math.max(...xs)-Math.min(...xs))*cosL*RC;
    const bH=(Math.max(...ys)-Math.min(...ys))*RC;
    const shorterM=Math.min(bW,bH);

    // ── 4. 3D BAG — daktype + hoogtes ────────────────────────────────────────
    setStatus('⏳ Daktype bepalen…');
    let detType=null,detAngle=null,detWallH=null,src='bouwjaar';
    if(best.id){
      for(const col of['pand','pand3d']){
        try{
          const ac=new AbortController();
          const tid=setTimeout(()=>ac.abort(),6000);
          const b3resp=await fetch(`https://api.3dbag.nl/collections/${col}/items/NL.IMBAG.Pand.${best.id}?f=json`,{signal:ac.signal});
          clearTimeout(tid);
          if(!b3resp.ok)continue;
          const b3j=await b3resp.json();
          const p=b3j.feature?.properties||b3j.properties||{};
          const raw=(p.b3_dak_type||p.dak_type||'').toLowerCase().trim();
          if(raw==='plat'||raw==='plat dak')           detType='plat';
          else if(raw.includes('schild'))              detType='schild';
          else if(raw.includes('1 kap')||raw.includes('shed'))detType='lessenaar';
          else if(raw.length)                          detType='zadel';
          if(detType&&detType!=='plat'){
            const h50=p.b3_h_dak_50p??p.h_dak_50p??null;
            const hMx=p.b3_h_dak_max??p.h_dak_max??null;
            const hMv=p.b3_h_maaiveld??p.h_maaiveld??null;
            // Eave height = 50th-percentile roof height minus ground level
            if(h50!=null&&hMv!=null){const ev=h50-hMv;if(ev>2&&ev<14)detWallH=Math.round(ev*4)/4;}
            if(h50!=null&&hMx!=null&&hMx>h50+0.5&&shorterM>2){
              const rH=hMx-h50,hW=detType==='lessenaar'?shorterM:shorterM/2;
              const deg=Math.round(Math.atan2(rH,hW)*180/Math.PI);
              if(deg>=5&&deg<=60){detAngle=deg;src='3D BAG';}
            }
            if(!detAngle)src='3D BAG';
          }else if(detType)src='3D BAG';
          if(detType)break;
        }catch(_){}
      }
    }

    // ── 5. Fallback op bouwjaar ───────────────────────────────────────────────
    const fb=_dakFallback(best.jaar);
    if(!detType)detType=fb.type;
    if(!detAngle&&detType!=='plat')detAngle=fb.angle;

    // ── 6. Fill controls ──────────────────────────────────────────────────────
    const fpEl=document.getElementById('dak-footprint');
    if(fpEl)fpEl.value=footprintM2.toFixed(1);
    dakSelectType(detType);
    if(detType!=='plat')setDakAngle(detAngle);

    // ── 7. Info cards ─────────────────────────────────────────────────────────
    const TL={plat:'Plat dak',lessenaar:'Lessenaarsdak',zadel:'Zadeldak',schild:'Schilddak'};
    const badge=src==='3D BAG'
      ?`<span style="padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;background:#dbeafe;color:#1d4ed8">3D BAG ✓</span>`
      :`<span style="padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;background:#fef3c7;color:#92400e">schatting bouwjaar ${best.jaar||'?'}</span>`;
    const cards=[
      {icon:'🏠',lbl:'Daktype',  val:TL[detType]||detType},
      {icon:'📐',lbl:'Grondvlak',val:footprintM2.toFixed(1)+' m²'},
      ...(detType!=='plat'?[{icon:'📏',lbl:'Helling',val:detAngle+'°'}]:[]),
      {icon:'🔲',lbl:'Omtrek',   val:_dakPerimeterM.toFixed(0)+' m'},
    ].map(c=>`<div style="flex:1;min-width:68px;background:#fff;border-radius:10px;padding:10px 6px;text-align:center;border:1.5px solid var(--border)">
        <div style="font-size:18px">${c.icon}</div>
        <div style="font-size:10px;color:var(--text-muted);font-weight:600;margin:2px 0">${c.lbl}</div>
        <div style="font-size:13px;font-weight:800">${c.val}</div></div>`).join('');
    document.getElementById('dak-auto').innerHTML=`
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:800;color:var(--success)">✅ Automatisch bepaald</span>${badge}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${cards}</div>`;

    // ── 8. Fetch actual 3D mesh (CityJSON LOD 2.2) ───────────────────────────
    let cityjson=null;
    if(best.id){
      try{
        setStatus('⏳ 3D model ophalen…');
        const ac_cj=new AbortController();
        const tid_cj=setTimeout(()=>ac_cj.abort(),9000);
        const cjResp=await fetch(`https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.${best.id}?f=cityjson`,{signal:ac_cj.signal});
        clearTimeout(tid_cj);
        if(cjResp.ok){
          const cj=await cjResp.json();
          if(cj.CityObjects&&cj.vertices&&cj.vertices.length)cityjson=cj;
        }
      }catch(_){}
    }

    // ── 9. Store 3D data ──────────────────────────────────────────────────────
    // Default wall height based on construction year when 3D BAG doesn't have it
    const _yr=best.jaar||0;
    const _defWH=_yr&&_yr<1940?7.5:_yr&&_yr<1960?7:_yr&&_yr<1980?6.5:_yr&&_yr<2000?5.5:6;
    _dak3DRoofData={type:detType,angle:detAngle||0,footprintM2,W:bW,D:bH,wallH:detWallH||_defWH,jaar:best.jaar||0,ring:best.ring,lat0:lat,cityjson};

    setStatus('✅ '+fullAddr,'var(--success)');
    calcDakOpp();

  }catch(e){
    console.error('lookupDakAddress',e);
    setStatus('❌ Fout: '+e.message,'var(--danger)');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🔍';}
  }
}

function dakSelectType(type){
  const sel=document.getElementById('dak-type-sel');
  if(sel)sel.value=type;
  ['plat','lessenaar','zadel','schild'].forEach(t=>{
    const btn=document.getElementById('daktype-'+t);
    if(!btn)return;
    const on=t===type;
    btn.style.borderColor=on?'var(--primary)':'var(--border)';
    btn.style.background=on?'var(--primary-light,#e8f0fe)':'#fff';
    const spans=btn.querySelectorAll('span');
    if(spans[0])spans[0].style.color=on?'var(--primary)':'var(--text-muted)';
    if(spans[1])spans[1].style.color=on?'var(--primary)':'var(--text)';
  });
  const angSec=document.getElementById('dak-angle-section');
  if(angSec)angSec.style.display=type==='plat'?'none':'block';
  calcDakOpp();
}

function setDakAngle(a){
  const slider=document.getElementById('dak-angle');
  const lbl=document.getElementById('dak-angle-val');
  if(slider)slider.value=a;
  if(lbl)lbl.textContent=a+'°';
  calcDakOpp();
}

function calcDakOpp(){
  const type=document.getElementById('dak-type-sel')?.value;
  if(!type)return;
  const footprint=parseFloat(document.getElementById('dak-footprint')?.value)||0;
  const angle=type==='plat'?0:(parseFloat(document.getElementById('dak-angle')?.value)||0);
  const overstekCm=parseFloat(document.getElementById('dak-overstek')?.value)||0;
  const resultEl=document.getElementById('dak-result');
  const useBtnEl=document.getElementById('dak-use-btn');
  if(!resultEl)return;
  // Allow topo/nok-goot paths without a footprint (they compute from drawn lines)
  const _hasTopo=typeof _dakTopoFaces!=='undefined'&&_dakTopoFaces.length>0;
  const _hasNokGoot=typeof _dakNokLine!=='undefined'&&_dakNokLine&&
                    typeof _dakGootLine!=='undefined'&&_dakGootLine&&
                    typeof _dakPolygons!=='undefined'&&_dakPolygons.length===0;
  if(!footprint&&!_hasTopo&&!_hasNokGoot){
    resultEl.innerHTML='<div style="font-size:13px;color:var(--text-muted)">Voer een adres in of vul het grondvlak handmatig in</div>';
    if(useBtnEl)useBtnEl.style.display='none';
    return;
  }
  // ── Topologie dakvlakken (auto-detected faces from node/edge graph) ──
  if(typeof _dakTopoFaces!=='undefined'&&_dakTopoFaces.length>0&&
     typeof _dakPolygons!=='undefined'&&_dakPolygons.length===0){
    _topoRenderPanel();
    const symDouble=document.getElementById('dak-sym-double')?.checked||false;
    const symMult=symDouble?2:1;
    const globalOvM=(overstekCm||0)/100;
    let grandTotal=0;
    const frows=_dakTopoFaces.map(f=>{
      const pOvM=f.overstek!=null?f.overstek/100:globalOvM;
      const pts=f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};});
      const perim=_dakPolyPerimM(pts);
      const ovArea=pOvM>0?(perim*pOvM+4*pOvM*pOvM):0;
      const sf=f.angle>0?1/Math.cos(f.angle*Math.PI/180):1;
      // If angle is 0 and not explicitly marked flat via toggle, nudge user
      const corrected=(f.area+ovArea)*sf;
      grandTotal+=corrected;
      const FACE_BORDER=['#16a34a','#d97706','#dc2626','#7c3aed','#0891b2'];
      const strokeCol=FACE_BORDER[(f.id-1)%FACE_BORDER.length];
      const isFlat=f.angle===0;
      const parts=[`${f.area.toFixed(1)} m² plat`];
      if(pOvM>0)parts.push(`+${ovArea.toFixed(1)} m² overstek`);
      if(sf>1.001)parts.push(`÷cos(${f.angle}°)=${sf.toFixed(3)}`);
      if(isFlat)parts.push('⚠️ helling=0°');
      return`<tr>
        <td style="padding:5px 8px;font-size:11px;color:var(--text)">
          <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${strokeCol};margin-right:5px;vertical-align:middle"></span>
          <b>Dakvlak ${f.id}</b>${symDouble?' × 2':''}<br>
          <span style="color:${isFlat?'#d97706':'var(--text-muted)'};font-size:10px">${parts.join(' · ')}</span>
        </td>
        <td style="padding:5px 8px;font-size:13px;font-weight:800;text-align:right;color:#7c3aed">${(corrected*symMult).toFixed(1)} m²</td>
      </tr>`;
    }).join('');
    grandTotal*=symMult;
    _dak3Dm2Override=grandTotal;
    resultEl.dataset.m2=grandTotal.toFixed(2);
    const symNote=symDouble?` <span style="font-size:13px;color:#f97316">× 2 vlakken</span>`:'';
    resultEl.innerHTML=`
      <div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1px;line-height:1">${grandTotal.toFixed(1)}<span style="font-size:18px"> m²</span>${symNote}</div>
      <div style="font-size:11px;color:var(--text-muted);margin:4px 0 10px">🔗 ${_dakTopoFaces.length} dakvlak${_dakTopoFaces.length>1?'ken':''}${symDouble?' (×2 symmetrisch zadeldak)':''} · ${_dakTopoEdges.length} lijnen · ${_dakTopoNodes.length} knooppunten</div>
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)">${frows}</table>`;
    if(useBtnEl)useBtnEl.style.display=_dakCalcCallback?'block':'none';
    return;
  }

  // ── Nok/goot lijnberekening (standalone — geen polygonen nodig) ──
  if(typeof _dakNokLine!=='undefined'&&_dakNokLine&&_dakGootLine&&
     typeof _dakPolygons!=='undefined'&&_dakPolygons.length===0){
    _dakRenderNgPanel(); // keep panel in sync
    const symDouble=document.getElementById('dak-sym-double')?.checked||false;
    const symMult=symDouble?2:1;
    const angle=parseInt(document.getElementById('dak-angle')?.value||0)||0;
    const ovCm=parseInt(document.getElementById('dak-overstek')?.value||0)||0;
    const ovM=ovCm/100;
    const RC=111320;
    const nc=_lineCenter(_dakNokLine.pts),gc=_lineCenter(_dakGootLine.pts);
    const dx=(gc.lng-nc.lng)*RC*Math.cos(nc.lat*Math.PI/180),dy=(gc.lat-nc.lat)*RC;
    const run=Math.hypot(dx,dy);
    const slant=angle>0?run/Math.cos(angle*Math.PI/180):run;
    // Use topology totals when available (multiple segments), fall back to single legacy line
    const nokL=_topoLineLen('nok')||_dakNokLine.len,gootL=_topoLineLen('goot')||_dakGootLine.len;
    const nokCnt=_topoLineCount('nok')||1,gootCnt=_topoLineCount('goot')||1;
    const avgW=(nokL+gootL)/2;
    const perimEst=2*(avgW+run);
    const ovArea=ovM>0?(perimEst*ovM+4*ovM*ovM):0;
    const flat=avgW*run+ovArea;
    const area3D=angle>0?flat/Math.cos(angle*Math.PI/180):flat;
    const totalArea=area3D*symMult;
    _dak3Dm2Override=totalArea;
    resultEl.dataset.m2=totalArea.toFixed(2);
    // Pre-compute all conditional strings to avoid nested template literals
    const angleWarn=angle===0?'<span style="color:#d97706"> \u26a0\ufe0f Helling = 0\xb0 \u2014 stel helling in!</span>':'';
    const symNote=symDouble?'<span style="font-size:13px;color:#f97316">\u00d72 vlakken</span>':'';
    const nokSuffix=nokCnt>1?' ('+nokCnt+'\u00d7)':'';
    const gootSuffix=gootCnt>1?' ('+gootCnt+'\u00d7)':'';
    const slantLabel=angle>0?'\u2197 Schuine lengte ('+angle+'\xb0)':'\u2197 Schuine lengte \u26a0\ufe0f';
    const slantRowStyle=angle>0?'':'background:#fffbeb';
    const d3label=angle>0?'\ud83d\udcd0 3D (1 vlak, '+angle+'\xb0)':'\ud83d\udcd0 3D (1 vlak)';
    const symRow=symDouble?'<tr style="background:#fff7ed"><td style="padding:5px 8px;font-size:11px;font-weight:800;color:#c2410c">\u00d7 2 (symmetrisch zadeldak)</td><td style="padding:5px 8px;font-size:14px;font-weight:900;text-align:right;color:#c2410c">'+totalArea.toFixed(1)+' m\u00b2</td></tr>':'';
    const ovRow=ovArea>0?'<tr><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">Overstek '+ovCm+' cm</td><td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right">+'+(ovArea*symMult).toFixed(1)+' m\u00b2</td></tr>':'';
    const subtitle='📐 Nok/goot meting'+(symDouble?' · beide vlakken samen':'')+' · '+angle+'° helling'+(ovM>0?' · '+ovCm+' cm overstek':'');
    resultEl.innerHTML=`
      <div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1px;line-height:1">${totalArea.toFixed(1)}<span style="font-size:18px"> m²</span> ${symNote}</div>
      <div style="font-size:11px;color:var(--text-muted);margin:4px 0 10px">${subtitle}${angleWarn}</div>
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)">
        <tr><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">🟠 Noklijn${nokSuffix}</td><td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right">${nokL.toFixed(1)} m</td></tr>
        <tr><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">🔵 Gootlijn${gootSuffix}</td><td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right">${gootL.toFixed(1)} m</td></tr>
        <tr><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">↔ Diepte nok→goot</td><td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right">${run.toFixed(2)} m</td></tr>
        <tr style="${slantRowStyle}"><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${slantLabel}</td><td style="padding:5px 8px;font-size:13px;font-weight:800;text-align:right;color:var(--success)">${slant.toFixed(2)} m</td></tr>
        <tr><td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">□ Plat (1 vlak)</td><td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right;color:var(--text-muted)">${flat.toFixed(1)} m²</td></tr>
        <tr style="background:#f0fdf4"><td style="padding:5px 8px;font-size:11px;font-weight:700">${d3label}</td><td style="padding:5px 8px;font-size:13px;font-weight:800;text-align:right;color:#16a34a">${area3D.toFixed(1)} m²</td></tr>
        ${symRow}${ovRow}
      </table>`;
    if(useBtnEl)useBtnEl.style.display=_dakCalcCallback?'block':'none';
    return;
  }

  // ── Leaflet drawn polygon override (with per-polygon slope + overstek) ──
  if(typeof _dak3Dm2Override==='number'&&typeof _dakPolygons!=='undefined'&&_dakPolygons.length>0){
    const globalOvM=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;

    // Per polygon: each polygon carries its own angle and optional overstek
    let grandTotal=0;
    const prows=_dakPolygons.map((p,i)=>{
      const pSf=p.angle>0?1/Math.cos(p.angle*Math.PI/180):1.0;          // per-polygon slope
      const pOvM=p.overstek!=null?p.overstek/100:globalOvM;              // per-polygon or global overstek
      const ovArea=pOvM>0?(p.perim*pOvM+4*pOvM*pOvM):0;
      const corrected=(p.area+ovArea)*pSf;
      grandTotal+=corrected;
      const parts=[];
      parts.push(`${p.area.toFixed(1)} m²`);
      if(pOvM>0)parts.push(`+${ovArea.toFixed(1)} m² ov.`);
      if(pSf>1.001)parts.push(`×${pSf.toFixed(3)} (${p.angle}°)`);
      // Nok/goot metrics for this polygon
      const em=_dakEdgeMetrics(i);
      let edgeDetail='';
      if(em.nokLen>0||em.gootLen>0){
        const bits=[];
        if(em.nokLen>0)bits.push(`🟠 nok ${em.nokLen.toFixed(1)} m`);
        if(em.gootLen>0)bits.push(`🔵 goot ${em.gootLen.toFixed(1)} m`);
        if(em.run>0)bits.push(`↔ ${em.run.toFixed(1)} m diep · ↗ ${em.slant.toFixed(1)} m schuins`);
        edgeDetail=`<br><span style="color:#c2410c;font-size:10px">${bits.join(' · ')}</span>`;
      }
      return`<tr>
        <td style="padding:5px 8px;font-size:11px;color:var(--text)">
          <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${p.col};margin-right:5px;vertical-align:middle"></span>
          <b>Vlak ${i+1}</b>
          <span style="color:var(--text-muted);font-size:10px;margin-left:4px">${p.perim.toFixed(0)} m omtrek</span><br>
          <span style="color:var(--text-muted);font-size:10px">${parts.join(' · ')}</span>${edgeDetail}
        </td>
        <td style="padding:5px 8px;font-size:13px;font-weight:800;text-align:right;color:var(--primary)">${corrected.toFixed(1)} m²</td>
      </tr>`;
    }).join('');

    // Add topo face totals (if any topo faces alongside drawn polygons)
    if(typeof _dakTopoFaces!=='undefined'&&_dakTopoFaces.length>0){
      const globalOvM2=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;
      _dakTopoFaces.forEach(f=>{
        const pOvM2=f.overstek!=null?f.overstek/100:globalOvM2;
        const pts2=f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};});
        const perim2=_dakPolyPerimM(pts2);
        const ovArea2=pOvM2>0?(perim2*pOvM2+4*pOvM2*pOvM2):0;
        const sf2=f.angle>0?1/Math.cos(f.angle*Math.PI/180):1;
        grandTotal+=(f.area+ovArea2)*sf2;
      });
    }

    const symDouble2=document.getElementById('dak-sym-double')?.checked||false;
    const symMult2=symDouble2?2:1;
    grandTotal*=symMult2;
    _dak3Dm2Override=grandTotal; // update to fully-corrected value for useDakResult()
    resultEl.dataset.m2=grandTotal.toFixed(2);

    const hasSlopes=_dakPolygons.some(p=>p.angle>0);
    const angles=[...new Set(_dakPolygons.filter(p=>p.angle>0).map(p=>p.angle))].sort((a,b)=>a-b);
    const subtitleParts=[`✏️ ${_dakPolygons.length} vlak${_dakPolygons.length>1?'ken':''} op luchtfoto`];
    if(hasSlopes)subtitleParts.push(angles.length===1?`${angles[0]}° helling`:`${angles.join('°/')}° helling`);
    if(globalOvM>0)subtitleParts.push(`${globalOvM*100|0} cm overstek`);
    if(symDouble2)subtitleParts.push('×2 symmetrisch zadeldak');
    const symNote2=symDouble2?` <span style="font-size:13px;color:#f97316">× 2 vlakken</span>`:'';

    resultEl.innerHTML=`
      <div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1px;line-height:1">${grandTotal.toFixed(1)}<span style="font-size:18px"> m²</span>${symNote2}</div>
      <div style="font-size:11px;color:var(--text-muted);margin:4px 0 10px">${subtitleParts.join(' · ')}</div>
      <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)">${prows}</table>`;
    if(useBtnEl)useBtnEl.style.display=_dakCalcCallback?'block':'none';
    return;
  }
  // ── 3D face-selection override ──────────────────────────────────────────
  if(typeof _dak3Dm2Override==='number'&&_dak3DFaces.length>0){
    const tot=_dak3Dm2Override;
    resultEl.dataset.m2=tot.toFixed(2);
    const frows=_dak3DFaces.map((m,i)=>{
      const on=_dak3DSelected.has(i);
      return`<tr style="opacity:${on?1:.38}"><td style="padding:4px 8px;font-size:11px;color:var(--text)">${on?'✅':'⬜'} ${m.userData.label||'Vlak '+(i+1)}</td><td style="padding:4px 8px;font-size:12px;font-weight:700;text-align:right">${(_dak3DFaceAreas[i]||0).toFixed(1)} m²</td></tr>`;
    }).join('');
    resultEl.innerHTML=`<div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1px;line-height:1">${tot.toFixed(1)}<span style="font-size:18px"> m²</span></div><div style="font-size:12px;color:var(--text-muted);margin:4px 0 12px">${_dak3DSelected.size} van ${_dak3DFaces.length} dakvlakken geselecteerd</div><table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden">${frows}</table>`;
    if(useBtnEl)useBtnEl.style.display=_dakCalcCallback?'block':'none';
    return;
  }
  const angleRad=angle*Math.PI/180;
  const slopeFactor=angle>0?1/Math.cos(angleRad):1.0;
  const dak=footprint*slopeFactor;
  // Use exact BAG perimeter when available, else estimate from footprint (4√A for typical house)
  const overstek=overstekCm/100;
  const perim=_dakPerimeterM>0?_dakPerimeterM:4*Math.sqrt(footprint);
  const overstekArea=overstek>0?(perim*overstek+4*overstek*overstek)*slopeFactor:0;
  const total=dak+overstekArea;
  resultEl.dataset.m2=total.toFixed(2);
  const typeLabels={plat:'Plat dak',lessenaar:'Lessenaarsdak',zadel:'Zadeldak',schild:'Schilddak'};
  const rows=[
    ['Grondvlak (BAG)',_dakPerimeterM>0?`${footprint.toFixed(1)} m² · ${_dakPerimeterM.toFixed(0)} m omtrek`:`${footprint.toFixed(1)} m²`,`${footprint.toFixed(1)} m²`],
    angle>0?['Hellingcorrectie',`${angle}° → ÷ cos(${angle}°)`,`× ${slopeFactor.toFixed(3)}`]:['Correctie','Plat (geen helling)','× 1.000'],
    ['Dakoppervlak',typeLabels[type]||type,`${dak.toFixed(1)} m²`],
    ...(overstekArea>0?[['Overstek',`${overstekCm} cm rondom`,`+ ${overstekArea.toFixed(1)} m²`]]:[]),
  ];
  const tableRows=rows.map(([k,v,r])=>`
    <tr>
      <td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${k}</td>
      <td style="padding:5px 8px;font-size:11px;color:var(--text-muted)">${v}</td>
      <td style="padding:5px 8px;font-size:12px;font-weight:700;text-align:right">${r}</td>
    </tr>`).join('');
  resultEl.innerHTML=`
    <div style="font-size:36px;font-weight:900;color:var(--primary);letter-spacing:-1px;line-height:1">${total.toFixed(1)}<span style="font-size:18px"> m²</span></div>
    <div style="font-size:12px;color:var(--text-muted);margin:4px 0 12px">${typeLabels[type]||type}${angle>0?' · '+angle+'° helling':''}</div>
    <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden">${tableRows}</table>`;
  if(useBtnEl)useBtnEl.style.display=_dakCalcCallback?'block':'none';
}

function useDakM2(){
  const m2=parseFloat(document.getElementById('dak-result')?.dataset?.m2||0);
  if(_dakCalcCallback&&m2>0){
    const inp=document.getElementById(_dakCalcCallback);
    if(inp){inp.value=m2.toFixed(1);inp.dispatchEvent(new Event('input'));}
  }
  closeModal();
}

// ════════════════════════════════════════════════════════════════════════════
//  INTERACTIEVE LUCHTFOTOKAART + DAK TEKENEN (Leaflet)
// ════════════════════════════════════════════════════════════════════════════
window._dakMap=null;      // Leaflet map instance
let _dakDrawMode=false;   // drawing polygon?
let _dakPolygons=[];      // [{pts,layer,lbl,area,perim,col,angle,overstek}]
let _dakCurPts=[];        // current polygon in progress
let _dakCurLine=null;     // polyline preview while drawing
let _dakCurMarkers=[];    // vertex dot markers + edge-length labels + area label
let _dakLeafletLoaded=false;
let _dakRubberBand=null;  // preview line cursor→last point
let _dakSnapActive=false; // true when cursor near first point (snap-to-close)
let _dakMeasureMode=false;// ruler mode
let _dakMeasurePts=[];    // [latlng] for ruler
let _dakMeasureLayers=[];  // ruler layers on map
// Nok / goot lijnmodus
let _dakNokLine=null;     // {pts,layer,lbl} or null
let _dakGootLine=null;    // {pts,layer,lbl} or null
let _dakLineType=null;    // 'nok'|'goot'|null — which line is being drawn
let _dakLinePts=[];       // points collected during current line draw
let _dakLinePrev=null;    // rubber-band preview polyline for line draw
let _dakLineVerts=[];     // vertex markers during line draw
// Topology: shared nodes (bolletjes), edges (lijnen), auto-detected faces (dakvlakken)
let _dakTopoNodes=[];    // [{id,lat,lng,marker}]
let _dakTopoEdges=[];    // [{id,type,n1id,n2id,pts,layer,lbl,len,endMarkers}]
let _dakTopoFaces=[];    // [{id,nodeIds,polyLayer,lbl,area,angle,overstek}]
let _topoNodeIdCtr=0,_topoEdgeIdCtr=0,_topoFaceIdCtr=0;
let _dakTopoSnapNode=null; // node currently highlighted for snap

async function _loadLeaflet(){
  if(_dakLeafletLoaded||window.L)return;
  await new Promise((res,rej)=>{
    const lk=document.createElement('link');lk.rel='stylesheet';
    lk.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(lk);
    const ls=document.createElement('script');
    ls.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    ls.onload=()=>{_dakLeafletLoaded=true;res();};ls.onerror=rej;document.head.appendChild(ls);
  });
}

async function _initDakLeafletMap(lat,lon,addr){
  const mapDiv=document.getElementById('dak-map');
  if(!mapDiv)return;
  try{await _loadLeaflet();}catch(e){
    // Leaflet failed to load — fall back to static image
    const zf=0.0008;
    const esriUrl=`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?bbox=${lon-zf},${lat-zf},${lon+zf},${lat+zf}&bboxSR=4326&imageSR=4326&size=640,400&f=image&format=jpg`;
    mapDiv.innerHTML=`<div style="position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--border)"><img src="${esriUrl}" style="width:100%;height:260px;object-fit:cover;display:block"><div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);padding:5px 10px;font-size:11px;color:#fff">📍 ${esc(addr)}</div></div>`;
    mapDiv.style.display='block';return;
  }

  // Reset state
  if(window._dakMap){window._dakMap.remove();window._dakMap=null;}
  _dakDrawMode=false;_dakPolygons=[];_dakCurPts=[];_dakCurLine=null;_dakCurMarkers=[];
  _dakRubberBand=null;_dakSnapActive=false;
  _dakNokLine=null;_dakGootLine=null;_dakLineType=null;_dakLinePts=[];_dakLinePrev=null;_dakLineVerts=[];
  _dakTopoNodes=[];_dakTopoEdges=[];_dakTopoFaces=[];_topoNodeIdCtr=0;_topoEdgeIdCtr=0;_topoFaceIdCtr=0;_dakTopoSnapNode=null;

  const hasBagRing=!!(window._dak3DRoofData?.ring?.length>=3);

  // Loading overlay + draw UI
  mapDiv.innerHTML=`
    <div style="position:relative">
      <div id="dak-leaflet" style="height:440px;border-radius:12px;overflow:hidden;border:2px solid var(--border)"></div>
      <div id="dak-map-loading" style="position:absolute;inset:0;background:rgba(255,255,255,.82);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:500;pointer-events:none">
        <div style="width:32px;height:32px;border:3px solid var(--primary);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></div>
        <span style="font-size:12px;font-weight:700;color:var(--primary)" id="dak-map-load-txt">Satellietkaart laden…</span>
      </div>
      <div id="dak-layer-badge" style="position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;z-index:400;display:none"></div>
    </div>
    <!-- toolbar: rij 1 = modus-knoppen -->
    <div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap">
      <button onclick="_dakStartDraw()" id="btn-dak-draw"
        style="padding:7px 13px;border-radius:10px;border:2px solid var(--primary);background:var(--primary);color:#fff;font-size:12px;font-weight:800;cursor:pointer" title="Teken een dakvlak als polygon">✏️ Vlak</button>
      <button onclick="_dakStartLineDraw('nok')" id="btn-dak-nok"
        style="padding:7px 12px;border-radius:10px;border:2px solid #f97316;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:800;cursor:pointer" title="Teken de noklijn (bovenkant dak)">🟠 Nok</button>
      <button onclick="_dakStartLineDraw('goot')" id="btn-dak-goot"
        style="padding:7px 12px;border-radius:10px;border:2px solid #3b82f6;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:800;cursor:pointer" title="Teken de gootlijn (onderkant dak)">🔵 Goot</button>
      <button onclick="_dakStartLineDraw('kilkeper')" id="btn-dak-kilkeper"
        style="padding:7px 12px;border-radius:10px;border:2px solid #8b5cf6;background:#f5f3ff;color:#6d28d9;font-size:12px;font-weight:800;cursor:pointer" title="Teken een kilkeper (diagonale daklijn)">⚡ Kilkeper</button>
      ${hasBagRing?`<button onclick="_dakLoadBAGPoly()" id="btn-dak-bag"
        style="padding:7px 11px;border-radius:10px;border:2px solid #0d9488;background:#ccfbf1;color:#0f766e;font-size:12px;font-weight:700;cursor:pointer" title="Gebruik BAG gebouwvlak">📥 BAG</button>`:''}
      <button onclick="_dakToggleMeasure()" id="btn-dak-measure"
        style="padding:7px 10px;border-radius:10px;border:2px solid var(--border);background:var(--gray-light);color:var(--text);font-size:12px;font-weight:700;cursor:pointer" title="Meetlint">📏</button>
      <button onclick="_dakClearAll()" id="btn-dak-clear"
        style="display:none;padding:7px 10px;border-radius:10px;border:2px solid var(--danger);background:#fff0f0;color:var(--danger);font-size:12px;font-weight:700;cursor:pointer" title="Alles wissen">🗑</button>
    </div>
    <!-- toolbar: rij 2 = contextgevoelige knoppen tijdens tekenen -->
    <div style="display:flex;gap:5px;margin-top:5px;flex-wrap:wrap" id="dak-ctx-bar">
      <button onclick="_dakUndoPoint()" id="btn-dak-undo"
        style="display:none;padding:6px 11px;border-radius:9px;border:2px solid #f59e0b;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;cursor:pointer">↩ Undo</button>
      <button onclick="_dakFinishPoly()" id="btn-dak-finish"
        style="display:none;padding:6px 13px;border-radius:9px;border:2px solid var(--success);background:var(--success);color:#fff;font-size:11px;font-weight:800;cursor:pointer">✅ Vlak sluiten</button>
      <button onclick="_dakFinishLine()" id="btn-dak-line-finish"
        style="display:none;padding:6px 13px;border-radius:9px;border:2px solid #374151;background:#374151;color:#fff;font-size:11px;font-weight:800;cursor:pointer">⬛ Stop</button>
      <button onclick="_dakUndoLinePt()" id="btn-dak-line-undo"
        style="display:none;padding:6px 11px;border-radius:9px;border:2px solid #f59e0b;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700;cursor:pointer">↩ Annuleer start</button>
    </div>
    <div id="dak-draw-info" style="font-size:11px;color:var(--text-muted);font-weight:600;min-height:18px;margin-top:4px"></div>
    <!-- Nok/goot measurement panel -->
    <div id="dak-ng-panel"></div>
    <!-- Polygon list -->
    <div id="dak-poly-list" style="margin-top:4px"></div>`;
  mapDiv.style.display='block';

  const map=L.map('dak-leaflet',{center:[lat,lon],zoom:19,zoomControl:true,
    attributionControl:false,maxZoom:21});
  window._dakMap=map;
  L.control.attribution({prefix:false,position:'bottomright'}).addTo(map);

  // Force correct size after the container becomes visible
  setTimeout(()=>map.invalidateSize(),100);
  window.addEventListener('resize',()=>map.invalidateSize(),{once:false});

  // Tile layers — maxNativeZoom: PDOK tops out at z20, Esri at z21
  // Setting maxNativeZoom lets Leaflet upscale tiles beyond that instead of going blank
  const pdok=L.tileLayer(
    'https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg',
    {maxZoom:21,maxNativeZoom:20,attribution:'© PDOK / Kadaster',keepBuffer:6,updateWhenIdle:false});
  const esri=L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:21,maxNativeZoom:21,attribution:'© Esri World Imagery',keepBuffer:6,updateWhenIdle:false});

  // Loading overlay: remove once first tile finishes
  const hideLoading=()=>{
    const ov=document.getElementById('dak-map-loading');
    if(ov)ov.style.display='none';
  };
  let tilesStarted=false;
  pdok.on('tileload',()=>{if(!tilesStarted){tilesStarted=true;hideLoading();}});
  pdok.on('tileerror',()=>{
    // Switch to Esri after a couple of errors
    if(!map._esriFallback){
      map._esriFallback=true;
      const txt=document.getElementById('dak-map-load-txt');
      if(txt)txt.textContent='PDOK niet beschikbaar, Esri laden…';
      esri.addTo(map);
      esri.on('tileload',()=>{if(!tilesStarted){tilesStarted=true;hideLoading();}});
      pdok.remove();
      const badge=document.getElementById('dak-layer-badge');
      if(badge){badge.textContent='© Esri';badge.style.display='block';}
    }
  });
  // Safety: hide overlay after 8 s regardless
  setTimeout(hideLoading,8000);
  pdok.addTo(map);

  // ── Shared rubber-band: polygon OR line draw ──
  const RC=111320;
  map.on('mousemove',e=>{
    if(_dakRubberBand){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}
    const infoEl=document.getElementById('dak-draw-info');

    // LINE DRAW rubber-band (2-click mode: 0 pts = pick start, 1 pt = pick end)
    if(_dakLineType){
      const TYPE_COLS={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
      const col=TYPE_COLS[_dakLineType]||'#6b7280';
      const snapNd=_topoFindNodeNear(e.latlng.lat,e.latlng.lng);
      // Update snap highlight
      if(snapNd!==_dakTopoSnapNode){
        if(_dakTopoSnapNode)_topoSetNodeHighlight(_dakTopoSnapNode,false);
        if(snapNd)_topoSetNodeHighlight(snapNd,true);
        _dakTopoSnapNode=snapNd;
      }
      const snapTarget=snapNd?L.latLng(snapNd.lat,snapNd.lng):e.latlng;
      if(_dakLinePts.length===1){
        // Phase 2: start chosen, show live rubber band to cursor
        const start=_dakLinePts[0];
        const edx=(snapTarget.lng-start.lng)*RC*Math.cos(start.lat*Math.PI/180);
        const edy=(snapTarget.lat-start.lat)*RC;
        const d=Math.hypot(edx,edy);
        const snapping=!!snapNd;
        _dakRubberBand=L.polyline([start,snapTarget],{
          color:snapping?'#f59e0b':col,weight:snapping?4:3,opacity:.9,interactive:false
        }).addTo(map);
        if(infoEl)infoEl.innerHTML=snapping
          ?`<span style="color:#d97706;font-weight:800">🟡 Klik om te verbinden met bolletje ${snapNd.id} (${d.toFixed(1)} m)</span>`
          :`<span style="color:${col};font-weight:700">↗ Klik het eindpunt · ${d.toFixed(1)} m · of snap op een bolletje</span>`;
      } else {
        // Phase 1: no start yet — show snap hint on nodes
        const TYPE_NM={nok:'noklijn (bovenkant)',goot:'gootlijn (onderkant)',kilkeper:'kilkeper (zijkant)'};
        if(infoEl)infoEl.innerHTML=snapNd
          ?`<span style="color:#d97706;font-weight:800">🟡 Klik op bolletje ${snapNd.id} om hier te starten</span>`
          :`<span style="font-weight:600">Klik een startpunt voor de <b>${TYPE_NM[_dakLineType]}</b></span>`;
      }
      return;
    }

    // POLYGON rubber-band
    if(!_dakDrawMode||_dakCurPts.length===0)return;
    const last=_dakCurPts[_dakCurPts.length-1];
    const first=_dakCurPts[0];
    const sdx=(e.latlng.lng-first.lng)*RC*Math.cos(first.lat*Math.PI/180);
    const sdy=(e.latlng.lat-first.lat)*RC;
    const wasSnap=_dakSnapActive;
    _dakSnapActive=_dakCurPts.length>=3&&Math.hypot(sdx,sdy)<5;
    if(_dakSnapActive!==wasSnap)_updateDakDrawPreview(map);
    const target=_dakSnapActive?first:e.latlng;
    _dakRubberBand=L.polyline([last,target],{color:_dakSnapActive?'#ef4444':'#22c55e',
      weight:_dakSnapActive?2.5:1.5,dashArray:'5,4',opacity:.75}).addTo(map);
    const edx=(e.latlng.lng-last.lng)*RC*Math.cos(last.lat*Math.PI/180);
    const edy=(e.latlng.lat-last.lat)*RC;
    const edgeDist=Math.hypot(edx,edy);
    if(!infoEl)return;
    if(_dakSnapActive){
      infoEl.innerHTML='<span style="color:#ef4444;font-weight:800">🔒 Klik om vlak te sluiten!</span>';
    } else if(_dakCurPts.length>=2){
      const liveArea=_dakPolyAreaM2([..._dakCurPts,e.latlng]);
      infoEl.textContent=`${_dakCurPts.length} punten · kant: ${edgeDist.toFixed(1)} m · ~${liveArea.toFixed(1)} m²`;
    } else {
      infoEl.textContent=`${_dakCurPts.length} punt · kant: ${edgeDist.toFixed(1)} m`;
    }
  });

  // ── Unified click handler ──
  map.on('click',e=>{
    // MEASURE MODE
    if(_dakMeasureMode){
      _dakMeasurePts.push(e.latlng);
      const infoEl=document.getElementById('dak-draw-info');
      if(_dakMeasurePts.length===1){
        const m=L.circleMarker(e.latlng,{radius:5,color:'#7c3aed',fillColor:'#7c3aed',fillOpacity:1,weight:2}).addTo(map);
        _dakMeasureLayers.push(m);
        if(infoEl)infoEl.textContent='📏 Klik een tweede punt om afstand te meten';
      } else {
        const [a,b]=_dakMeasurePts;
        const dx=(b.lng-a.lng)*RC*Math.cos(a.lat*Math.PI/180);
        const dy=(b.lat-a.lat)*RC;
        const dist=Math.hypot(dx,dy);
        const line=L.polyline([a,b],{color:'#7c3aed',weight:2,dashArray:'5,4'}).addTo(map);
        const midLat=(a.lat+b.lat)/2,midLon=(a.lng+b.lng)/2;
        const lbl=L.marker([midLat,midLon],{icon:L.divIcon({className:'',
          html:`<div style="background:#7c3aed;color:#fff;border-radius:7px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.3)">${dist.toFixed(1)} m</div>`,
          iconAnchor:[35,10]}),interactive:false}).addTo(map);
        _dakMeasureLayers.push(line,lbl);
        _dakMeasurePts=[];
        if(infoEl)infoEl.textContent=`📏 ${dist.toFixed(1)} m — klik opnieuw om door te meten`;
      }
      return;
    }
    // LINE DRAW — map click on EMPTY space (clicks on bolletjes are handled by the node marker itself)
    if(_dakLineType){
      const TYPE_COLS={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
      const col=TYPE_COLS[_dakLineType]||'#6b7280';
      // Check if we're near an existing node (within 30px) — if so, use its exact position
      const snapNd=_topoFindNodeNear(e.latlng.lat,e.latlng.lng);
      const addPt=snapNd?L.latLng(snapNd.lat,snapNd.lng):e.latlng;

      if(_dakLinePts.length===0){
        // Phase 1: set start point (new or snapped node)
        _dakLinePts=[addPt];
        _dakLineVerts.forEach(m=>map.removeLayer(m));_dakLineVerts=[];
        if(!snapNd){
          // Show temp start dot for new (not-yet-existing) node
          const dot=L.circleMarker(addPt,{
            radius:9,color:'#fff',fillColor:col,fillOpacity:1,weight:3,interactive:false,zIndexOffset:1100
          }).addTo(map);
          _dakLineVerts=[dot];
        } else {
          _topoSetNodeHighlight(snapNd,true);
          setTimeout(()=>_topoSetNodeHighlight(snapNd,false),700);
        }
        _updateLineDrawUI();
        const infoEl=document.getElementById('dak-draw-info');
        const TYPE_ICONS={nok:'🟠 Nok',goot:'🔵 Goot',kilkeper:'⚡ Kilkeper'};
        if(infoEl)infoEl.innerHTML=snapNd
          ?`<span style="color:${col};font-weight:800">${TYPE_ICONS[_dakLineType]} start: bolletje ${snapNd.id}</span> — klik nu het eindpunt`
          :`<span style="color:${col};font-weight:800">${TYPE_ICONS[_dakLineType]} startpunt geplaatst</span> — klik nu het eindpunt`;
      } else {
        // Phase 2: end point → complete edge immediately
        _dakLinePts.push(addPt);
        _dakCompleteEdge();
      }
      return;
    }
    // POLYGON DRAW
    if(!_dakDrawMode)return;
    if(_dakSnapActive&&_dakCurPts.length>=3){L.DomEvent.stop(e);_dakFinishPoly();return;}
    _dakCurPts.push(e.latlng);
    _updateDakDrawPreview(map);
    _updateDakDrawUI();
  });

  // ── Double-click: finish polygon or line ──
  map.on('dblclick',e=>{
    L.DomEvent.stop(e);
    // Double-click in line draw = stop chaining
    if(_dakLineType){_dakCancelLineDraw();return;}
    if(_dakMeasureMode)return;
    if(_dakDrawMode&&_dakCurPts.length>=3){_dakFinishPoly();}
  });

  // Address pin
  L.marker([lat,lon],{zIndexOffset:-100}).addTo(map)
    .bindTooltip(`📍 ${addr}`,{permanent:false,direction:'top'});

  // BAG footprint reference outline + auto-zoom to it
  if(hasBagRing){
    const fpPts=_dak3DRoofData.ring.map(([lo,la])=>[la,lo]);
    const fpLayer=L.polygon(fpPts,{color:'#0066bb',fillColor:'#0066bb',fillOpacity:0.07,
      weight:2,dashArray:'8,4',interactive:false}).addTo(map);
    fpLayer.bindTooltip('BAG gebouwcontour',{direction:'top',sticky:true});
    // Zoom to building with padding
    map.fitBounds(fpLayer.getBounds(),{padding:[28,28],maxZoom:20});
  }
}

function _updateDakDrawPreview(map){
  if(!map)return;
  if(_dakCurLine){map.removeLayer(_dakCurLine);_dakCurLine=null;}
  _dakCurMarkers.forEach(m=>map.removeLayer(m));_dakCurMarkers=[];
  if(_dakCurPts.length===0)return;
  const pts=_dakCurPts;
  const n=pts.length;
  const canClose=n>=3;

  // Filled polygon preview
  _dakCurLine=L.polygon(pts,{color:'#22c55e',fillColor:'#22c55e',fillOpacity:0.18,weight:2.5,dashArray:canClose?null:'6,4'}).addTo(map);

  // Numbered vertex dots
  pts.forEach((p,i)=>{
    const isFirst=i===0;
    const isLast=i===n-1&&n>1;
    const snap=isFirst&&canClose&&_dakSnapActive;
    const size=isFirst&&canClose?22:18;
    const bg=snap?'#ef4444':isFirst&&canClose?'#22c55e':isLast?'#f59e0b':'#22c55e';
    const anim=snap?'animation:dakSnapPulse 0.7s infinite':isFirst&&canClose?'animation:dakPulse 1.4s infinite':'';
    const dot=L.marker(p,{
      icon:L.divIcon({
        className:'',
        html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#fff;${anim}">${snap?'✕':i+1}</div>`,
        iconAnchor:[size/2,size/2]
      }),
      interactive:false,zIndexOffset:300+i
    }).addTo(map);
    _dakCurMarkers.push(dot);
  });

  // Edge-length labels on each placed segment
  const RC=111320;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n];
    if(i===n-1&&!canClose)continue; // no closing edge label when < 3 pts
    const dx=(b.lng-a.lng)*RC*Math.cos(a.lat*Math.PI/180);
    const dy=(b.lat-a.lat)*RC;
    const dist=Math.hypot(dx,dy);
    if(dist<0.5)continue;
    const midLat=(a.lat+b.lat)/2,midLon=(a.lng+b.lng)/2;
    const lbl=L.marker([midLat,midLon],{
      icon:L.divIcon({
        className:'',
        html:`<div style="background:rgba(0,0,0,.62);color:#fff;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none">${dist<10?dist.toFixed(2):dist.toFixed(1)} m</div>`,
        iconAnchor:[24,9]
      }),interactive:false,zIndexOffset:-50
    }).addTo(map);
    _dakCurMarkers.push(lbl);
  }

  // Live area badge in polygon centre (when ≥3 pts)
  if(canClose){
    const area=_dakPolyAreaM2(pts);
    const cLat=pts.reduce((s,q)=>s+q.lat,0)/n;
    const cLon=pts.reduce((s,q)=>s+q.lng,0)/n;
    const areaLbl=L.marker([cLat,cLon],{
      icon:L.divIcon({
        className:'',
        html:`<div style="background:rgba(34,197,94,.92);color:#fff;border-radius:10px;padding:5px 13px;font-size:14px;font-weight:900;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.28);pointer-events:none">${area.toFixed(1)} m²</div>`,
        iconAnchor:[40,16]
      }),interactive:false,zIndexOffset:200
    }).addTo(map);
    _dakCurMarkers.push(areaLbl);
  }
}

function _updateDakDrawUI(){
  const n=_dakCurPts.length;
  const infoEl=document.getElementById('dak-draw-info');
  const undoBtn=document.getElementById('btn-dak-undo');
  const finBtn=document.getElementById('btn-dak-finish');
  if(infoEl)infoEl.textContent=_dakDrawMode?(n===0?'Klik op de kaart om punten te plaatsen':n<3?`${n} punt${n>1?'en':''} — minimaal 3 nodig`:`${n} punten — dubbelklik of klik ✅ om te sluiten`):'';
  if(undoBtn)undoBtn.style.display=_dakDrawMode&&n>0?'':'none';
  if(finBtn)finBtn.style.display=_dakDrawMode&&n>=3?'':'none';
}

function _dakStartDraw(){
  _dakDrawMode=true;_dakCurPts=[];_dakSnapActive=false;
  if(_dakRubberBand&&window._dakMap){window._dakMap.removeLayer(_dakRubberBand);_dakRubberBand=null;}
  if(window._dakMap)_dakMap.getContainer().style.cursor='crosshair';
  const drawBtn=document.getElementById('btn-dak-draw');
  if(drawBtn){drawBtn.textContent='✏️ Tekenen…';drawBtn.style.background='#92400e';drawBtn.style.borderColor='#92400e';}
  _updateDakDrawUI();
}

function _dakUndoPoint(){
  _dakCurPts.pop();
  _dakSnapActive=false;
  _updateDakDrawPreview(window._dakMap);
  _updateDakDrawUI();
}

function _dakFinishPoly(){
  if(!_dakDrawMode||_dakCurPts.length<3)return;
  _dakDrawMode=false;_dakSnapActive=false;
  if(window._dakMap)_dakMap.getContainer().style.cursor='';
  const drawBtn=document.getElementById('btn-dak-draw');
  if(drawBtn){drawBtn.textContent='✏️ Teken vlak';drawBtn.style.background='var(--primary)';drawBtn.style.borderColor='var(--primary)';}

  const map=window._dakMap;
  if(_dakRubberBand){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}
  if(_dakCurLine){map.removeLayer(_dakCurLine);_dakCurLine=null;}
  _dakCurMarkers.forEach(m=>map.removeLayer(m));_dakCurMarkers=[];

  const pts=[..._dakCurPts];
  const area=_dakPolyAreaM2(pts);
  const perim=_dakPolyPerimM(pts);
  const ri=_dakPolygons.length;
  const COLORS=['#22c55e','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];
  const col=COLORS[ri%COLORS.length];
  // Default angle: use current global angle slider (or BAG-detected angle)
  const defAngle=parseInt(document.getElementById('dak-angle')?.value||0)||0;

  const layer=L.polygon(pts,{color:col,fillColor:col,fillOpacity:0.22,weight:2.5}).addTo(map);
  _dakPolygons.push({pts,layer,lbl:null,area,perim,col,angle:defAngle,overstek:null,
    edgeTypes:new Array(pts.length).fill(''),edgeAnnotating:false,edgeMidMarkers:[],edgeOverlays:[]});
  _dakUpdatePolyLabel(ri); // create label with corrected area
  _dakCurPts=[];
  _updateDakDrawUI();
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

function _dakUpdatePolyLabel(idx){
  const p=_dakPolygons[idx];if(!p||!window._dakMap)return;
  if(p.lbl)window._dakMap.removeLayer(p.lbl);
  const globalOvM=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;
  const pOvM=p.overstek!=null?p.overstek/100:globalOvM;
  const ovArea=pOvM>0?(p.perim*pOvM+4*pOvM*pOvM):0;
  const sf=p.angle>0?1/Math.cos(p.angle*Math.PI/180):1.0;
  const corrected=(p.area+ovArea)*sf;
  const cLat=p.pts.reduce((s,q)=>s+q.lat,0)/p.pts.length;
  const cLon=p.pts.reduce((s,q)=>s+q.lng,0)/p.pts.length;
  const tag=p.angle>0?` · ${p.angle}°`:'';
  const ovTag=pOvM>0&&p.overstek!=null?` · ov.${p.overstek|0}`:'';
  p.lbl=L.marker([cLat,cLon],{icon:L.divIcon({
    className:'',
    html:`<div style="background:${p.col};color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)">${corrected.toFixed(1)} m²${tag}${ovTag}</div>`,
    iconAnchor:[36,14]
  })}).addTo(window._dakMap);
  _dakPolygons[idx]=p;
}

function _dakSetPolyAngle(idx,angle){
  if(!_dakPolygons[idx])return;
  _dakPolygons[idx].angle=+angle;
  _dakUpdatePolyLabel(idx);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

function _dakRemovePoly(idx){
  const map=window._dakMap;
  const p=_dakPolygons[idx];
  if(!p||!map)return;
  map.removeLayer(p.layer);
  if(p.lbl)map.removeLayer(p.lbl);
  (p.edgeMidMarkers||[]).forEach(m=>map.removeLayer(m));
  (p.edgeOverlays||[]).forEach(l=>map.removeLayer(l));
  _dakPolygons.splice(idx,1);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

function _dakRenderPolyList(){
  const el=document.getElementById('dak-poly-list');if(!el)return;
  if(!_dakPolygons.length){el.innerHTML='';return;}
  const globalOvM=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;
  let html='<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">';
  _dakPolygons.forEach((p,i)=>{
    const isPlat=p.angle===0;
    const pOvM=p.overstek!=null?p.overstek/100:globalOvM;
    const sf=isPlat?1.0:1/Math.cos(p.angle*Math.PI/180);
    const ovArea=pOvM>0?(p.perim*pOvM+4*pOvM*pOvM):0;
    const corrected=(p.area+ovArea)*sf;
    const hasCustomOv=p.overstek!=null;
    const isAnnotating=!!p.edgeAnnotating;

    // Nok/goot edge metrics
    const em=_dakEdgeMetrics(i);
    const hasNok=em.nokLen>0,hasGoot=em.gootLen>0;
    const hasAnnotation=hasNok||hasGoot;

    // Annotation panel: metrics table when both are marked
    let annotInfo='';
    if(hasAnnotation&&!isPlat){
      const rows=[];
      if(hasNok)rows.push(`<tr><td style="padding:2px 8px 2px 0;font-size:10px;color:var(--text-muted)">🟠 Nok</td><td style="font-size:10px;font-weight:700;padding:2px 0">${em.nokLen.toFixed(1)} m</td></tr>`);
      if(hasGoot)rows.push(`<tr><td style="padding:2px 8px 2px 0;font-size:10px;color:var(--text-muted)">🔵 Goot</td><td style="font-size:10px;font-weight:700;padding:2px 0">${em.gootLen.toFixed(1)} m</td></tr>`);
      if(hasNok&&hasGoot){
        rows.push(`<tr><td style="padding:2px 8px 2px 0;font-size:10px;color:var(--text-muted)">↔ Diepte</td><td style="font-size:10px;font-weight:700;padding:2px 0">${em.run.toFixed(1)} m</td></tr>`);
        rows.push(`<tr><td style="padding:2px 8px 2px 0;font-size:10px;color:var(--text-muted)">↗ Schuins</td><td style="font-size:10px;font-weight:700;color:#16a34a;padding:2px 0">${em.slant.toFixed(2)} m (${p.angle}°)</td></tr>`);
      }
      annotInfo=`<div style="padding:4px 11px 8px;border-top:1px solid var(--border)">
        <table style="width:100%">${rows.join('')}</table>
        ${hasNok&&hasGoot?`<div style="font-size:10px;color:var(--text-muted);margin-top:3px">Opp. = (${em.nokLen.toFixed(1)}+${em.gootLen.toFixed(1)})/2 × ${em.slant.toFixed(2)} = <b style="color:var(--success)">${((em.nokLen+em.gootLen)/2*em.slant).toFixed(1)} m²</b></div>`:''}
      </div>`;
    }

    html+=`<div style="background:var(--gray-light);border-radius:12px;border:1.5px solid ${isAnnotating?'#f97316':hasAnnotation?'#fdba74':'var(--border)'};overflow:hidden">
      <!-- top row -->
      <div style="display:flex;align-items:center;gap:7px;padding:9px 11px 5px">
        <span style="width:12px;height:12px;border-radius:3px;background:${p.col};flex-shrink:0;display:inline-block"></span>
        <span style="font-size:12px;font-weight:800">Vlak ${i+1}</span>
        <span style="font-size:10px;color:var(--text-muted);flex:1">${p.area.toFixed(1)} m² · ${p.perim.toFixed(0)} m</span>
        <span style="font-size:13px;font-weight:900;color:var(--success)">${corrected.toFixed(1)} m²</span>
        <button onclick="_dakRemovePoly(${i})" style="background:none;border:none;cursor:pointer;font-size:14px;padding:0 2px;opacity:.45;flex-shrink:0" title="Verwijder">🗑</button>
      </div>
      <!-- slope row -->
      <div style="display:flex;align-items:center;gap:6px;padding:4px 11px 4px">
        <span style="font-size:10px;color:var(--text-muted);min-width:34px;font-weight:600">Helling</span>
        <button onclick="_dakToggleFlat(${i})"
          style="padding:2px 8px;border-radius:6px;border:1.5px solid ${isPlat?'var(--primary)':'var(--border)'};background:${isPlat?'var(--primary)':'#fff'};color:${isPlat?'#fff':'var(--text-muted)'};font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0">${isPlat?'✓ Plat':'Plat'}</button>
        <div style="flex:1;display:flex;align-items:center;gap:5px;${isPlat?'opacity:.3;pointer-events:none':''}">
          <input type="range" min="5" max="70" step="1" value="${isPlat?30:p.angle}"
            style="flex:1;accent-color:${p.col};min-width:40px;height:4px"
            oninput="_dakSetPolyAngle(${i},+this.value)">
          <span style="font-size:11px;font-weight:800;min-width:28px;color:${p.col}">${isPlat?'—':p.angle+'°'}</span>
        </div>
        <span style="font-size:10px;color:var(--text-muted)">${isPlat?'geen':'×'+sf.toFixed(2)}</span>
      </div>
      <!-- overstek row -->
      <div style="display:flex;align-items:center;gap:6px;padding:4px 11px 6px">
        <span style="font-size:10px;color:var(--text-muted);min-width:34px;font-weight:600">Overstek</span>
        <button onclick="_dakTogglePolyOverstek(${i})"
          style="padding:2px 8px;border-radius:6px;border:1.5px solid ${hasCustomOv?'#7c3aed':'var(--border)'};background:${hasCustomOv?'#7c3aed':'#fff'};color:${hasCustomOv?'#fff':'var(--text-muted)'};font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0">${hasCustomOv?'✓ Eigen':'Eigen'}</button>
        <div style="flex:1;display:flex;align-items:center;gap:5px;${!hasCustomOv?'opacity:.35;pointer-events:none':''}">
          <input type="range" min="0" max="60" step="5" value="${hasCustomOv?p.overstek:(globalOvM*100|0)}"
            style="flex:1;accent-color:#7c3aed;min-width:40px;height:4px"
            oninput="_dakSetPolyOverstek(${i},+this.value)">
          <span style="font-size:11px;font-weight:800;min-width:30px;color:#7c3aed">${hasCustomOv?p.overstek+'cm':'—'}</span>
        </div>
        <span style="font-size:10px;color:var(--text-muted)">${pOvM>0?'+'+ovArea.toFixed(1)+' m²':'geen'}</span>
      </div>
      <!-- nok/goot annotation row -->
      <div style="display:flex;align-items:center;gap:6px;padding:4px 11px 8px;border-top:1px dashed var(--border)">
        <span style="font-size:10px;color:var(--text-muted);min-width:34px;font-weight:600">Nok/goot</span>
        <button onclick="_dakToggleAnnotate(${i})"
          style="padding:2px 8px;border-radius:6px;border:1.5px solid ${isAnnotating?'#f97316':'var(--border)'};background:${isAnnotating?'#fff7ed':'#fff'};color:${isAnnotating?'#c2410c':'var(--text-muted)'};font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0">${isAnnotating?'✓ Aanwijzen':'Aanwijzen'}</button>
        ${isAnnotating?`<span style="font-size:10px;color:#c2410c;font-weight:600;flex:1">Klik op rand → 🟠 Nok / 🔵 Goot / leeg</span>`
          :hasAnnotation?`<span style="font-size:10px;color:var(--text-muted);flex:1">${hasNok?'🟠 nok '+em.nokLen.toFixed(1)+'m':''} ${hasGoot?'🔵 goot '+em.gootLen.toFixed(1)+'m':''} ${em.run>0?'↔ '+em.run.toFixed(1)+'m':''}</span>`
          :`<span style="font-size:10px;color:var(--text-muted);flex:1;opacity:.6">Wijs nok en goot aan voor nauwkeurige meting</span>`}
      </div>
      ${annotInfo}
    </div>`;
  });
  // Total row
  if(_dakPolygons.length>1){
    const grandTotal=_dakPolygons.reduce((s,p)=>{
      const sf2=p.angle>0?1/Math.cos(p.angle*Math.PI/180):1.0;
      const pOv2=p.overstek!=null?p.overstek/100:globalOvM;
      const ov2=pOv2>0?(p.perim*pOv2+4*pOv2*pOv2):0;
      return s+(p.area+ov2)*sf2;
    },0);
    html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:var(--primary-light,#e8f0fe);border-radius:10px;border:1.5px solid var(--primary)">
      <span style="font-size:12px;font-weight:800;color:var(--primary)">Totaal ${_dakPolygons.length} vlakken</span>
      <span style="font-size:16px;font-weight:900;color:var(--primary)">${grandTotal.toFixed(1)} m²</span>
    </div>`;
  }
  html+='</div>';
  el.innerHTML=html;
}

function _dakToggleFlat(idx){
  if(!_dakPolygons[idx])return;
  _dakPolygons[idx].angle=_dakPolygons[idx].angle===0?(parseInt(document.getElementById('dak-angle')?.value||0)||30):0;
  _dakUpdatePolyLabel(idx);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

// ── NOK / GOOT EDGE ANNOTATION ────────────────────────────────────────────────

// Toggle annotation mode on/off for polygon idx
function _dakToggleAnnotate(idx){
  const p=_dakPolygons[idx];if(!p||!window._dakMap)return;
  p.edgeAnnotating=!p.edgeAnnotating;
  if(p.edgeAnnotating){_dakShowEdgeMarkers(idx);}
  else{_dakHideEdgeMarkers(idx);}
  _dakRenderPolyList();
}

// Show clickable edge midpoint buttons + colored overlays on map
function _dakShowEdgeMarkers(idx){
  const p=_dakPolygons[idx];if(!p||!window._dakMap)return;
  _dakHideEdgeMarkers(idx);
  const map=window._dakMap;
  const n=p.pts.length;
  const RC=111320;
  for(let i=0;i<n;i++){
    const a=p.pts[i],b=p.pts[(i+1)%n];
    const midLat=(a.lat+b.lat)/2,midLon=(a.lng+b.lng)/2;
    const dx=(b.lng-a.lng)*RC*Math.cos(a.lat*Math.PI/180);
    const dy=(b.lat-a.lat)*RC;
    const elen=Math.hypot(dx,dy);
    const type=(p.edgeTypes||[])[i]||'';
    const col=type==='nok'?'#f97316':type==='goot'?'#3b82f6':'#6b7280';
    const icon=type==='nok'?'🟠 Nok':type==='goot'?'🔵 Goot':'＋';
    const m=L.marker([midLat,midLon],{
      icon:L.divIcon({
        className:'',
        html:`<div style="background:${col};color:#fff;border-radius:8px;padding:3px 9px;font-size:10px;font-weight:800;white-space:nowrap;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);border:2px solid #fff;user-select:none">${icon} ${elen.toFixed(1)}m</div>`,
        iconAnchor:[36,12]
      }),
      zIndexOffset:600
    }).addTo(map);
    m.on('click',()=>_dakCycleEdgeType(idx,i));
    p.edgeMidMarkers.push(m);

    // Draw colored line overlay for annotated edges
    if(type){
      const linecol=type==='nok'?'#f97316':'#3b82f6';
      const ov=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{
        color:linecol,weight:5,opacity:0.85,interactive:false,
        dashArray:type==='nok'?null:'8,4'
      }).addTo(map);
      p.edgeOverlays.push(ov);
    }
  }
}

// Remove all edge annotation layers for polygon idx
function _dakHideEdgeMarkers(idx){
  const p=_dakPolygons[idx];if(!p||!window._dakMap)return;
  const map=window._dakMap;
  (p.edgeMidMarkers||[]).forEach(m=>map.removeLayer(m));
  p.edgeMidMarkers=[];
  (p.edgeOverlays||[]).forEach(l=>map.removeLayer(l));
  p.edgeOverlays=[];
}

// Cycle edge type: '' → 'nok' → 'goot' → ''
function _dakCycleEdgeType(idx,edgeIdx){
  const p=_dakPolygons[idx];if(!p)return;
  const seq=['','nok','goot'];
  const cur=(p.edgeTypes||[])[edgeIdx]||'';
  p.edgeTypes[edgeIdx]=seq[(seq.indexOf(cur)+1)%seq.length];
  // Refresh markers and recalculate
  _dakShowEdgeMarkers(idx);
  _dakUpdatePolyLabel(idx);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

// Compute nok/goot edge lengths, run (horizontal depth) and slant height for polygon idx
function _dakEdgeMetrics(idx){
  const p=_dakPolygons[idx];
  const none={nokLen:0,gootLen:0,run:0,slant:0,nokPts:[],gootPts:[]};
  if(!p||!p.edgeTypes)return none;
  const n=p.pts.length;
  const RC=111320;
  let nokLen=0,gootLen=0;
  const nokMids=[],gootMids=[];
  for(let i=0;i<n;i++){
    const t=p.edgeTypes[i]||'';
    if(!t)continue;
    const a=p.pts[i],b=p.pts[(i+1)%n];
    const dx=(b.lng-a.lng)*RC*Math.cos(a.lat*Math.PI/180);
    const dy=(b.lat-a.lat)*RC;
    const elen=Math.hypot(dx,dy);
    const midLat=(a.lat+b.lat)/2,midLon=(a.lng+b.lng)/2;
    if(t==='nok'){nokLen+=elen;nokMids.push({lat:midLat,lng:midLon});}
    else if(t==='goot'){gootLen+=elen;gootMids.push({lat:midLat,lng:midLon});}
  }
  let run=0,slant=0;
  if(nokMids.length&&gootMids.length){
    // Centroid of nok midpoints ↔ centroid of goot midpoints
    const nLat=nokMids.reduce((s,q)=>s+q.lat,0)/nokMids.length;
    const nLon=nokMids.reduce((s,q)=>s+q.lng,0)/nokMids.length;
    const gLat=gootMids.reduce((s,q)=>s+q.lat,0)/gootMids.length;
    const gLon=gootMids.reduce((s,q)=>s+q.lng,0)/gootMids.length;
    const rdx=(gLon-nLon)*RC*Math.cos(nLat*Math.PI/180);
    const rdy=(gLat-nLat)*RC;
    run=Math.hypot(rdx,rdy);
    const ang=p.angle||0;
    slant=ang>0?run/Math.cos(ang*Math.PI/180):run;
  }
  return{nokLen,gootLen,run,slant,nokPts:nokMids,gootPts:gootMids};
}

// Set per-polygon overstek (in cm)
function _dakSetPolyOverstek(idx,val){
  if(!_dakPolygons[idx])return;
  _dakPolygons[idx].overstek=+val;
  _dakUpdatePolyLabel(idx);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

// Toggle per-polygon overstek: null = use global, 0+ = own value
function _dakTogglePolyOverstek(idx){
  if(!_dakPolygons[idx])return;
  const globalCm=(parseInt(document.getElementById('dak-overstek')?.value||0)||0);
  _dakPolygons[idx].overstek=_dakPolygons[idx].overstek!=null?null:globalCm;
  _dakUpdatePolyLabel(idx);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}

// Load BAG building footprint as a drawn polygon
function _dakLoadBAGPoly(){
  if(!window._dak3DRoofData?.ring?.length)return;
  const map=window._dakMap;if(!map)return;
  // Stop any ongoing draw
  if(_dakDrawMode){_dakDrawMode=false;_dakCurPts=[];_updateDakDrawPreview(map);_updateDakDrawUI();}
  const ring=_dak3DRoofData.ring;
  const pts=ring.map(([lo,la])=>({lat:la,lng:lo}));
  const area=_dakPolyAreaM2(pts);
  const perim=_dakPolyPerimM(pts);
  const ri=_dakPolygons.length;
  const COLORS=['#22c55e','#3b82f6','#f59e0b','#ef4444','#8b5cf6'];
  const col=COLORS[ri%COLORS.length];
  const defAngle=parseInt(document.getElementById('dak-angle')?.value||0)||0;
  const latlngs=pts.map(p=>[p.lat,p.lng]);
  const layer=L.polygon(latlngs,{color:col,fillColor:col,fillOpacity:0.22,weight:2.5}).addTo(map);
  _dakPolygons.push({pts,layer,lbl:null,area,perim,col,angle:defAngle,overstek:null,
    edgeTypes:new Array(pts.length).fill(''),edgeAnnotating:false,edgeMidMarkers:[],edgeOverlays:[]});
  _dakUpdatePolyLabel(ri);
  _dakRenderPolyList();
  _dakUpdateTotalArea();
}
