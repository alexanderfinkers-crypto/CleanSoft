function _dakStartLineDraw(type){
  // Stop any active polygon draw or measure mode
  if(_dakDrawMode){_dakDrawMode=false;_dakCurPts=[];if(_dakCurLine&&window._dakMap){window._dakMap.removeLayer(_dakCurLine);_dakCurLine=null;}_dakCurMarkers.forEach(m=>window._dakMap?.removeLayer(m));_dakCurMarkers=[];}
  if(_dakMeasureMode){_dakMeasureMode=false;const b=document.getElementById('btn-dak-measure');if(b){b.style.background='var(--gray-light)';b.style.borderColor='var(--border)';b.style.color='var(--text)';b.textContent='📏';}}
  // Toggle off if same type clicked again
  if(_dakLineType===type){_dakCancelLineDraw();return;}
  // Cancel any other line in progress
  _dakCancelLineDraw();
  _dakLineType=type;
  _dakLinePts=[];
  if(window._dakMap)_dakMap.getContainer().style.cursor='crosshair';
  // Style active button
  const TYPE_BG={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
  const TYPE_BORDER={nok:'#c2410c',goot:'#1d4ed8',kilkeper:'#5b21b6'};
  const TYPE_REST_BG={nok:'#fff7ed',goot:'#eff6ff',kilkeper:'#f5f3ff'};
  const TYPE_REST_BORDER={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
  const TYPE_REST_COL={nok:'#c2410c',goot:'#1d4ed8',kilkeper:'#6d28d9'};
  const TYPE_ICON={nok:'🟠',goot:'🔵',kilkeper:'⚡'};
  const TYPE_NAME={nok:'noklijn (bovenkant dak)',goot:'gootlijn (onderkant dak)',kilkeper:'kilkeper (diagonale lijn)'};
  const nokBtn=document.getElementById('btn-dak-nok');
  const gootBtn=document.getElementById('btn-dak-goot');
  const kilkBtn=document.getElementById('btn-dak-kilkeper');
  const btns={nok:nokBtn,goot:gootBtn,kilkeper:kilkBtn};
  Object.entries(btns).forEach(([t,btn])=>{
    if(!btn)return;
    if(t===type){btn.style.background=TYPE_BG[t];btn.style.borderColor=TYPE_BORDER[t];btn.style.color='#fff';}
    else{btn.style.background=TYPE_REST_BG[t];btn.style.borderColor=TYPE_REST_BORDER[t];btn.style.color=TYPE_REST_COL[t];}
  });
  _updateLineDrawUI();
  const infoEl=document.getElementById('dak-draw-info');
  if(infoEl)infoEl.textContent=`${TYPE_ICON[type]||'📌'} Klik een startpunt voor de ${TYPE_NAME[type]||type} — klik 2 punten om lijn te tekenen`;
}

function _dakCancelLineDraw(){
  if(!_dakLineType)return;
  const map=window._dakMap;
  if(_dakLinePrev&&map){map.removeLayer(_dakLinePrev);_dakLinePrev=null;}
  _dakLineVerts.forEach(m=>map?.removeLayer(m));_dakLineVerts=[];
  if(_dakRubberBand&&map){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}
  if(_dakTopoSnapNode){_topoSetNodeHighlight(_dakTopoSnapNode,false);_dakTopoSnapNode=null;}
  _dakLineType=null;_dakLinePts=[];
  if(map)map.getContainer().style.cursor='';
  // Reset button styles
  const nb=document.getElementById('btn-dak-nok'),gb=document.getElementById('btn-dak-goot'),kb=document.getElementById('btn-dak-kilkeper');
  if(nb){nb.style.background='#fff7ed';nb.style.borderColor='#f97316';nb.style.color='#c2410c';}
  if(gb){gb.style.background='#eff6ff';gb.style.borderColor='#3b82f6';gb.style.color='#1d4ed8';}
  if(kb){kb.style.background='#f5f3ff';kb.style.borderColor='#8b5cf6';kb.style.color='#6d28d9';}
  _updateLineDrawUI();
}

function _dakUndoLinePt(){
  // In 2-click mode, "undo" just cancels the start point pick back to phase-1
  if(!_dakLineType||_dakLinePts.length===0)return;
  _dakLinePts=[];
  const map=window._dakMap;
  _dakLineVerts.forEach(m=>map?.removeLayer(m));_dakLineVerts=[];
  if(_dakLinePrev&&map){map.removeLayer(_dakLinePrev);_dakLinePrev=null;}
  if(_dakRubberBand&&map){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}
  if(_dakTopoSnapNode){_topoSetNodeHighlight(_dakTopoSnapNode,false);_dakTopoSnapNode=null;}
  _updateLineDrawUI();
  const infoEl=document.getElementById('dak-draw-info');
  if(infoEl){const TYPE_NM={nok:'noklijn',goot:'gootlijn',kilkeper:'kilkeper'};infoEl.textContent=`Klik een startpunt voor de ${TYPE_NM[_dakLineType]||'lijn'}`;}
}

// ── Stop chaining (✅ button) ──
function _dakFinishLine(){
  _dakCancelLineDraw(); // simply stop drawing; all edges already drawn in _dakCompleteEdge
}

// ── Complete one edge (called after 2nd click in line-draw mode) ──
function _dakCompleteEdge(){
  if(!_dakLineType||_dakLinePts.length<2)return;
  const map=window._dakMap;
  const type=_dakLineType;
  const startPt=_dakLinePts[0],endPt=_dakLinePts[1];
  const TYPE_COLS={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
  const TYPE_ICONS={nok:'🟠 Nok',goot:'🔵 Goot',kilkeper:'⚡ Kilkeper'};
  const col=TYPE_COLS[type]||'#6b7280';

  // Clean up phase-1 temp marker + rubber band
  _dakLineVerts.forEach(m=>map?.removeLayer(m));_dakLineVerts=[];
  if(_dakLinePrev&&map){map.removeLayer(_dakLinePrev);_dakLinePrev=null;}
  if(_dakRubberBand&&map){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}
  if(_dakTopoSnapNode){_topoSetNodeHighlight(_dakTopoSnapNode,false);_dakTopoSnapNode=null;}

  // Check length (reject tiny edges)
  const RC=111320;
  const dx=(endPt.lng-startPt.lng)*RC*Math.cos(startPt.lat*Math.PI/180);
  const dy=(endPt.lat-startPt.lat)*RC;
  const len=Math.hypot(dx,dy);
  if(len<0.5){_dakLinePts=[];_updateLineDrawUI();return;}

  // Multiple nok/goot/kilkeper segments allowed — no deletion of previous edges

  // Draw the edge: thin colored line
  const pts=[startPt,endPt];
  const layer=L.polyline(pts,{color:col,weight:3,opacity:.9,interactive:false}).addTo(map);

  // Compact length label — small pill near midpoint, no big badge
  const midPt=L.latLng((startPt.lat+endPt.lat)/2,(startPt.lng+endPt.lng)/2);
  const lbl=L.marker(midPt,{icon:L.divIcon({className:'',
    html:`<div style="background:${col};color:#fff;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800;white-space:nowrap;opacity:.9;pointer-events:none">${len.toFixed(1)}m</div>`,
    iconAnchor:[22,8]}),interactive:false,zIndexOffset:300}).addTo(map);

  // Create/get topology nodes at both endpoints
  const n1=_topoGetOrCreateNode(startPt.lat,startPt.lng);
  const n2=_topoGetOrCreateNode(endPt.lat,endPt.lng);

  const edgeId=++_topoEdgeIdCtr;
  const edgeObj={id:edgeId,type,n1id:n1.id,n2id:n2.id,pts,layer,lbl,len,endMarkers:[]};
  _dakTopoEdges.push(edgeObj);

  // Legacy slots: keep last drawn nok/goot for backward-compat measurement
  if(type==='nok')_dakNokLine={pts,layer,lbl,len,endMarkers:[]};
  else if(type==='goot')_dakGootLine={pts,layer,lbl,len,endMarkers:[]};

  // Detect faces
  _topoDetectFaces(edgeId);

  // ── CHAIN: ready for next edge starting from end node ──
  _dakLinePts=[endPt];

  _updateLineDrawUI();
  _topoRenderPanel();
  _dakUpdateTotalArea();

  // Status message
  const infoEl=document.getElementById('dak-draw-info');
  if(infoEl)infoEl.innerHTML=`<span style="color:${col};font-weight:800">${TYPE_ICONS[type]} ${len.toFixed(1)} m</span> <span style="color:var(--text-muted)">— klik volgend bolletje of ⬛ Stop</span>`;
}

function _updateLineDrawUI(){
  const drawing=!!_dakLineType;
  const hasStart=_dakLinePts.length===1;
  const finBtn=document.getElementById('btn-dak-line-finish');
  const undoBtn=document.getElementById('btn-dak-line-undo');
  if(finBtn){
    // Show stop button as soon as a line type is active
    finBtn.style.display=drawing?'':'none';
    finBtn.textContent='⬛ Stop';
    finBtn.style.background='#374151';finBtn.style.borderColor='#374151';finBtn.style.color='#fff';
  }
  // Show undo only when a start point is chosen (cancel the current phase-1 pick)
  if(undoBtn){
    undoBtn.style.display=drawing&&hasStart?'':'none';
    undoBtn.textContent='↩ Annuleer start';
  }
  if(!drawing){
    const infoEl=document.getElementById('dak-draw-info');
    if(infoEl&&!_dakDrawMode&&!_dakMeasureMode)infoEl.textContent='';
  }
}

// Render nok/goot measurement panel (falls through to topo panel if topo edges exist)
function _dakRenderNgPanel(){
  if(_dakTopoEdges.length>0){_topoRenderPanel();return;}
  const el=document.getElementById('dak-ng-panel');if(!el)return;
  const hasNok=!!_dakNokLine,hasGoot=!!_dakGootLine;
  if(!hasNok&&!hasGoot){el.innerHTML='';return;}

  const RC=111320;
  let run=0,slant=0;
  if(hasNok&&hasGoot){
    // Centroid of nok ↔ centroid of goot
    const nc=_lineCenter(_dakNokLine.pts),gc=_lineCenter(_dakGootLine.pts);
    const dx=(gc.lng-nc.lng)*RC*Math.cos(nc.lat*Math.PI/180),dy=(gc.lat-nc.lat)*RC;
    run=Math.hypot(dx,dy);
    const ang=parseInt(document.getElementById('dak-angle')?.value||0)||0;
    slant=ang>0?run/Math.cos(ang*Math.PI/180):run;
  }

  const angle=parseInt(document.getElementById('dak-angle')?.value||0)||0;
  const ovCm=parseInt(document.getElementById('dak-overstek')?.value||0)||0;
  const ovM=ovCm/100;

  // Area calculation (trapezoid formula)
  let area3D=0;
  if(hasNok&&hasGoot&&run>0){
    const nokL=_dakNokLine.len,gootL=_dakGootLine.len;
    const avgW=(nokL+gootL)/2;
    // Overstek adds to goot edge and sides proportionally
    const perimEst=2*(avgW+run);
    const ovArea=ovM>0?(perimEst*ovM+4*ovM*ovM):0;
    const flatArea=avgW*run+ovArea;
    area3D=angle>0?flatArea/Math.cos(angle*Math.PI/180):flatArea;
  }

  // Delete buttons
  const hasNokDel=hasNok?`<button onclick="_dakDeleteLine('nok')" style="background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:0 2px">🗑</button>`:'';
  const hasGootDel=hasGoot?`<button onclick="_dakDeleteLine('goot')" style="background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:0 2px">🗑</button>`:'';

  el.innerHTML=`<div style="background:#fffbeb;border:2px solid #f97316;border-radius:12px;padding:11px 13px;margin-top:6px">
    <div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:8px">📐 Nok / Goot meting</div>
    <table style="width:100%;border-collapse:collapse">
      ${hasNok?`<tr>
        <td style="font-size:11px;color:var(--text-muted);padding:3px 0;width:38%">🟠 Noklijn</td>
        <td style="font-size:12px;font-weight:800;padding:3px 0">${_dakNokLine.len.toFixed(1)} m</td>
        <td style="padding:3px 0;text-align:right">${hasNokDel}</td></tr>`:''}
      ${hasGoot?`<tr>
        <td style="font-size:11px;color:var(--text-muted);padding:3px 0">🔵 Gootlijn</td>
        <td style="font-size:12px;font-weight:800;padding:3px 0">${_dakGootLine.len.toFixed(1)} m</td>
        <td style="padding:3px 0;text-align:right">${hasGootDel}</td></tr>`:''}
      ${run>0?`<tr>
        <td style="font-size:11px;color:var(--text-muted);padding:3px 0">↔ Diepte (run)</td>
        <td style="font-size:12px;font-weight:800;padding:3px 0">${run.toFixed(2)} m</td>
        <td></td></tr>
      <tr>
        <td style="font-size:11px;color:var(--text-muted);padding:3px 0">↗ Schuine lengte</td>
        <td style="font-size:12px;font-weight:800;color:#16a34a;padding:3px 0">${slant.toFixed(2)} m <span style="font-size:10px;color:var(--text-muted)">(${angle}°)</span></td>
        <td></td></tr>`:''}
    </table>
    ${area3D>0?`<div style="margin-top:9px;padding-top:8px;border-top:1px solid #fbbf24;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;color:#92400e">= (${_dakNokLine.len.toFixed(1)}+${_dakGootLine.len.toFixed(1)})/2 × ${slant.toFixed(2)}${ovM>0?` + ${ovCm}cm overstek`:''}</span>
      <span style="font-size:18px;font-weight:900;color:#c2410c">${area3D.toFixed(1)} m²</span>
    </div>`:''}
    ${!hasNok||!hasGoot?`<div style="font-size:11px;color:#92400e;margin-top:4px;opacity:.7">Teken ook ${!hasNok?'de noklijn':'de gootlijn'} voor de volledige berekening</div>`:''}
  </div>`;
}

function _lineCenter(pts){
  return{lat:pts.reduce((s,p)=>s+p.lat,0)/pts.length,lng:pts.reduce((s,p)=>s+p.lng,0)/pts.length};
}

function _dakDeleteLine(type){
  const map=window._dakMap;
  const obj=type==='nok'?_dakNokLine:_dakGootLine;
  if(obj&&map){
    map.removeLayer(obj.layer);
    if(obj.lbl)map.removeLayer(obj.lbl);
    (obj.endMarkers||[]).forEach(m=>map.removeLayer(m));
  }
  if(type==='nok')_dakNokLine=null;else _dakGootLine=null;
  // Also remove matching topo edge(s)
  const toRemove=_dakTopoEdges.filter(e=>e.type===type);
  toRemove.forEach(e=>_topoDeleteEdge(e.id,true/*skipPanelUpdate*/));
  _dakRenderNgPanel();
  _dakUpdateTotalArea();
}

// Sum total length of all topo edges of a given type
function _topoLineLen(type){return _dakTopoEdges.filter(e=>e.type===type).reduce((s,e)=>s+e.len,0);}
// Count topo edges of a given type
function _topoLineCount(type){return _dakTopoEdges.filter(e=>e.type===type).length;}

// ════════════════════════════════════════════════════════════════════════════
//  TOPOLOGIE — bolletjes (nodes) + lijnen (edges) + dakvlakken (faces)
// ════════════════════════════════════════════════════════════════════════════

// Find nearest topo node within SNAP_M metres of (lat,lng)
function _topoFindNodeNear(lat,lng,excludeId){
  // Pixel-based snap — consistent at every zoom level (30 px radius)
  const map=window._dakMap;
  const SNAP_PX=30;
  if(!map||!_dakTopoNodes.length)return null;
  const curPx=map.latLngToContainerPoint(L.latLng(lat,lng));
  let best=null,bestD=SNAP_PX+1;
  for(const nd of _dakTopoNodes){
    if(nd.id===excludeId)continue;
    const ndPx=map.latLngToContainerPoint(L.latLng(nd.lat,nd.lng));
    const d=Math.hypot(curPx.x-ndPx.x,curPx.y-ndPx.y);
    if(d<=SNAP_PX&&d<bestD){bestD=d;best=nd;}
  }
  return best;
}

// Build the HTML for a node marker div
function _topoNodeHtml(id,snap){
  // snap=true: yellow glow + bigger; normal: small clean dot, no animation
  if(snap){
    return `<div id="topo-nd-${id}" style="width:28px;height:28px;border-radius:50%;background:#fef3c7;border:3px solid #f59e0b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#92400e;margin-left:-14px;margin-top:-14px;box-shadow:0 0 0 5px rgba(245,158,11,.35),0 2px 8px rgba(0,0,0,.5);animation:topoSnapPulse .65s infinite;cursor:pointer;user-select:none;transition:all .12s">${id}</div>`;
  }
  return `<div id="topo-nd-${id}" style="width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid #1e293b;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#1e293b;margin-left:-10px;margin-top:-10px;box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:pointer;user-select:none;transition:all .12s">${id}</div>`;
}

// Get existing node or create new one at (lat,lng)
function _topoGetOrCreateNode(lat,lng){
  const existing=_topoFindNodeNear(lat,lng);
  if(existing)return existing;
  const nd={id:++_topoNodeIdCtr,lat,lng,marker:null};
  if(window._dakMap){
    const m=L.marker([lat,lng],{
      icon:L.divIcon({className:'',html:_topoNodeHtml(nd.id,false),iconSize:[20,20],iconAnchor:[10,10]}),
      interactive:true,zIndexOffset:1200
    }).addTo(window._dakMap);
    // Direct click on bolletje — works in any line-draw mode
    m.on('click',ev=>{
      L.DomEvent.stop(ev);
      if(!_dakLineType)return; // ignore if not drawing a line
      const addPt=L.latLng(nd.lat,nd.lng);
      if(_dakLinePts.length===0){
        // Phase 1: choose start
        _dakLinePts=[addPt];
        _dakLineVerts.forEach(x=>window._dakMap?.removeLayer(x));_dakLineVerts=[];
        _topoSetNodeHighlight(nd,true);
        setTimeout(()=>_topoSetNodeHighlight(nd,false),700);
        _updateLineDrawUI();
        const infoEl=document.getElementById('dak-draw-info');
        const TYPE_COLS={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
        const col=TYPE_COLS[_dakLineType]||'#6b7280';
        const TYPE_ICONS={nok:'🟠 Nok',goot:'🔵 Goot',kilkeper:'⚡ Kilkeper'};
        if(infoEl)infoEl.innerHTML=`<span style="color:${col};font-weight:800">${TYPE_ICONS[_dakLineType]} start: bolletje ${nd.id}</span> — klik nu het eindbolletje`;
      } else {
        // Phase 2: choose end → complete edge
        _dakLinePts.push(addPt);
        _dakCompleteEdge();
      }
    });
    nd.marker=m;
  }
  _dakTopoNodes.push(nd);
  return nd;
}

// Highlight or un-highlight a topo node for snap indicator
function _topoSetNodeHighlight(nd,on){
  if(!nd)return;
  // Update via DOM if the element exists (fast path — avoids full icon redraw)
  const el=document.getElementById(`topo-nd-${nd.id}`);
  if(el){
    if(on){
      el.style.background='#fef3c7';el.style.borderColor='#f59e0b';
      el.style.animation='topoSnapPulse .65s infinite';
      el.style.boxShadow='0 0 0 5px rgba(245,158,11,.35),0 2px 8px rgba(0,0,0,.5)';
      el.style.width='28px';el.style.height='28px';el.style.marginLeft='-14px';el.style.marginTop='-14px';
      el.style.fontSize='11px';el.style.color='#92400e';
    } else {

      el.style.fontSize='9px';el.style.color='#1e293b';

  }
  // Fallback: replace icon entirely
  if(nd.marker)nd.marker.setIcon(L.divIcon({className:'',html:_topoNodeHtml(nd.id,on),iconSize:on?[28,28]:[20,20],iconAnchor:on?[14,14]:[10,10]}));
}

// BFS to find shortest cycle: start n1id→n2id→...→n1id, skipping skipEdgeId
function _topoFindFace(n1id,n2id,skipEdgeId){
  // Build adjacency
  const adj={};
  for(const e of _dakTopoEdges){
    if(e.id===skipEdgeId)continue;
    if(!adj[e.n1id])adj[e.n1id]=[];
    if(!adj[e.n2id])adj[e.n2id]=[];
    adj[e.n1id].push(e.n2id);
    adj[e.n2id].push(e.n1id);
  }
  // BFS from n2id back to n1id
  const queue=[{cur:n2id,path:[n1id,n2id]}];
  const visited=new Set([n1id,n2id]);
  while(queue.length){
    const{cur,path}=queue.shift();
    if(path.length>8)continue; // max 6-edge face
    for(const nb of(adj[cur]||[])){
      if(nb===n1id&&path.length>=3)return path; // closed loop found
      if(!visited.has(nb)){
        visited.add(nb);
        queue.push({cur:nb,path:[...path,nb]});
      }
    }
  }
  return null;
}

// After adding a new edge, check if any new face is formed
function _topoDetectFaces(newEdgeId){
  const edge=_dakTopoEdges.find(e=>e.id===newEdgeId);
  if(!edge)return;
  const nodeIds=_topoFindFace(edge.n1id,edge.n2id,newEdgeId);
  if(!nodeIds)return;
  // De-duplicate: check if face with this exact node set already exists
  const faceKey=[...nodeIds].sort((a,b)=>a-b).join(',');
  if(_dakTopoFaces.some(f=>[...f.nodeIds].sort((a,b)=>a-b).join(',')===faceKey))return;
  _topoCreateFace(nodeIds);
}

// Create a face polygon from an ordered list of nodeIds
function _topoCreateFace(nodeIds){
  const map=window._dakMap;if(!map)return;
  const pts=nodeIds.map(nid=>{
    const nd=_dakTopoNodes.find(n=>n.id===nid);
    return nd?{lat:nd.lat,lng:nd.lng}:null;
  }).filter(Boolean);
  if(pts.length<3)return;

  const area=_dakPolyAreaM2(pts);
  const defAngle=parseInt(document.getElementById('dak-angle')?.value||0)||0;
  const faceId=++_topoFaceIdCtr;
  // Cycle through face colours (different from edge colours)
  const FACE_BORDER=['#16a34a','#d97706','#dc2626','#7c3aed','#0891b2'];
  const strokeCol=FACE_BORDER[(faceId-1)%FACE_BORDER.length];

  const latlngs=pts.map(p=>[p.lat,p.lng]);
  const polyLayer=L.polygon(latlngs,{
    color:strokeCol,fillColor:strokeCol,fillOpacity:0.08, // very transparent — satellite still visible
    weight:2,dashArray:'6,3',interactive:false
  }).addTo(map);

  const sf=defAngle>0?1/Math.cos(defAngle*Math.PI/180):1;
  const corrected=area*sf;
  const cLat=pts.reduce((s,q)=>s+q.lat,0)/pts.length;
  const cLon=pts.reduce((s,q)=>s+q.lng,0)/pts.length;
  // Compact face label — just the area number
  const lbl=L.marker([cLat,cLon],{icon:L.divIcon({
    className:'',
    html:`<div id="topo-face-lbl-${faceId}" style="background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:900;white-space:nowrap;border:1.5px solid ${strokeCol}">${corrected.toFixed(1)} m²</div>`,
    iconAnchor:[36,12]
  }),interactive:false,zIndexOffset:200}).addTo(map);

  const face={id:faceId,nodeIds,polyLayer,lbl,area,angle:defAngle,overstek:null};
  _dakTopoFaces.push(face);
}

// Update label on a topo face (after angle/overstek change)
function _topoUpdateFaceLabel(faceId){
  const f=_dakTopoFaces.find(x=>x.id===faceId);if(!f||!window._dakMap)return;
  if(f.lbl)window._dakMap.removeLayer(f.lbl);
  const globalOvM=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;
  const pOvM=f.overstek!=null?f.overstek/100:globalOvM;
  const sf=f.angle>0?1/Math.cos(f.angle*Math.PI/180):1;
  const perim=_dakPolyPerimM(f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};}));
  const ovArea=pOvM>0?(perim*pOvM+4*pOvM*pOvM):0;
  const corrected=(f.area+ovArea)*sf;
  const pts=f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};});
  const cLat=pts.reduce((s,q)=>s+q.lat,0)/pts.length;
  const cLon=pts.reduce((s,q)=>s+q.lng,0)/pts.length;
  const FACE_BORDER=['#16a34a','#d97706','#dc2626','#7c3aed','#0891b2'];
  const strokeCol=FACE_BORDER[(f.id-1)%FACE_BORDER.length];
  f.lbl=L.marker([cLat,cLon],{icon:L.divIcon({
    className:'',
    html:`<div style="background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:900;white-space:nowrap;border:1.5px solid ${strokeCol}">${corrected.toFixed(1)} m²</div>`,
    iconAnchor:[36,12]
  }),interactive:false,zIndexOffset:200}).addTo(window._dakMap);
}

// Delete a topo edge (and orphan its nodes, remove any faces that used it)
function _topoDeleteEdge(edgeId,skipPanelUpdate){
  const map=window._dakMap;
  const ei=_dakTopoEdges.findIndex(e=>e.id===edgeId);if(ei<0)return;
  const edge=_dakTopoEdges[ei];
  if(edge.layer&&map)map.removeLayer(edge.layer);
  if(edge.lbl&&map)map.removeLayer(edge.lbl);
  (edge.endMarkers||[]).forEach(m=>map?.removeLayer(m));
  _dakTopoEdges.splice(ei,1);
  // Remove faces whose boundary is now broken (contains both endpoints of this edge consecutively)
  const facesToRemove=_dakTopoFaces.filter(f=>{
    const ni=f.nodeIds;
    for(let i=0;i<ni.length;i++){
      const a=ni[i],b=ni[(i+1)%ni.length];
      if((a===edge.n1id&&b===edge.n2id)||(a===edge.n2id&&b===edge.n1id))return true;
    }
    return false;
  });
  facesToRemove.forEach(f=>_topoDeleteFace(f.id,true));
  // Remove orphan nodes (nodes with no remaining edges)
  [edge.n1id,edge.n2id].forEach(nid=>{
    const stillUsed=_dakTopoEdges.some(e=>e.n1id===nid||e.n2id===nid);
    if(!stillUsed){
      const ni=_dakTopoNodes.findIndex(n=>n.id===nid);
      if(ni>=0){
        if(_dakTopoNodes[ni].marker&&map)map.removeLayer(_dakTopoNodes[ni].marker);
        _dakTopoNodes.splice(ni,1);
      }
    }
  });
  if(!skipPanelUpdate){_topoRenderPanel();_dakUpdateTotalArea();}
}

// Delete a topo face
function _topoDeleteFace(faceId,skipPanelUpdate){
  const map=window._dakMap;
  const fi=_dakTopoFaces.findIndex(f=>f.id===faceId);if(fi<0)return;
  const face=_dakTopoFaces[fi];
  if(face.polyLayer&&map)map.removeLayer(face.polyLayer);
  if(face.lbl&&map)map.removeLayer(face.lbl);
  _dakTopoFaces.splice(fi,1);
  if(!skipPanelUpdate){_topoRenderPanel();_dakUpdateTotalArea();}
}

// Set angle on a topo face
function _topoSetFaceAngle(faceId,angle){
  const f=_dakTopoFaces.find(x=>x.id===faceId);if(!f)return;
  f.angle=+angle;_topoUpdateFaceLabel(faceId);_topoRenderPanel();_dakUpdateTotalArea();
}

// Render the topology panel (replaces nok/goot panel when topo edges exist)
function _topoRenderPanel(){
  const el=document.getElementById('dak-ng-panel');if(!el)return;
  const hasEdges=_dakTopoEdges.length>0;
  const hasFaces=_dakTopoFaces.length>0;
  // If no topo data, fall back to legacy nok/goot panel
  if(!hasEdges){
    // Check for legacy lines
    if(_dakNokLine||_dakGootLine){
      // Render legacy nok/goot panel directly
      const hasNok=!!_dakNokLine,hasGoot=!!_dakGootLine;
      const RC=111320;let run=0,slant=0;
      if(hasNok&&hasGoot){
        const nc=_lineCenter(_dakNokLine.pts),gc=_lineCenter(_dakGootLine.pts);
        const dx=(gc.lng-nc.lng)*RC*Math.cos(nc.lat*Math.PI/180),dy=(gc.lat-nc.lat)*RC;
        run=Math.hypot(dx,dy);
        const ang=parseInt(document.getElementById('dak-angle')?.value||0)||0;
        slant=ang>0?run/Math.cos(ang*Math.PI/180):run;
      }
      const angle=parseInt(document.getElementById('dak-angle')?.value||0)||0;
      const ovCm=parseInt(document.getElementById('dak-overstek')?.value||0)||0;
      const ovM=ovCm/100;
      let area3D=0;
      if(hasNok&&hasGoot&&run>0){
        const nokL=_dakNokLine.len,gootL=_dakGootLine.len;
        const avgW=(nokL+gootL)/2;
        const perimEst=2*(avgW+run);
        const ovArea=ovM>0?(perimEst*ovM+4*ovM*ovM):0;
        const flatArea=avgW*run+ovArea;
        area3D=angle>0?flatArea/Math.cos(angle*Math.PI/180):flatArea;
      }
      el.innerHTML=`<div style="background:#fffbeb;border:2px solid #f97316;border-radius:12px;padding:11px 13px;margin-top:6px">
        <div style="font-size:12px;font-weight:800;color:#92400e;margin-bottom:8px">📐 Nok / Goot meting</div>
        <table style="width:100%;border-collapse:collapse">
          ${hasNok?`<tr><td style="font-size:11px;color:var(--text-muted);padding:3px 0;width:38%">🟠 Noklijn</td><td style="font-size:12px;font-weight:800;padding:3px 0">${_dakNokLine.len.toFixed(1)} m</td><td style="padding:3px 0;text-align:right"><button onclick="_dakDeleteLine('nok')" style="background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:0 2px">🗑</button></td></tr>`:''}
          ${hasGoot?`<tr><td style="font-size:11px;color:var(--text-muted);padding:3px 0">🔵 Gootlijn</td><td style="font-size:12px;font-weight:800;padding:3px 0">${_dakGootLine.len.toFixed(1)} m</td><td style="padding:3px 0;text-align:right"><button onclick="_dakDeleteLine('goot')" style="background:none;border:none;cursor:pointer;font-size:13px;opacity:.5;padding:0 2px">🗑</button></td></tr>`:''}
          ${run>0?`<tr><td style="font-size:11px;color:var(--text-muted);padding:3px 0">↔ Diepte</td><td style="font-size:12px;font-weight:800;padding:3px 0">${run.toFixed(2)} m</td><td></td></tr>
          <tr><td style="font-size:11px;color:var(--text-muted);padding:3px 0">↗ Schuine lengte</td><td style="font-size:12px;font-weight:800;color:#16a34a;padding:3px 0">${slant.toFixed(2)} m <span style="font-size:10px;color:var(--text-muted)">(${angle}°)</span></td><td></td></tr>`:''}
        </table>
        ${area3D>0?`<div style="margin-top:9px;padding-top:8px;border-top:1px solid #fbbf24;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;color:#92400e">= (${_dakNokLine.len.toFixed(1)}+${_dakGootLine.len.toFixed(1)})/2 × ${slant.toFixed(2)}</span>
          <span style="font-size:18px;font-weight:900;color:#c2410c">${area3D.toFixed(1)} m²</span>
        </div>`:''}
      </div>`;
    } else {
      el.innerHTML='';
    }
    return;
  }

  // ── Topology panel ──
  const TYPE_COLS={nok:'#f97316',goot:'#3b82f6',kilkeper:'#8b5cf6'};
  const TYPE_LABELS={nok:'🟠 Nok',goot:'🔵 Goot',kilkeper:'⚡ Kilkeper'};
  const globalOvM=(parseInt(document.getElementById('dak-overstek')?.value||0)||0)/100;

  let html=`<div style="background:#f5f3ff;border:2px solid #7c3aed;border-radius:12px;padding:11px 13px;margin-top:6px">
    <div style="font-size:12px;font-weight:800;color:#4c1d95;margin-bottom:8px">🔗 Dakstructuur — lijnen &amp; vlakken</div>`;

  // Edge list — per-type summary
  const _typeSums=['nok','goot','kilkeper'].filter(t=>_topoLineCount(t)>0);
  if(_typeSums.length>0){
    html+=`<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px">`;
    _typeSums.forEach(t=>{
      const col=TYPE_COLS[t]||'#6b7280',lbl=TYPE_LABELS[t]||t;
      const cnt=_topoLineCount(t),tot=_topoLineLen(t).toFixed(1);
      html+=`<div style="display:flex;align-items:center;gap:4px;padding:3px 8px;background:#fff;border-radius:20px;border:1.5px solid ${col}55;flex-shrink:0">
        <span style="width:8px;height:8px;border-radius:50%;background:${col}"></span>
        <span style="font-size:10px;font-weight:700;color:${col}">${lbl.replace(/^[^ ]+ /,'')}</span>
        <span style="font-size:10px;color:var(--text-muted)">${cnt}×</span>
        <span style="font-size:11px;font-weight:800;color:var(--text)">${tot} m</span>
      </div>`;
    });
    html+=`</div>`;
  }

  // Edge list
  html+=`<div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px">Lijnen (${_dakTopoEdges.length})</div>`;
  html+=`<div style="display:flex;flex-direction:column;gap:3px;margin-bottom:8px">`;
  _dakTopoEdges.forEach(e=>{
    const col=TYPE_COLS[e.type]||'#6b7280';
    const label=TYPE_LABELS[e.type]||e.type;
    html+=`<div style="display:flex;align-items:center;gap:6px;padding:4px 8px;background:#fff;border-radius:8px;border:1.5px solid #ede9fe">
      <span style="width:10px;height:10px;border-radius:3px;background:${col};flex-shrink:0"></span>
      <span style="font-size:11px;font-weight:700;color:${col};flex:1">${label}</span>
      <span style="font-size:10px;color:var(--text-muted)">🔵${e.n1id} → 🔵${e.n2id}</span>
      <span style="font-size:10px;color:var(--text-muted);min-width:38px;text-align:right">${e.len.toFixed(1)} m</span>
      <button onclick="_topoDeleteEdge(${e.id})" style="background:none;border:none;cursor:pointer;font-size:12px;opacity:.4;padding:0 2px" title="Verwijder lijn">🗑</button>
    </div>`;
  });
  html+=`</div>`;

  // Node info (compact)
  if(_dakTopoNodes.length>0){
    html+=`<div style="font-size:10px;color:var(--text-muted);margin-bottom:6px">⬤ ${_dakTopoNodes.length} knooppunt${_dakTopoNodes.length>1?'en':''} op de kaart</div>`;
  }

  // Face list
  if(hasFaces){
    html+=`<div style="font-size:11px;color:var(--text-muted);font-weight:700;margin-bottom:4px">Dakvlakken (${_dakTopoFaces.length})</div>`;
    html+=`<div style="display:flex;flex-direction:column;gap:5px">`;
    _dakTopoFaces.forEach(f=>{
      const pOvM=f.overstek!=null?f.overstek/100:globalOvM;
      const pts=f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};});
      const perim=_dakPolyPerimM(pts);
      const ovArea=pOvM>0?(perim*pOvM+4*pOvM*pOvM):0;
      const sf=f.angle>0?1/Math.cos(f.angle*Math.PI/180):1;
      const corrected=(f.area+ovArea)*sf;
      const FACE_BORDER=['#16a34a','#d97706','#dc2626','#7c3aed','#0891b2'];
      const strokeCol=FACE_BORDER[(f.id-1)%FACE_BORDER.length];
      const isPlat=f.angle===0;
      html+=`<div style="padding:6px 9px;background:#fff;border-radius:9px;border:2px solid ${strokeCol}40">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
          <span style="width:10px;height:10px;border-radius:50%;background:${strokeCol};flex-shrink:0"></span>
          <span style="font-size:11px;font-weight:800;flex:1">Dakvlak ${f.id}</span>
          <span style="font-size:10px;color:var(--text-muted)">${f.area.toFixed(1)} m² plat</span>
          <span style="font-size:14px;font-weight:900;color:${strokeCol}">${corrected.toFixed(1)} m²</span>
          <button onclick="_topoDeleteFace(${f.id})" style="background:none;border:none;cursor:pointer;font-size:12px;opacity:.4;padding:0 2px" title="Verwijder vlak">🗑</button>
        </div>
        <div style="display:flex;align-items:center;gap:5px">
          <span style="font-size:10px;color:var(--text-muted);min-width:38px">Helling</span>
          <button onclick="_topoToggleFaceFlat(${f.id})"
            style="padding:2px 7px;border-radius:5px;border:1px solid ${isPlat?'var(--primary)':'var(--border)'};background:${isPlat?'var(--primary)':'#fff'};color:${isPlat?'#fff':'var(--text-muted)'};font-size:9px;font-weight:700;cursor:pointer">${isPlat?'✓ Plat':'Plat'}</button>
          <input type="range" min="5" max="70" step="1" value="${isPlat?30:f.angle}"
            style="flex:1;accent-color:${strokeCol};height:3px;${isPlat?'opacity:.3;pointer-events:none':''}"
            oninput="_topoSetFaceAngle(${f.id},+this.value)">
          <span style="font-size:10px;font-weight:800;color:${strokeCol};min-width:26px">${isPlat?'—':f.angle+'°'}</span>
          <span style="font-size:9px;color:var(--text-muted)">${isPlat?'geen':'×'+sf.toFixed(2)}</span>
        </div>
      </div>`;
    });
    html+=`</div>`;
    // Total faces (with optional ×2 symmetrisch)
    const symDoubleP=document.getElementById('dak-sym-double')?.checked||false;

      const pOvM2=f.overstek!=null?f.overstek/100:globalOvM;
      const pts2=f.nodeIds.map(nid=>{const nd=_dakTopoNodes.find(n=>n.id===nid);return nd||{lat:0,lng:0};});
      const perim2=_dakPolyPerimM(pts2);
      const ovArea2=pOvM2>0?(perim2*pOvM2+4*pOvM2*pOvM2):0;
      const sf2=f.angle>0?1/Math.cos(f.angle*Math.PI/180):1;
      return s+(f.area+ovArea2)*sf2;
    },0)*symMultP;
    html+=`<div style="margin-top:7px;padding-top:7px;border-top:2px solid #c4b5fd;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;font-weight:700;color:#4c1d95">Totaal${symDoubleP?' (×2 sym.)':''}</span>
      <span style="font-size:17px;font-weight:900;color:#7c3aed">${faceTotal.toFixed(1)} m²</span>
    </div>`;
  } else {
    html+=`<div style="font-size:11px;color:#6d28d9;opacity:.75;padding:6px 0">💡 Verbind lijnen via bolletjes — gesloten lussen worden automatisch dakvlakken</div>`;
  }

  html+=`</div>`;
  el.innerHTML=html;
}

function _topoToggleFaceFlat(faceId){
  const f=_dakTopoFaces.find(x=>x.id===faceId);if(!f)return;
  f.angle=f.angle===0?(parseInt(document.getElementById('dak-angle')?.value||0)||30):0;
  _topoUpdateFaceLabel(faceId);_topoRenderPanel();_dakUpdateTotalArea();
}

function _dakClearAll(){
  const map=window._dakMap;
  _dakPolygons.forEach(p=>{
    map.removeLayer(p.layer);
    if(p.lbl)map.removeLayer(p.lbl);
    (p.edgeMidMarkers||[]).forEach(m=>map.removeLayer(m));
    (p.edgeOverlays||[]).forEach(l=>map.removeLayer(l));
  });
  _dakPolygons=[];
  if(_dakCurLine){map.removeLayer(_dakCurLine);_dakCurLine=null;}
  _dakCurMarkers.forEach(m=>map.removeLayer(m));_dakCurMarkers=[];
  _dakMeasureLayers.forEach(l=>map.removeLayer(l));_dakMeasureLayers=[];_dakMeasurePts=[];
  // Nok/goot legacy lines
  [_dakNokLine,_dakGootLine].forEach(obj=>{if(obj){map.removeLayer(obj.layer);if(obj.lbl)map.removeLayer(obj.lbl);(obj.endMarkers||[]).forEach(m=>map.removeLayer(m));}});
  _dakNokLine=null;_dakGootLine=null;
  // Topology: edges, nodes, faces
  _dakTopoEdges.forEach(e=>{if(e.layer)map.removeLayer(e.layer);if(e.lbl)map.removeLayer(e.lbl);(e.endMarkers||[]).forEach(m=>map.removeLayer(m));});
  _dakTopoNodes.forEach(n=>{if(n.marker)map.removeLayer(n.marker);});
  _dakTopoFaces.forEach(f=>{if(f.polyLayer)map.removeLayer(f.polyLayer);if(f.lbl)map.removeLayer(f.lbl);});
  _dakTopoEdges=[];_dakTopoNodes=[];_dakTopoFaces=[];_topoNodeIdCtr=0;_topoEdgeIdCtr=0;_topoFaceIdCtr=0;_dakTopoSnapNode=null;
  _dakCancelLineDraw();
  _dakDrawMode=false;_dakCurPts=[];_dakMeasureMode=false;_dakSnapActive=false;
  if(_dakRubberBand){map.removeLayer(_dakRubberBand);_dakRubberBand=null;}

}

function _dakUpdateTotalArea(){
  const hasPolys=_dakPolygons.length>0;
  const hasNokGoot=!!(window._dakNokLine&&window._dakGootLine);
  const hasTopoEdges=_dakTopoEdges.length>0;
  const hasAny=hasPolys||hasNokGoot||!!_dakNokLine||!!_dakGootLine||hasTopoEdges;
  // non-null = trigger overridden blocks in calcDakOpp
  _dak3Dm2Override=hasPolys?1:(hasNokGoot||hasTopoEdges?1:null);
  calcDakOpp();
  // Show/hide clear button
  const clearBtn=document.getElementById('btn-dak-clear');
  if(clearBtn)clearBtn.style.display=hasAny?'':'none';
}

function _dakPolyAreaM2(pts){
  // Shoelace formula in metres on WGS84 (accurate for small polygons)
  const RC=111320;
  let a=0;
  const n=pts.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const xi=pts[i].lng*RC*Math.cos(pts[i].lat*Math.PI/180);
    const yi=pts[i].lat*RC;
    const xj=pts[j].lng*RC*Math.cos(pts[j].lat*Math.PI/180);
    const yj=pts[j].lat*RC;
    a+=xi*yj-xj*yi;
  }
  return Math.abs(a)/2;
}
function _dakPolyPerimM(pts){
  // Perimeter in metres on WGS84
  const RC=111320;
  let p=0;
  const n=pts.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    const dx=(pts[j].lng-pts[i].lng)*RC*Math.cos(pts[i].lat*Math.PI/180);
    const dy=(pts[j].lat-pts[i].lat)*RC;
    p+=Math.hypot(dx,dy);
  }
  return p;
}

// ── Canvas 3D math helpers (no external dependencies) ─────────────────────
function _cTriArea(v0,v1,v2){
  const e1=[v1[0]-v0[0],v1[1]-v0[1],v1[2]-v0[2]];
  const e2=[v2[0]-v0[0],v2[1]-v0[1],v2[2]-v0[2]];
  const cx=e1[1]*e2[2]-e1[2]*e2[1], cy=e1[2]*e2[0]-e1[0]*e2[2], cz=e1[0]*e2[1]-e1[1]*e2[0];
  return Math.hypot(cx,cy,cz)*0.5;
}
function _cQuadArea(v0,v1,v2,v3){return _cTriArea(v0,v1,v2)+_cTriArea(v0,v2,v3);}
function _cFaceNormal(verts){
  const [v0,v1,v2]=verts;
  const e1=[v1[0]-v0[0],v1[1]-v0[1],v1[2]-v0[2]];
  const e2=[v2[0]-v0[0],v2[1]-v0[1],v2[2]-v0[2]];
  const n=[e1[1]*e2[2]-e1[2]*e2[1], e1[2]*e2[0]-e1[0]*e2[2], e1[0]*e2[1]-e1[1]*e2[0]];
  const L=Math.hypot(...n)||1;return n.map(v=>v/L);
}

// ── Canvas-based 3D scene — no external dependencies ──────────────────────
function _simpleOrbit_UNUSED(canvas,camera,target,initRadius){
  let r=initRadius,th=0.6,ph=0.9,drag=false,lx=0,ly=0;
  const upd=()=>{
    camera.position.set(
      target.x+r*Math.sin(ph)*Math.sin(th),
      target.y+r*Math.cos(ph),
      target.z+r*Math.sin(ph)*Math.cos(th)
    );
    camera.lookAt(target);
  };
  canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  canvas.addEventListener('mousemove',e=>{
    if(!drag)return;
    th-=(e.clientX-lx)*0.012;
    ph=Math.max(0.12,Math.min(Math.PI*0.88,ph-(e.clientY-ly)*0.012));
    lx=e.clientX;ly=e.clientY;upd();
  });
  canvas.addEventListener('mouseup',()=>drag=false);
  canvas.addEventListener('mouseleave',()=>drag=false);
  canvas.addEventListener('wheel',e=>{r=Math.max(2,Math.min(r*1.12,r+(e.deltaY>0?1:-1)*r*0.15));upd();},{passive:true});
  // Touch support
  let pts={},lastDist=0;
  canvas.addEventListener('touchstart',e=>{
    [...e.touches].forEach(t=>pts[t.identifier]={x:t.clientX,y:t.clientY});
    if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.hypot(dx,dy);}
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    if(e.touches.length===1){
      const t=e.touches[0],p=pts[t.identifier]||{x:t.clientX,y:t.clientY};
      th-=(t.clientX-p.x)*0.012;
      ph=Math.max(0.12,Math.min(Math.PI*0.88,ph-(t.clientY-p.y)*0.012));
      pts[t.identifier]={x:t.clientX,y:t.clientY};upd();
    }else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.hypot(dx,dy);r=Math.max(2,r*(lastDist/d));lastDist=d;upd();
    }
  },{passive:true});
  upd();
  return {update:()=>{}};
}

// ── Build EXACT 3D model from 3D BAG CityJSON (LOD 2.2) ──────────────────
function _buildFromCityJSON(cj){
  const faces=[];
  let ri=0;

  // Dequantize vertices: stored as integers, transform to RD New meters
  const sc=cj.transform?.scale||[1,1,1];
  const tr=cj.transform?.translate||[0,0,0];
  const rawV=(cj.vertices||[]).map(([x,y,z])=>[x*sc[0]+tr[0],y*sc[1]+tr[1],z*sc[2]+tr[2]]);
  if(!rawV.length)return null;

  // Centroid in RD New (easting=X, northing=Y, elevation=Z)
  const cxRD=rawV.reduce((s,[x])=>s+x,0)/rawV.length;
  const cyRD=rawV.reduce((s,[,y])=>s+y,0)/rawV.length;
  const minElev=Math.min(...rawV.map(v=>v[2]));
  // Canvas coords: X=east, Y=up(elev), Z=north
  const cv=([rx,ry,rz])=>[rx-cxRD, rz-minElev, ry-cyRD];

  // Ground plane (use easting+northing for horizontal extent, not elevation)
  const ext=Math.max(15,...rawV.map(([rx,ry])=>Math.max(Math.abs(rx-cxRD),Math.abs(ry-cyRD))))*2.5;
  faces.push({v:[[-ext,0,-ext],[ext,0,-ext],[ext,0,ext],[-ext,0,ext]],n:[0,1,0],cat:'ground'});

  // Find best available LOD geometry
  const LOD_PREF=['2.2','2.1','1.3','1.2'];
  let bestGeom=null;
  for(const obj of Object.values(cj.CityObjects||{})){
    for(const pref of LOD_PREF){
      const g=(obj.geometry||[]).find(g=>String(g.lod)===pref);
      if(g){bestGeom=g;break;}
    }
    if(bestGeom)break;
  }
  if(!bestGeom)return null;

  // Flat face list: Solid → outer shell; MultiSurface → direct
  const faceList=bestGeom.type==='Solid'?bestGeom.boundaries[0]:bestGeom.boundaries;
  if(!faceList?.length)return null;

  // Semantic surface types (roof/wall/ground labelling from 3D BAG)
  const semTypes=[];
  const sem=bestGeom.semantics;
  if(sem?.surfaces&&sem?.values){
    const flatV=(bestGeom.type==='Solid'?sem.values[0]:sem.values)||[];
    flatV.forEach((v,i)=>{semTypes[i]=(v!=null)?sem.surfaces[v]?.type:null;});
  }

  for(let fi=0;fi<faceList.length;fi++){
    const ring=faceList[fi]?.[0]; // outer ring; ignore holes
    if(!ring||ring.length<3)continue;
    const verts=ring.map(idx=>cv(rawV[idx]));
    const n=_cFaceNormal(verts);

    const st=semTypes[fi]||null;
    const isRoof=st==='RoofSurface'||(st===null&&n[1]>0.25);
    const isGround=st==='GroundSurface'||(st===null&&n[1]<-0.25);
    if(isGround)continue;

    if(isRoof){
      // Area via fan triangulation (handles arbitrary polygon)
      let area=0;
      for(let k=1;k<verts.length-1;k++)area+=_cTriArea(verts[0],verts[k],verts[k+1]);
      const lbl='Dakvlak '+(ri+1);
      faces.push({v:verts,n,cat:'roof',ri,lbl,area});
      _dak3DFaces.push({userData:{label:lbl,area}});
      _dak3DFaceAreas.push(area);
      _dak3DSelected.add(ri);ri++;
    }else{
      faces.push({v:verts,n,cat:'wall'});
    }
  }
  return ri>0?faces:null;
}

// ── Convert BAG lon/lat ring to local X/Z meter coordinates ───────────────
function _ringToLocal(ring,lat0){
  const RC=111320,cosL=Math.cos(lat0*Math.PI/180);
  const cx=ring.reduce((s,c)=>s+c[0],0)/ring.length;
  const cz=ring.reduce((s,c)=>s+c[1],0)/ring.length;
  let pts=ring.map(c=>[(c[0]-cx)*cosL*RC,(c[1]-cz)*RC]);
  // Remove duplicate closing point
  if(pts.length>1){const[ax,az]=pts[0],[bx,bz]=pts[pts.length-1];if(Math.abs(ax-bx)<0.05&&Math.abs(az-bz)<0.05)pts=pts.slice(0,-1);}
  return pts;
}

// ── Build realistic 3D geometry from actual BAG footprint polygon ──────────
function _buildFromRing(ring,lat0,wallH,angle,type){
  const pts=_ringToLocal(ring,lat0);
  const ar=angle*Math.PI/180;
  const eY=wallH;
  const faces=[];
  let ri=0;

  const _roof=(v,lbl)=>{
    const area=v.length===3?_cTriArea(...v):_cQuadArea(...v);
    faces.push({v,n:_cFaceNormal(v),cat:'roof',ri,lbl,area});
    _dak3DFaces.push({userData:{label:lbl,area}});
    _dak3DFaceAreas.push(area);
    _dak3DSelected.add(ri);ri++;
  };

  // Ground plane
  const ext=Math.max(15,...pts.map(([x,z])=>Math.max(Math.abs(x),Math.abs(z))))*2.5;
  faces.push({v:[[-ext,0,-ext],[ext,0,-ext],[ext,0,ext],[-ext,0,ext]],n:[0,1,0],cat:'ground'});

  // Centroid for outward-normal calculation
  const cxP=pts.reduce((s,[x])=>s+x,0)/pts.length;
  const czP=pts.reduce((s,[,z])=>s+z,0)/pts.length;

  // Walls: one quad per polygon edge, normal computed outward via centroid test
  for(let i=0;i<pts.length;i++){
    const[x0,z0]=pts[i],[x1,z1]=pts[(i+1)%pts.length];
    const eLen=Math.hypot(x1-x0,z1-z0);
    if(eLen<0.1)continue;
    const v=[[x0,0,z0],[x1,0,z1],[x1,eY,z1],[x0,eY,z0]];
    // Outward normal: perpendicular to edge, pointing away from polygon interior
    let nx=(z1-z0)/eLen,nz=-(x1-x0)/eLen;
    const emx=(x0+x1)/2-cxP,emz=(z0+z1)/2-czP;
    if(nx*emx+nz*emz<0){nx=-nx;nz=-nz;}
    faces.push({v,n:[nx,0,nz],cat:'wall'});
  }

  // ── Oriented Bounding Box for roof (via PCA) ────────────────────────────
  let Cxx=0,Czz=0,Cxz=0;
  pts.forEach(([x,z])=>{const dx=x-cxP,dz=z-czP;Cxx+=dx*dx;Czz+=dz*dz;Cxz+=dx*dz;});
  Cxx/=pts.length;Czz/=pts.length;Cxz/=pts.length;
  // PCA eigenangle: main axis (ridge direction) = longest dimension
  const th=Math.atan2(2*Cxz,Cxx-Czz)*0.5;
  const cosT=Math.cos(th),sinT=Math.sin(th);
  const us=pts.map(([x,z])=>x*cosT+z*sinT);
  const vs=pts.map(([x,z])=>-x*sinT+z*cosT);
  const uMin=Math.min(...us),uMax=Math.max(...us);
  const vMin=Math.min(...vs),vMax=Math.max(...vs);
  const hw=(uMax-uMin)/2,hd=(vMax-vMin)/2;
  const uCtr=(uMin+uMax)/2,vCtr=(vMin+vMax)/2;
  // OBB-local (u=along ridge, v=slope direction) → world (x,y,z)
  const W3=(u,v,y)=>[cxP+(uCtr+u)*cosT-(vCtr+v)*sinT,y,czP+(uCtr+u)*sinT+(vCtr+v)*cosT];

  // ── Roof geometry ───────────────────────────────────────────────────────
  switch(type){
    case 'plat':
      _roof([W3(-hw,-hd,eY),W3(hw,-hd,eY),W3(hw,hd,eY),W3(-hw,hd,eY)],'Plat dak');
      break;
    case 'zadel':{
      const rY=eY+hd*Math.tan(ar);
      // Two slopes: v=+hd→0 (front) and v=0→-hd (back)
      _roof([W3(-hw,hd,eY),W3(hw,hd,eY),W3(hw,0,rY),W3(-hw,0,rY)],'Helling A');
      _roof([W3(-hw,0,rY),W3(hw,0,rY),W3(hw,-hd,eY),W3(-hw,-hd,eY)],'Helling B');
      // Gable end walls
      const gA=[W3(-hw,-hd,eY),W3(-hw,hd,eY),W3(-hw,0,rY)];
      const gB=[W3(hw,hd,eY),W3(hw,-hd,eY),W3(hw,0,rY)];
      faces.push({v:gA,n:_cFaceNormal(gA),cat:'wall'});
      faces.push({v:gB,n:_cFaceNormal(gB),cat:'wall'});
      break;
    }
    case 'lessenaar':{
      const hiY=eY+hd*2*Math.tan(ar);
      _roof([W3(-hw,-hd,eY),W3(hw,-hd,eY),W3(hw,hd,hiY),W3(-hw,hd,hiY)],'Dakhelling');
      break;
    }
    case 'schild':{
      const rY=eY+hd*Math.tan(ar),rl=Math.max(hw-hd,0.4);
      _roof([W3(-hw,hd,eY),W3(hw,hd,eY),W3(rl,0,rY),W3(-rl,0,rY)],'Helling A');
      _roof([W3(-rl,0,rY),W3(rl,0,rY),W3(hw,-hd,eY),W3(-hw,-hd,eY)],'Helling B');
      _roof([W3(hw,hd,eY),W3(hw,-hd,eY),W3(rl,0,rY)],'Helling C');
      _roof([W3(-hw,-hd,eY),W3(-hw,hd,eY),W3(-rl,0,rY)],'Helling D');
      break;
    }
  }

  // ── Windows & door on each wall edge ───────────────────────────────────
  const stories=Math.max(1,Math.round(eY/3.2));
  const flH=eY/stories;
  const WO=0.04;
  for(let i=0;i<pts.length;i++){
    const[x0,z0]=pts[i],[x1,z1]=pts[(i+1)%pts.length];
    const eLen=Math.hypot(x1-x0,z1-z0);
    if(eLen<1.6)continue;
    const ex=(x1-x0)/eLen,ez=(z1-z0)/eLen;
    let nx=(z1-z0)/eLen,nz=-(x1-x0)/eLen;
    const emx=(x0+x1)/2-cxP,emz=(z0+z1)/2-czP;
    if(nx*emx+nz*emz<0){nx=-nx;nz=-nz;}
    const nWins=eLen>5.5?3:eLen>3?2:1;
    const isDoor=i===0&&eLen>2.5;
    for(let s=0;s<stories;s++){
      const yB=s*flH+flH*0.22,yT=s*flH+flH*0.70;
      if(yT>eY-0.3)continue;
      for(let wi=0;wi<nWins;wi++){
        const t=(wi+1)/(nWins+1);
        const wcx=x0+ex*eLen*t+nx*WO,wcz=z0+ez*eLen*t+nz*WO;
        if(isDoor&&wi===Math.floor(nWins/2)&&s===0){
          const dw=Math.min(0.6,eLen*0.1),dh=Math.min(flH*0.62,2.1);
          faces.push({v:[[wcx-dw*ex,0,wcz-dw*ez],[wcx+dw*ex,0,wcz+dw*ez],[wcx+dw*ex,dh,wcz+dw*ez],[wcx-dw*ex,dh,wcz-dw*ez]],n:[nx,0,nz],cat:'door'});
        }else{
          const hw_w=Math.min(0.52,eLen*0.1);
          faces.push({v:[[wcx-hw_w*ex,yB,wcz-hw_w*ez],[wcx+hw_w*ex,yB,wcz+hw_w*ez],[wcx+hw_w*ex,yT,wcz+hw_w*ez],[wcx-hw_w*ex,yT,wcz-hw_w*ez]],n:[nx,0,nz],cat:'window'});
        }
      }
    }
  }
  return faces;
}

// ── Build face geometry data for canvas renderer ──────────────────────────
function _buildCanvasFaces(W,D,wallH,angle,type){
  const ar=angle*Math.PI/180;
  let bW=W,bD=D;if(D>W){bW=D;bD=W;}
  const hw=bW/2,hd=bD/2,eY=wallH;
  const faces=[];
  let ri=0;
  const wall=(v)=>faces.push({v,n:_cFaceNormal(v),cat:'wall'});
  const roof=(v,lbl)=>{
    const area=v.length===3?_cTriArea(...v):_cQuadArea(...v);
    faces.push({v,n:_cFaceNormal(v),cat:'roof',ri,lbl,area});
    _dak3DFaces.push({userData:{label:lbl,area}});
    _dak3DFaceAreas.push(area);
    _dak3DSelected.add(ri);
    ri++;
  };
  // Ground
  faces.push({v:[[-hw*2,0,-hd*2],[hw*2,0,-hd*2],[hw*2,0,hd*2],[-hw*2,0,hd*2]],n:[0,1,0],cat:'ground'});
  // Walls
  wall([[-hw,0,hd],[hw,0,hd],[hw,eY,hd],[-hw,eY,hd]]);
  wall([[hw,0,-hd],[-hw,0,-hd],[-hw,eY,-hd],[hw,eY,-hd]]);
  wall([[-hw,0,-hd],[-hw,0,hd],[-hw,eY,hd],[-hw,eY,-hd]]);
  wall([[hw,0,hd],[hw,0,-hd],[hw,eY,-hd],[hw,eY,hd]]);
  // Roof
  switch(type){
    case 'plat':{
      roof([[-hw,eY,-hd],[hw,eY,-hd],[hw,eY,hd],[-hw,eY,hd]],'Plat dak');
      break;
    }
    case 'zadel':{
      const rY=eY+hd*Math.tan(ar);
      roof([[-hw,eY,hd],[hw,eY,hd],[hw,rY,0],[-hw,rY,0]],'Helling A');
      roof([[-hw,rY,0],[hw,rY,0],[hw,eY,-hd],[-hw,eY,-hd]],'Helling B');
      wall([[-hw,eY,-hd],[-hw,eY,hd],[-hw,rY,0]]);
      wall([[hw,eY,hd],[hw,eY,-hd],[hw,rY,0]]);
      break;
    }
    case 'lessenaar':{
      const hiY=eY+bD*Math.tan(ar);
      roof([[-hw,eY,-hd],[hw,eY,-hd],[hw,hiY,hd],[-hw,hiY,hd]],'Dakhelling');
      break;
    }
    case 'schild':{
      const rY=eY+hd*Math.tan(ar),rl=Math.max(bW-bD,0.5)/2;
      roof([[-hw,eY,hd],[hw,eY,hd],[rl,rY,0],[-rl,rY,0]],'Helling A');
      roof([[-rl,rY,0],[rl,rY,0],[hw,eY,-hd],[-hw,eY,-hd]],'Helling B');
      roof([[hw,eY,hd],[hw,eY,-hd],[rl,rY,0]],'Helling C');
      roof([[-hw,eY,-hd],[-hw,eY,hd],[-rl,rY,0]],'Helling D');
      break;
    }
  }

  // ── Windows & door (decorative, not selectable) ────────────────────────
  const stories=Math.max(1,Math.round(eY/3.2));
  const flH=eY/stories;
  const win=(v)=>faces.push({v,n:_cFaceNormal(v),cat:'window'});
  const door=(v)=>faces.push({v,n:_cFaceNormal(v),cat:'door'});
  const wOff=0.03; // push windows slightly outside walls to avoid z-fight
  // Front wall windows (z=+hd)
  for(let s=0;s<stories;s++){
    const yB=s*flH+flH*0.25, yT=s*flH+flH*0.75;
    if(s===0){// ground floor: door + 1 window
      door([[-hw*0.12,0,hd+wOff],[hw*0.12,0,hd+wOff],[hw*0.12,flH*0.65,hd+wOff],[-hw*0.12,flH*0.65,hd+wOff]]);
      win([[hw*0.25,yB,hd+wOff],[hw*0.55,yB,hd+wOff],[hw*0.55,yT,hd+wOff],[hw*0.25,yT,hd+wOff]]);
      win([[-hw*0.55,yB,hd+wOff],[-hw*0.25,yB,hd+wOff],[-hw*0.25,yT,hd+wOff],[-hw*0.55,yT,hd+wOff]]);
    } else {
      win([[-hw*0.55,yB,hd+wOff],[-hw*0.2,yB,hd+wOff],[-hw*0.2,yT,hd+wOff],[-hw*0.55,yT,hd+wOff]]);
      win([[hw*0.2,yB,hd+wOff],[hw*0.55,yB,hd+wOff],[hw*0.55,yT,hd+wOff],[hw*0.2,yT,hd+wOff]]);
    }
  }
  // Back wall windows (z=-hd, normals flipped)
  for(let s=0;s<stories;s++){
    const yB=s*flH+flH*0.25, yT=s*flH+flH*0.75;
    win([[hw*0.55,yB,-hd-wOff],[hw*0.2,yB,-hd-wOff],[hw*0.2,yT,-hd-wOff],[hw*0.55,yT,-hd-wOff]]);
    win([[-hw*0.2,yB,-hd-wOff],[-hw*0.55,yB,-hd-wOff],[-hw*0.55,yT,-hd-wOff],[-hw*0.2,yT,-hd-wOff]]);
  }
  // Side wall windows (x=+hw / x=-hw) — 1 per story
  for(let s=0;s<stories;s++){
    const yB=s*flH+flH*0.25, yT=s*flH+flH*0.75;
    win([[hw+wOff,yB,-hd*0.25],[hw+wOff,yB,hd*0.25],[hw+wOff,yT,hd*0.25],[hw+wOff,yT,-hd*0.25]]);
    win([[-hw-wOff,yB,hd*0.25],[-hw-wOff,yB,-hd*0.25],[-hw-wOff,yT,-hd*0.25],[-hw-wOff,yT,hd*0.25]]);
  }

  return faces;
}

// ── Point-in-polygon (2D) ────────────────────────────────────────────────
function _cPtInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}

// ── Canvas 3D renderer ────────────────────────────────────────────────────
function _buildDak3DScene(rd){
  const container=document.getElementById('dak-3d-container');
  if(!container)return;

  if(_dak3DFrameId){cancelAnimationFrame(_dak3DFrameId);_dak3DFrameId=null;}
  container.innerHTML='';
  _dak3DFaces=[];_dak3DFaceAreas=[];_dak3DSelected=new Set();

  const W=rd.W||8,D=rd.D||6,wallH=rd.wallH||6,angle=rd.angle||0,type=rd.type||'zadel';
  const dpr=window.devicePixelRatio||1;
  const cW=Math.max(container.clientWidth||0,300),cH=300;
  container.style.height=cH+'px';

  const cvs=document.createElement('canvas');
  cvs.width=cW*dpr;cvs.height=cH*dpr;
  cvs.style.cssText=`width:${cW}px;height:${cH}px;display:block;touch-action:none;cursor:grab`;
  container.appendChild(cvs);
  const ctx=cvs.getContext('2d');
  ctx.scale(dpr,dpr);

  // Build all face data: 1) exact 3D BAG mesh  2) real footprint  3) simple box
  let faces=null;
  if(rd.cityjson){faces=_buildFromCityJSON(rd.cityjson);}
  if(!faces&&rd.ring&&rd.lat0&&rd.ring.length>=4){faces=_buildFromRing(rd.ring,rd.lat0,wallH,angle,type);}
  if(!faces){faces=_buildCanvasFaces(W,D,wallH,angle,type);}
  _updateDak3Dm2();

  // ── Projection helpers ─────────────────────────────────────────────────
  let rotY=0.72,rotX=0.52,hoverRi=-1;
  // Compute span from building faces only (exclude ground plane which is huge)
  const _bldFaces=faces.filter(f=>f.cat!=='ground');
  const _allX=_bldFaces.flatMap(f=>f.v.map(v=>v[0]));
  const _allY=_bldFaces.flatMap(f=>f.v.map(v=>v[1]));
  const _allZ=_bldFaces.flatMap(f=>f.v.map(v=>v[2]));
  const _bldW=_allX.length?Math.max(..._allX)-Math.min(..._allX):W;
  const _bldD=_allZ.length?Math.max(..._allZ)-Math.min(..._allZ):D;
  const _bldH=_allY.length?Math.max(..._allY):wallH;
  const span=Math.max(_bldW,_bldD,_bldH*1.2,4);
  const scale=Math.min(cW,cH)/(span*2.2);
  // Centre slightly lower so roof doesn't get clipped
  const ocx=cW*0.5, ocy=cH*0.46;
  // Perspective distance (larger = less distortion)
  const PDIST=span*4.5;

  const proj=(verts)=>{
    const cosX=Math.cos(rotX),sinX=Math.sin(rotX);
    const cosY=Math.cos(rotY),sinY=Math.sin(rotY);
    return verts.map(([x,y,z])=>{
      // Rotate Y (horizontal turntable)
      const x1=x*cosY+z*sinY,y1=y,z1=-x*sinY+z*cosY;
      // Rotate X (camera tilt downward)
      const x2=x1,y2=y1*cosX-z1*sinX,z2=y1*sinX+z1*cosX;
      // Perspective divide
      const pf=PDIST/(PDIST+z2*0.7);
      return [ocx+x2*scale*pf, ocy-y2*scale*pf, z2];
    });
  };

  // ── Light direction ────────────────────────────────────────────────────
  const LD=[0.45,0.75,0.5];
  const LDlen=Math.hypot(...LD);
  const LDn=LD.map(v=>v/LDlen);

  const shade=(n,rX,rY)=>{
    const cosX=Math.cos(rX),sinX=Math.sin(rX),cosY=Math.cos(rY),sinY=Math.sin(rY);
    const x1=n[0]*cosY+n[2]*sinY,y1=n[1],z1=-n[0]*sinY+n[2]*cosY;
    const x2=x1,y2=y1*cosX-z1*sinX;
    const nx2=x2,ny2=y2,nz2=y1*sinX+z1*cosX;
    return Math.max(0.22,nx2*LDn[0]+ny2*LDn[1]+nz2*LDn[2]);
  };

  // Face colors — realistic house palette
  const COLS={
    roof_on:[34,197,94],        // green selected
    roof_off:[110,85,65],       // terracotta tile unselected
    roof_hover_on:[80,230,130],
    roof_hover_off:[145,115,90],
    wall:[210,195,175],         // light cream/plaster
    wall_dark:[185,165,145],    // shaded wall side
    ground:[75,105,60],
    gutter:[80,80,80],
  };

  // ── Render ─────────────────────────────────────────────────────────────
  const render=()=>{
    ctx.clearRect(0,0,cW,cH);

    // Sky-to-ground gradient background
    const bg=ctx.createLinearGradient(0,0,0,cH);
    bg.addColorStop(0,'#1c3a5e');   // deep blue sky top
    bg.addColorStop(0.55,'#2d5f8a'); // horizon blue
    bg.addColorStop(0.7,'#3d7a3d');  // grass horizon
    bg.addColorStop(1,'#2a5520');    // darker grass bottom
    ctx.fillStyle=bg;ctx.fillRect(0,0,cW,cH);
    // Subtle vignette
    const vg=ctx.createRadialGradient(cW*0.5,cH*0.45,cW*0.2,cW*0.5,cH*0.45,cW*0.75);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,cW,cH);

    // Grid lines on ground (subtle)
    ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
    for(let i=-4;i<=4;i++){
      const pa=proj([[i*W*0.4,-0.02,-D*2],[i*W*0.4,-0.02,D*2]]);
      const pb=proj([[-W*2,-0.02,i*D*0.4],[W*2,-0.02,i*D*0.4]]);
      ctx.beginPath();ctx.moveTo(pa[0][0],pa[0][1]);ctx.lineTo(pa[1][0],pa[1][1]);ctx.stroke();
      ctx.beginPath();ctx.moveTo(pb[0][0],pb[0][1]);ctx.lineTo(pb[1][0],pb[1][1]);ctx.stroke();
    }

    // Project + depth-sort all faces
    const pfaces=faces.map(f=>{
      const pv=proj(f.v);
      const depth=pv.reduce((s,v)=>s+v[2],0)/pv.length;
      return {...f,pv,depth};
    }).sort((a,b)=>a.depth-b.depth);

    pfaces.forEach(f=>{
      const pv=f.pv;
      // Back-face cull (2D cross product of first two edges)
      const cross=(pv[1][0]-pv[0][0])*(pv[2][1]-pv[0][1])-(pv[1][1]-pv[0][1])*(pv[2][0]-pv[0][0]);
      if(cross>0)return;

      const s=shade(f.n,rotX,rotY);
      let base;
      if(f.cat==='roof'){
        const on=_dak3DSelected.has(f.ri);
        const hov=f.ri===hoverRi;
        base=on?(hov?COLS.roof_hover_on:COLS.roof_on):(hov?COLS.roof_hover_off:COLS.roof_off);
      }else if(f.cat==='wall'){
        // Slightly differentiate shaded side walls
        base=s<0.6?COLS.wall_dark:COLS.wall;
      }else if(f.cat==='window'){base=[110,148,185];}
      else if(f.cat==='door'){base=[95,62,38];}
      else base=COLS.ground;

      const r=Math.round(base[0]*s),g=Math.round(base[1]*s),b2=Math.round(base[2]*s);
      const alpha=(f.cat==='roof'&&!_dak3DSelected.has(f.ri))?0.72:1;

      ctx.beginPath();
      ctx.moveTo(pv[0][0],pv[0][1]);
      for(let i=1;i<pv.length;i++)ctx.lineTo(pv[i][0],pv[i][1]);
      ctx.closePath();

      ctx.fillStyle=`rgba(${r},${g},${b2},${alpha})`;
      ctx.fill();

      // ── Texture overlays ───────────────────────────────────────────────
      if(f.cat==='roof'){
        // Tile rows — horizontal clip-masked lines
        const minPY=Math.min(...pv.map(p=>p[1]));
        const maxPY=Math.max(...pv.map(p=>p[1]));
        const tSpc=Math.max(3.5,scale*0.38);
        ctx.save();
        ctx.beginPath();pv.forEach((p,i)=>{i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});ctx.closePath();ctx.clip();
        ctx.strokeStyle='rgba(0,0,0,0.13)';ctx.lineWidth=0.6;
        for(let ty=minPY;ty<=maxPY;ty+=tSpc){ctx.beginPath();ctx.moveTo(0,ty);ctx.lineTo(cW,ty);ctx.stroke();}
        ctx.restore();
      }
      if(f.cat==='wall'&&f.v.length===4){
        // Brick mortar lines — subtle horizontal bands
        const minPY=Math.min(...pv.map(p=>p[1]));
        const maxPY=Math.max(...pv.map(p=>p[1]));
        const bSpc=Math.max(2.5,scale*0.22);
        ctx.save();
        ctx.beginPath();pv.forEach((p,i)=>{i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});ctx.closePath();ctx.clip();
        ctx.strokeStyle='rgba(0,0,0,0.07)';ctx.lineWidth=0.5;
        for(let by=minPY;by<=maxPY;by+=bSpc){ctx.beginPath();ctx.moveTo(0,by);ctx.lineTo(cW,by);ctx.stroke();}
        ctx.restore();
        // Gutter — dark thick line along wall top edge (vertices [2] and [3])
        ctx.save();
        ctx.strokeStyle='rgba(30,30,30,0.55)';ctx.lineWidth=2.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(pv[2][0],pv[2][1]);ctx.lineTo(pv[3][0],pv[3][1]);ctx.stroke();
        ctx.restore();
      }

      // Edge glow for roof faces
      if(f.cat==='roof'){
        const on=_dak3DSelected.has(f.ri);
        ctx.strokeStyle=on?'rgba(200,255,200,0.7)':'rgba(80,55,40,0.5)';
        ctx.lineWidth=on?2:0.8;
        ctx.stroke();
      }else if(f.cat==='window'){
        // Window frame + cross bar
        ctx.strokeStyle='rgba(220,235,255,0.6)';ctx.lineWidth=1.5;ctx.stroke();
        const wcx=pv.reduce((a,p)=>a+p[0],0)/pv.length;
        const wcy=pv.reduce((a,p)=>a+p[1],0)/pv.length;
        const pyMin=Math.min(...pv.map(p=>p[1])),pyMax=Math.max(...pv.map(p=>p[1]));
        const pxMin=Math.min(...pv.map(p=>p[0])),pxMax=Math.max(...pv.map(p=>p[0]));
        ctx.save();
        ctx.beginPath();pv.forEach((p,i)=>{i===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]);});ctx.closePath();ctx.clip();
        ctx.strokeStyle='rgba(220,235,255,0.5)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(wcx,pyMin);ctx.lineTo(wcx,pyMax);ctx.stroke();
        ctx.beginPath();ctx.moveTo(pxMin,wcy);ctx.lineTo(pxMax,wcy);ctx.stroke();
        ctx.restore();
      }else if(f.cat==='door'){
        ctx.strokeStyle='rgba(60,35,15,0.5)';ctx.lineWidth=1;ctx.stroke();
        // Door handle
        const dcx=pv.reduce((a,p)=>a+p[0],0)/pv.length;
        const dcy=pv.reduce((a,p)=>a+p[1],0)/pv.length;
        ctx.save();ctx.fillStyle='rgba(220,180,80,0.9)';
        ctx.beginPath();ctx.arc(dcx+2,dcy+2,Math.max(1.5,scale*0.06),0,Math.PI*2);ctx.fill();
        ctx.restore();
      }else if(f.cat!=='roof'){
        ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=0.5;ctx.stroke();
      }

      // Labels on roof faces
      if(f.cat==='roof'){
        const cx2=pv.reduce((s,p)=>s+p[0],0)/pv.length;
        const cy2=pv.reduce((s,p)=>s+p[1],0)/pv.length;
        const on=_dak3DSelected.has(f.ri);
        const area=_dak3DFaceAreas[f.ri]||0;
        if(area>1){
          ctx.save();
          ctx.textAlign='center';ctx.textBaseline='middle';
          const fs=Math.max(11,Math.min(17,scale*1.5));
          ctx.font=`900 ${fs}px system-ui,sans-serif`;
          ctx.shadowColor='rgba(0,0,0,0.9)';ctx.shadowBlur=4;
          ctx.fillStyle=on?'#ffffff':'rgba(255,235,215,0.55)';
          ctx.fillText(area.toFixed(0)+' m²',cx2,cy2+(on?-8:0));
          if(on){
            ctx.font=`bold ${fs-3}px system-ui,sans-serif`;
            ctx.fillStyle='rgba(210,255,210,0.9)';
            ctx.fillText(f.lbl,cx2,cy2+9);
          }
          ctx.shadowBlur=0;
          ctx.restore();
        }
      }
    });

    // Status bar at bottom
    ctx.save();
    const nSel=_dak3DSelected.size,nTot=_dak3DFaces.length;
    const totM2=_dak3DFaceAreas.reduce((s,a,i)=>s+(_dak3DSelected.has(i)?a:0),0);
    ctx.fillStyle='rgba(0,0,0,0.55)';
    ctx.fillRect(0,cH-30,cW,30);
    ctx.font='bold 11px system-ui,sans-serif';
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(`${nSel}/${nTot} vlakken · ${totM2.toFixed(1)} m²`,10,cH-15);
    ctx.textAlign='right';
    ctx.fillStyle='rgba(255,255,255,0.32)';
    ctx.fillText('🖱 slepen=draaien  klik=selecteren',cW-10,cH-15);
    // North indicator top-right
    ctx.save();
    const ncx=cW-18,ncy=22;
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();ctx.arc(ncx,ncy,14,0,Math.PI*2);ctx.fill();
    // Compass arrow pointing north (up in world = +Z = projected slightly back depending on camera)
    // Just show fixed N label
    ctx.font='bold 10px system-ui';ctx.fillStyle='rgba(255,80,80,0.9)';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('N',ncx,ncy-4);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='8px system-ui';ctx.fillText('↑',ncx,ncy+4);
    ctx.restore();
    ctx.restore();
  };

  _dak3DCanvasRender=render;

  // ── Hit test ───────────────────────────────────────────────────────────
  const hitTest=(mx,my)=>{
    const pfaces=faces.filter(f=>f.cat==='roof').map(f=>{
      const pv=proj(f.v);
      const depth=pv.reduce((s,v)=>s+v[2],0)/pv.length;
      const cross=(pv[1][0]-pv[0][0])*(pv[2][1]-pv[0][1])-(pv[1][1]-pv[0][1])*(pv[2][0]-pv[0][0]);
      return {...f,pv,depth,culled:cross>0};
    }).filter(f=>!f.culled).sort((a,b)=>b.depth-a.depth);
    for(const f of pfaces){
      if(_cPtInPoly(mx,my,f.pv.map(p=>[p[0],p[1]])))return f.ri;
    }
    return -1;
  };

  // ── Interaction ────────────────────────────────────────────────────────
  let dragging=false,lx=0,ly=0,dragPx=0;

  cvs.addEventListener('mousedown',e=>{dragging=true;dragPx=0;lx=e.offsetX;ly=e.offsetY;cvs.style.cursor='grabbing';});
  cvs.addEventListener('mousemove',e=>{
    if(dragging){
      rotY+=(e.offsetX-lx)*0.009;
      rotX=Math.max(0.08,Math.min(1.25,rotX-(e.offsetY-ly)*0.009));
      lx=e.offsetX;ly=e.offsetY;
      dragPx+=Math.abs(e.movementX||1)+Math.abs(e.movementY||1);
    }else{
      const h=hitTest(e.offsetX,e.offsetY);
      if(h!==hoverRi){hoverRi=h;render();}
      cvs.style.cursor=h>=0?'pointer':'grab';
    }
    if(dragging)render();
  });
  cvs.addEventListener('mouseup',e=>{
    dragging=false;cvs.style.cursor='grab';
    if(dragPx<8){
      const ri=hitTest(e.offsetX,e.offsetY);
      if(ri>=0){
        if(_dak3DSelected.has(ri))_dak3DSelected.delete(ri);else _dak3DSelected.add(ri);
        _updateDak3Dm2();
      }
    }
    render();
  });
  cvs.addEventListener('mouseleave',()=>{dragging=false;hoverRi=-1;render();});

  // Touch
  let tStart={x:0,y:0},tPts=0;
  cvs.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){tStart={x:e.touches[0].clientX,y:e.touches[0].clientY};lx=tStart.x;ly=tStart.y;dragPx=0;}
    tPts=e.touches.length;
  },{passive:false});
  cvs.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1){
      const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;
      rotY+=dx*0.012;rotX=Math.max(0.08,Math.min(1.25,rotX-dy*0.012));
      lx=e.touches[0].clientX;ly=e.touches[0].clientY;
      dragPx+=Math.abs(dx)+Math.abs(dy);
      render();
    }
  },{passive:false});
  cvs.addEventListener('touchend',e=>{
    e.preventDefault();
    if(dragPx<12&&tPts===1){
      const t=e.changedTouches[0];
      const r=cvs.getBoundingClientRect();
      const mx=(t.clientX-r.left)*(cW/r.width),my=(t.clientY-r.top)*(cH/r.height);
      const ri=hitTest(mx,my);
      if(ri>=0){
        if(_dak3DSelected.has(ri))_dak3DSelected.delete(ri);else _dak3DSelected.add(ri);
        _updateDak3Dm2();render();
      }
    }
  },{passive:false});

  render();
}

let _calWeeks=1;

      </div>

    </div>`;
  }).join('');
  const empty=`<div style="text-align:center;padding:24px 0;color:var(--text-muted);font-size:13px">Geen openstaande klussen in deze periode</div>`;

function exportICS(){
  const td=today();
  const cutoff=addDays(td,84); // 12 weken vooruit
  const future=jobs.filter(j=>j.date&&j.date>=td&&j.date<=cutoff&&j.status!=='afgerond');
  if(!future.length){toast('Geen toekomstige klussen om te exporteren');return;}

  function icsDate(dateStr,timeStr){
    // Returns TZID formatted datetime or DATE
    const d=dateStr.replace(/-/g,'');
    if(!timeStr)return{type:'DATE',val:d};
    const t=timeStr.replace(':','')+'00';
    return{type:'DATETIME',val:d+'T'+t};
  }
  function icsEscape(s){return(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
  function icsWrap(line){
    // iCal spec: fold lines > 75 chars
    const out=[];let cur=line;
    while(cur.length>75){out.push(cur.slice(0,75));cur=' '+cur.slice(75);}
    out.push(cur);return out.join('\r\n');
  }

  const now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//CleanSoft Portal//NL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:CleanSoft Klussen','X-WR-TIMEZONE:Europe/Amsterdam'];

  future.sort((a,b)=>a.date.localeCompare(b.date)).forEach(job=>{
    const c=getCust(job.custId);if(!c)return;
    const wl=workLbl(job.work).join(', ')||'Glasbewassing';
    const summary=`${wl} – ${c.name}`;
    const start=icsDate(job.date,job.time);
    const dur=job.duration||60;
    let dtStart,dtEnd;
    if(start.type==='DATE'){
      dtStart='DTSTART;VALUE=DATE:'+start.val;
      const nextDay=addDays(job.date,1).replace(/-/g,'');
      dtEnd='DTEND;VALUE=DATE:'+nextDay;
    } else {
      dtStart='DTSTART;TZID=Europe/Amsterdam:'+start.val;
      const[h,m]=job.time.split(':').map(Number);
      const endMins=h*60+m+dur;
      const eH=String(Math.floor(endMins/60)%24).padStart(2,'0');
      const eM=String(endMins%60).padStart(2,'0');
      dtEnd='DTEND;TZID=Europe/Amsterdam:'+job.date.replace(/-/g,'')+'T'+eH+eM+'00';
    }
    const desc=[
      c.address?'Adres: '+c.address:'',
      c.phone?'Tel: '+c.phone:'',
      wl?'Werk: '+wl:'',
      c.price?'Prijs: €'+c.price:'',
      job.notes?'Notitie: '+job.notes:'',
    ].filter(Boolean).join('\\n');

    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+job.id+'@cleansoft-portal');
    lines.push('DTSTAMP:'+now);
    lines.push(dtStart);
    lines.push(dtEnd);
    lines.push(icsWrap('SUMMARY:'+icsEscape(summary)));
    lines.push(icsWrap('DESCRIPTION:'+icsEscape(desc)));
    if(c.address)lines.push(icsWrap('LOCATION:'+icsEscape(c.address)));
    lines.push('STATUS:CONFIRMED');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');

  const ics=lines.join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cleansoft-klussen-'+td+'.ics';a.click();
  toast('📅 Kalenderbestand gedownload ('+future.length+' klussen)');
}

const WEATHER_ICONS={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const WEATHER_DESC={0:'Helder',1:'Overwegend helder',2:'Deels bewolkt',3:'Bewolkt',45:'Mist',48:'Mist',51:'Lichte motregen',53:'Motregen',55:'Zware motregen',61:'Lichte regen',63:'Regen',65:'Zware regen',71:'Lichte sneeuw',73:'Sneeuw',75:'Zware sneeuw',80:'Buien',81:'Zware buien',82:'Stortbui',95:'Onweer',96:'Onweer met hagel',99:'Zwaar onweer'};
async function fetchWeather(){
  const now=Date.now();
  if(weatherCache.ts&&now-weatherCache.ts<3600000)return weatherCache.data;
  try{
    // Use Netherlands centre coords as default (can improve with home postcode later)
    const lat=settings.homePostcode?52.1+(parseInt(settings.homePostcode,10)-1000)/8000*3:52.3;
    const lon=5.1;
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(2)}&longitude=${lon.toFixed(2)}&daily=weathercode,temperature_2m_max,precipitation_sum&timezone=Europe%2FAmsterdam&forecast_days=7`;
    const r=await fetch(url);const d=await r.json();
    const data=d.daily.time.map((t,i)=>({date:t,code:d.daily.weathercode[i],maxTemp:Math.round(d.daily.temperature_2m_max[i]),rain:d.daily.precipitation_sum[i]}));
    weatherCache={ts:now,data};
    return data;
  }catch(e){return null;}
}
function isRainyDay(d){
  // WMO codes 51+ = precipitation; or >2mm rain
  return d&&(d.code>=51||d.rain>2);
}
function injectWeather(data){
  if(!data)return;
  // Weather labels in day headers
  document.querySelectorAll('[data-weather-date]').forEach(el=>{
    const d=data.find(x=>x.date===el.dataset.weatherDate);
    if(d)el.innerHTML=`<span title="${WEATHER_DESC[d.code]||''}">${WEATHER_ICONS[d.code]||'🌡️'} ${d.maxTemp}°${d.rain>2?' 💧':''}</span>`;
  });
  // Rain warning on week-view day headers
  document.querySelectorAll('[data-rain-hdr]').forEach(el=>{
    const date=el.dataset.rainHdr;
    const d=data.find(x=>x.date===date);
    if(!d||!isRainyDay(d))return;
    const hasJobs=jobs.some(j=>j.date===date);
    if(!hasJobs)return;
    // Add rain badge if not already there
    if(!el.querySelector('.rain-badge')){
      const badge=document.createElement('span');
      badge.className='rain-badge';
      badge.style.cssText='font-size:10px;background:#dbeafe;color:#1d4ed8;border-radius:6px;padding:2px 6px;font-weight:800;white-space:nowrap';
      badge.textContent='🌧️ Regen verwacht';
      el.querySelector('span:first-child').after(badge);
    }
  });
  // Rain banner on vandaag/morgen
  [today(),tomorrow()].forEach(date=>{
    const banner=document.getElementById('rain-banner-'+date);
    if(!banner)return;
    const d=data.find(x=>x.date===date);
    if(!d||!isRainyDay(d))return;
    banner.innerHTML=`<div style="background:#dbeafe;border:1.5px solid #3b82f6;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px">
      <span style="font-size:20px">🌧️</span>
      <div><div style="font-size:13px;font-weight:800;color:#1d4ed8">Regen verwacht — ${d.rain.toFixed(1)}mm · ${d.maxTemp}°C</div>
      <div style="font-size:11px;color:#3b82f6">Overweeg klussen te verzetten of klanten te informeren</div></div>
    </div>`;
  });
}

async function geocodeAddress(addr){
  if(!addr)return null;
  if(geocodeCache[addr])return geocodeCache[addr];
  try{
    const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=nl&q='+encodeURIComponent(addr);
    const r=await fetch(url,{headers:{'Accept-Language':'nl'}});
    const d=await r.json();
    if(d&&d[0]){
      const pos={lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)};
      geocodeCache[addr]=pos;
      localStorage.setItem('gp_geocache',JSON.stringify(geocodeCache));
      return pos;
    }
  }catch(e){}
  return null;
}

    L.marker([pos.lat,pos.lng],{icon}).addTo(map).bindPopup(popup);

// Route-sort: nearest-neighbor vanuit thuisbasis (of vorig adres)
// Geeft gesorteerde array van {cust, ...rest} terug
function _routeSortCustomers(custList,startAddr){
  if(custList.length<=1)return custList;
  const remaining=[...custList];
  const sorted=[];
  let curAddr=startAddr||settings.homeAddress||'';
  while(remaining.length>0){
    let bestIdx=0,bestMin=Infinity;
    remaining.forEach((p,i)=>{
      const addr=p.cust?.address||p.address||'';
      const m=travelMin(curAddr,addr);
      if(m<bestMin){bestMin=m;bestIdx=i;}
    });
    sorted.push(remaining[bestIdx]);
    curAddr=remaining[bestIdx].cust?.address||remaining[bestIdx].address||'';
    remaining.splice(bestIdx,1);
  }
  return sorted;
}

// Verander minuten naar tijdstring, startend vanuit starttijd (default 07:00)
function _minsToTime(totalMins){
  const h=Math.floor(totalMins/60),m=totalMins%60;
  return `${String(Math.min(h,16)).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function _planCustomersOnDate(customers,date){
  let count=0;
  const startAddr=settings.homeAddress||'';

  // Filter dubbelen eruit (klant heeft al gepland/concept op deze dag)
  const toplan=customers.filter(p=>{
    const custId=p.cust?.id||p.id;
    return custId&&!jobs.some(j=>j.custId===custId&&j.status!=='afgerond'&&j.date===date);
  });
  if(!toplan.length)return 0;

  // ── Route-optimalisatie ingebouwd: nearest-neighbor vanuit thuisbasis
  const routeSorted=_routeSortCustomers(toplan,startAddr);

  // ── Tijdslots op basis van reistijd + geschatte klusuur
  const START_MIN=7*60; // 07:00
  const JOB_MIN=45;     // gem. klusduur glasbuiten
  let curMin=START_MIN;
  let curAddr=startAddr;

  routeSorted.forEach(p=>{
    const custId=p.cust?.id||p.id;
    const addr=p.cust?.address||'';
    const reisMin=curAddr?travelMin(curAddr,addr):0;
    curMin+=reisMin;
    const time=_minsToTime(curMin);
    // Gebruik werktypen van de meest recente afgeronde klus van deze klant
    const lastDone=jobs.filter(j=>j.custId===custId&&j.status==='afgerond'&&(j.work||[]).length)
      .sort((a,b)=>b.date.localeCompare(a.date))[0];
    const work=(lastDone?.work)||['glasbuiten'];
    jobs.push({
      id:uid(),custId,date,time,
      status:'gepland',
      work,mats:[],
      notes:'📍 AI — wijk + route',
      created:new Date().toISOString()
    });
    curMin+=JOB_MIN;
    curAddr=addr;
    count++;
  });
  return count;
}

function applyRoute(dateStr){
  const result=aiOptimizeRoute(dateStr);
  if(!result.route.length)return;
  // Bereken tijdslots op basis van reistijd (zelfde logica als _planCustomersOnDate)
  const START_MIN=7*60;
  const JOB_MIN=45;
  let curMin=START_MIN;
  let curAddr=settings.homeAddress||'';
  result.route.forEach(r=>{
    const j=getJob(r.job.id);
    const c=getCust(r.job.custId);
    const addr=c?.address||'';
    const reisMin=curAddr?travelMin(curAddr,addr):0;
    curMin+=reisMin;
    if(j)j.time=_minsToTime(curMin);
    curMin+=JOB_MIN;
    curAddr=addr;
  });
  saveAll();toast('✅ Route opgeslagen — tijden bijgewerkt!');
}

let _tt;
function toast(msg){
  const t=document.getElementById('toast');if(!t)return;
  clearTimeout(_tt);t.textContent=msg;t.style.display='block';
  t.style.animation='none';t.offsetHeight;t.style.animation='toastIn .25s ease-out';

let _roosterScanWorker=null, _roosterScanWeek=null, _pendingBlocks=null;

function openRoosterScan(worker, weekOffset){
  if(!settings.claudeApiKey){
    showModal(`

      </p>
      <button class="btn btn-primary btn-block" onclick="closeModal();nav('settings')">⚙️ Naar instellingen</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal()" style="margin-top:8px">Annuleren</button>
    `);

  }
  _roosterScanWorker=worker;

    </p>

             display:flex;flex-direction:column;align-items:center;justify-content:center;
             text-align:center;padding:20px 16px;color:var(--text-muted);font-size:13px;
             background:var(--primary-light);line-height:1.7;cursor:pointer"
      onclick="triggerRoosterFileDirect()">
      <div style="font-size:28px;margin-bottom:6px">${isMobile?'📲':'📋'}</div>
      ${isMobile
        ? '<b style="color:var(--primary)">Tik hier om foto te kiezen</b><br><span style="font-size:12px">of plak via lang indrukken → Plakken</span>'
        : '<b style="color:var(--primary)">Klik of druk Ctrl+V om te plakken</b><br><span style="font-size:12px">Sleep een afbeelding hierheen of klik om te kiezen</span>'}
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin:12px 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>

    </div>

    </button>

  `);
